schema: unum-lattice-news/repository-custody/v0.8
status: ACTIVE
updated: 2026-08-30
purpose: >-
  Provide one machine-readable custody surface for the consolidated public Lattice,
  its internal lifecycle states and routing lenses, and its genuine external specialist
  crossings. Former Lattice-specific satellites are donor/recovery surfaces rather than
  parallel active authorities.

prime_laws:
  - UNUM_Lattice_News_is_one_active_public_reality_mesh
  - UNUM_Research_is_the_ecology_wide_external_retrieval_request_and_reentry_head
  - internal_lens_is_not_independent_truth_authority
  - lifecycle_state_is_not_domain_identity
  - external_specialist_repository_owns_genuinely_distinct_domain_study
  - evidence_updates_only_the_claim_edge_variable_or_model_component_it_bears_on
  - repeated_projection_or_route_copy_is_not_independent_corroboration
  - rhetorical_label_is_evidence_the_label_was_used_not_proof_the_classification_is_true
  - world_state_transition_and_evidence_state_transition_remain_distinct
  - repository_or_folder_boundary_is_not_causal_boundary
  - nothing_crosses_without_provenance_scope_uncertainty_and_return_path
  - private_sensitive_or_sealed_material_does_not_bulk_cross_into_public_core
  - former_satellite_material_is_adopted_semantically_not_blind_merged

research_front_door:
  repository: UNUM-Research
  role: external_retrieval_request_identity_source_recovery_routing_provenance_and_reentry
  owns:
    - external_lookup_request_identity
    - literature_web_and_reference_retrieval_heads
    - cross_repository_route_history
    - retrieval_provenance
    - return_and_watch_conditions
  does_not_own:
    - Lattice_local_substantive_public_reality_study
    - destination_domain_conclusion
    - automatic_promotion_into_UNUM_Lattice_News

active_lattice:
  repository: UNUM-Lattice-News
  visibility: public
  role: durable_reviewed_public_reality_mesh_plus_public_safe_internal_review_lifecycle
  owns:
    - public_safe_news_evidence_staging
    - reviewed_public_events
    - reviewed_source_identity_and_lineage_suitable_for_public_custody
    - reviewed_claims_and_claim_posture
    - chronology_and_clocks
    - public_state_transitions
    - harms_and_consequences
    - causal_and_accountability_relations
    - recomposed_meshes_and_maps
    - scoped_high_confidence_harm_states
    - uncertainty_and_missingness
    - corrections
  does_not_own:
    - generic_ecology_wide_external_research_request_routing
    - every_specialist_domain_analysis
    - private_sensitive_sealed_or_victim_identifying_material_merely_for_centralization

internal_lifecycle:
  public_intake_review:
    home: intake/
    role: public_safe_pre_durable_evidence_review
  evidence_survival:
    home: evidence/
    role: public_safe_source_identity_lineage_access_and_reentry
  durable_event:
    home: stories/
  bounded_claim:
    home: claims/
  mesh_relation:
    home: lattice/
  confirmed_harm:
    home: harm/confirmed/
    promotion_only: true
    locks:
      - high_confidence_is_claim_specific
      - neighboring_motive_intent_legality_membership_or_magnitude_claims_do_not_auto_promote
      - correction_and_demotion_remain_live
  review:
    home: reviews/
  correction:
    home: CORRECTIONS.md

internal_lenses:
  registry: registries/LATTICE_INTERNAL_ROUTING.yaml
  lenses:
    - GEOPOLITICS
    - CAPITAL_POWER
    - HUMANITARIAN_ENVIRONMENTAL
    - TRAFFICKING
    - POLICY_MECHANISM
  rules:
    - record_may_activate_multiple_lenses
    - lens_routes_questions_gates_and_discriminators
    - lens_does_not_duplicate_evidence_lineage
    - lens_name_does_not_establish_its_named_conclusion

external_specialist_routes:
  - repository: UNUM-Governance
    route_when:
      - authority_law_procedure_enforcement_oversight_resistance_or_appeal_is_material

  - repository: UNUM-Hierarchy-and-Supremacy-Studies
    route_when:
      - ranked_group_status_unequal_entitlement_or_supremacy_mechanism_requires_deep_study

  - repository: UNUM-Laundering-Map
    route_when:
      - rhetoric_framing_legitimacy_reputation_or_selective_omission_transforms_accountability_read

  - repository: UNUM-Extremism-Watch
    route_when:
      - extremist_movement_ideology_lineage_propaganda_organization_or_normalization_requires_deep_study

  - repository: UNUM-Human-Relations
    route_when:
      - interpersonal_dependency_grooming_conformity_culture_or_relational_coercion_requires_deep_study

  - repository: UNUM-Universal-Translation
    route_when:
      - original_language_register_ambiguity_or_translation_loss_is_material

  - repository: UNUM-Earth-Environmental-Ecology
    route_when:
      - environmental_system_place_scale_exposure_or_ecological_mechanism_requires_specialist_study

  - repository: UNUM-Medical
    route_when:
      - organism_health_clinical_or_biological_mechanism_requires_specialist_study

  - repository: UNUM-Chemistry
    route_when:
      - contaminant_reaction_composition_or_material_pathway_requires_specialist_study

  - repository: UNUM-Engineering
    route_when:
      - infrastructure_design_failure_mechanism_or_technical_system_requires_specialist_study

  - repository: UNUM-Human-AI-Alliance
    route_when:
      - human_ai_governance_rights_dependency_or_relational_consequence_requires_specialist_study

shared_support_routes:
  - repository: UNUM-Timeline-Studies
    role: routed_chronology_clock_and_temporal_identity_study_service
  - repository: UNUM-Universal-Translation
    role: semantic_and_language_seat_preservation_service
  - repository: UNUM-Tools-Utilities
    role: reusable_instrument_schema_and_validation_service
  - repository: UNUM-Archives
    role: frozen_publication_history_and_historical_return_surface

former_lattice_satellites:
  - repository: UNUM-Lattice-News-Intake
    state: DONOR_RECOVERY
    absorbed_function:
      - public_safe_intake
      - evidence_survival
    privacy_rule: >-
      Private or sensitive donor material remains private unless a bounded public-safe
      derivative is reviewed for promotion.

  - repository: UNUM-Lattice-News-Proven-Harm
    state: DONOR_RECOVERY
    absorbed_function:
      - harm/confirmed
      - harm/review

  - repository: UNUM-Lattice-News-Humanitarian-Environmentalism
    state: DONOR_RECOVERY
    absorbed_function:
      - internal_lens:HUMANITARIAN_ENVIRONMENTAL

  - repository: UNUM-Lattice-News-Real-Bad-Policy
    state: DONOR_RECOVERY
    absorbed_function:
      - internal_lens:POLICY_MECHANISM

  - repository: UNUM-Lattice-News-Geopolitics
    state: DONOR_RECOVERY
    absorbed_function:
      - internal_lens:GEOPOLITICS

  - repository: UNUM-Lattice-News-Capital-and-Power
    state: DONOR_RECOVERY
    absorbed_function:
      - internal_lens:CAPITAL_POWER

  - repository: UNUM-News-Lattice-Trafficking
    state: DONOR_RECOVERY
    absorbed_function:
      - internal_lens:TRAFFICKING

adoption_ledger: migration/LATTICE_SATELLITE_ADOPTION_LEDGER_2026-08-30.yaml
single_repository_architecture: docs/SINGLE_REPOSITORY_LATTICE_ARCHITECTURE_v0_1.md

publication_routes:
  - repository: UNUM-Radical-Love-Revolution
    role: broad_human_facing_synthesis_and_publication_surface
    receives_from:
      - UNUM_Lattice_News_when_a_durable_public_evidence_synthesis_is_ready
      - other_specialist_study_owners_when_their_work_warrants_public_synthesis
    locks:
      - public_synthesis_is_not_independent_corroboration
      - publication_does_not_replace_source_lineage
      - publication_clarity_does_not_inflate_certainty

crossing_minimum:
  - source_pointers_and_citation_lineage
  - exact_question_claim_or_edge_and_scope
  - relevant_clocks
  - evidence_effects_when_applicable
  - uncertainty_and_missingness
  - strongest_competing_model_or_discriminator_when_material
  - privacy_or_publication_safety_state_when_material
  - evidence_that_would_change_assessment
  - owner_and_return_path

completion_rule: >-
  Former satellites cease to be active authorities after their unique current-facing
  functions have active owners, unique records have been adopted or retained with
  provenance, privacy has been resolved, pointers have been repaired, and workflows
  no longer require the old repository as an active write destination.
