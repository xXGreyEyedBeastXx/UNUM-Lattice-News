schema: unum-lattice-news/repository-custody/v0.7
status: ACTIVE
updated: 2026-08-28
purpose: >-
  Provide one machine-readable routing surface for public-reality evidence custody and specialist return edges while respecting the wider UNUM architecture:
  UNUM-Research owns general research requests, intake, triage, routing, provenance coordination, and re-entry; specialist repositories own the actual studies and their local dissemination.

prime_laws:
  - UNUM_Research_is_the_general_request_intake_front_door
  - specialist_repositories_own_actual_study_and_domain_conclusions
  - specialist_repositories_normally_own_local_dissemination
  - UNUM_Lattice_News_Intake_is_a_news_specific_pre_durable_evidence_review_subroute
  - external_evidence_precedes_project_interpretation
  - evidence_updates_only_the_claim_edge_variable_or_model_component_it_bears_on
  - repeated_projection_is_not_independent_corroboration
  - rhetorical_label_is_evidence_the_label_was_used_not_proof_the_classification_is_true
  - world_state_transition_and_evidence_state_transition_remain_distinct
  - specialist_repository_is_not_a_causal_silo
  - separation_is_for_attribution_and_connection_is_for_causality
  - cross_repository_identity_follows_schemas_CROSS_REPOSITORY_TRANSPORT_PACKET_v0_1_yaml
  - shared_harm_and_repair_identity_follows_schemas_SHARED_HARM_REPAIR_CONTINUITY_v0_1_yaml
  - nothing_crosses_without_provenance_scope_uncertainty_and_return_path

research_front_door:
  repository: UNUM-Research
  role: general_research_request_intake_recovery_triage_dispatch_provenance_and_reentry
  owns:
    - research_request_identity
    - general_intake
    - source_and_current_state_recovery
    - exact_question_and_seat_definition
    - specialist_owner_selection
    - route_history
    - provenance_coordination
    - watch_conditions
    - returned_finding_contradiction_null_and_supersession_tracking
    - dissemination_pointer_tracking
  does_not_own:
    - destination_specialist_study
    - destination_domain_conclusion
    - destination_local_dissemination
    - automatic_promotion_into_UNUM_Lattice_News
  handoff_rule: >-
    Intake in Research. Study where it belongs. The destination repository keeps the study and normally disseminates from its own seat. Research keeps the request, route, provenance, return state, and way back.

news_evidence_subroute:
  repository: UNUM-Lattice-News-Intake
  role: news_specific_pre_durable_evidence_review_and_lattice_promotion_staging
  receives_when:
    - a_Research_request_needs_current_public_event_or_news_source_processing
    - direct_news_discovery_needs_source_verification_and_claim_extraction
    - a_public_event_candidate_may_promote_to_UNUM_Lattice_News
  owns:
    - news_feed_and_manual_discovery_candidates
    - news_source_verification_drafts
    - duplicate_and_citation_lineage_review
    - bounded_claim_extraction_drafts
    - news_clock_separation
    - world_state_vs_evidence_state_triage
    - evidence_effect_typing_drafts
    - competing_models_and_discriminators
    - proposed_news_specialist_routes
    - rejected_and_deferred_news_candidates
  does_not_own:
    - general_cross_repository_research_request_intake
    - destination_specialist_study
    - publication_authority
    - automatic_node_relation_harm_ideology_motive_or_causation_findings

durable_owner:
  repository: UNUM-Lattice-News
  role: durable_reviewed_public_reality_mesh
  owns:
    - reviewed_public_events
    - reviewed_source_identity_and_lineage
    - reviewed_claims_and_claim_posture
    - chronology_and_clocks
    - public_state_transitions
    - harms_and_consequences
    - causal_and_accountability_relations
    - uncertainty_and_missingness
    - corrections
  does_not_own:
    - general_research_request_intake
    - performing_every_specialist_analysis_locally
    - duplicating_shared_service_work_available_elsewhere

specialist_routes:
  - repository: UNUM-Lattice-News-Geopolitics
    route_when:
      - state_to_state_bloc_or_cross_border_power_relation_is_material
      - war_occupation_annexation_resistance_or_self_defense_causal_role_requires_reconstruction
      - sovereignty_recognition_partition_border_or_territorial_status_is_material
      - sanctions_foreign_aid_arms_transfer_alliance_or_security_cooperation_requires_deep_study
      - strategic_resource_shipping_energy_or_security_corridor_requires_cross_border_analysis
    locks:
      - state_status_does_not_assign_defensive_causal_role
      - transactional_crossing_does_not_establish_ideological_alliance
      - alliance_does_not_establish_control_or_shared_command
      - historical_continuity_does_not_establish_one_uninterrupted_conspiracy

  - repository: UNUM-Lattice-News-Capital-and-Power
    route_when:
      - money_ownership_labor_debt_land_trade_or_public_private_resource_flow_is_material
      - procurement_contracting_defense_industry_subsidy_or_tax_incidence_requires_deep_study
      - campaign_finance_PAC_superPAC_lobbying_or_access_pressure_requires_deep_study
      - beneficiary_loss_bearing_externalized_cost_or_terminal_gain_path_requires_reconstruction
      - market_concentration_bargaining_power_or_necessity_gating_is_material
    locks:
      - payment_or_financial_association_alone_does_not_establish_every_form_of_control
      - financial_relation_plus_evidenced_ownership_voting_veto_appointment_budget_collateral_conditional_access_dependency_or_credible_withdrawal_power_can_establish_material_control
      - do_not_relabel_evidenced_financial_control_as_mere_influence
      - lobbying_does_not_establish_bribery
      - profit_does_not_establish_exploitation_by_definition
      - policy_benefit_does_not_establish_quid_pro_quo
      - ownership_does_not_automatically_establish_every_downstream_operational_decision

  - repository: UNUM-Hierarchy-and-Supremacy-Studies
    route_when:
      - ranked_group_status_or_unequal_entitlement_is_a_material_question
      - supremacy_claim_or_institutionalized_hierarchy_requires_deep_study
      - historical_hierarchy_lineage_or_dominant_group_victimhood_inversion_requires_discriminator_review
    locks:
      - difference_does_not_establish_hierarchy
      - unequal_outcome_does_not_automatically_establish_supremacist_design
      - supremacy_finding_does_not_automatically_establish_extremism_terrorism_or_criminality
      - identity_membership_does_not_transfer_a_collective_verdict

  - repository: UNUM-Laundering-Map
    route_when:
      - rhetoric_or_framing_transforms_the_apparent_causal_or_moral_picture
      - legitimacy_reputation_legality_or_selective_omission_changes_accountability_read

  - repository: UNUM-Governance
    route_when:
      - authority_procedure_capacity_enforcement_oversight_resistance_or_appeal_is_material

  - repository: UNUM-Extremism-Watch
    route_when:
      - movement_ideology_lineage_propaganda_organization_normalization_or_violence_requires_deep_study

  - repository: UNUM-Human-Relations
    route_when:
      - durable_social_relational_dependency_conformity_culture_or_interpersonal_mechanism_requires_study

  - repository: UNUM-Universal-Translation
    route_when:
      - original_language_register_ambiguity_or_translation_loss_is_material

  - repository: UNUM-Earth-Environmental-Ecology
    route_when:
      - environmental_system_place_scale_exposure_or_ecological_mechanism_requires_specialist_study

  - repository: UNUM-Medical
    route_when:
      - organism_health_clinical_or_biological_mechanism_requires_specialist_study

  - repository: UNUM-Chemistry
    route_when:
      - contaminant_reaction_composition_or_material_pathway_requires_specialist_study

  - repository: UNUM-Engineering
    route_when:
      - infrastructure_design_failure_mechanism_or_technical_system_requires_specialist_study

  - repository: UNUM-Human-AI-Alliance
    route_when:
      - human_ai_governance_rights_dependency_or_relational_consequence_requires_specialist_study

shared_study_and_support_routes:
  - repository: UNUM-Timeline-Studies
    role: routed_chronology_clock_and_temporal_identity_study_service
    locks:
      - later_state_does_not_rewrite_prior_path
      - recent_repository_date_does_not_imply_recent_underlying_relation
      - chronology_support_does_not_transfer_request_intake_or_source_custody
  - repository: UNUM-Universal-Translation
    role: semantic_and_language_seat_preservation_service
  - repository: UNUM-Tools-Utilities
    role: reusable_instrument_schema_and_validation_service
  - repository: UNUM-Archives
    role: frozen_publication_history_and_historical_return_surface

satellite_routes:
  - repository: UNUM-Lattice-News-Proven-Harm
    role: downstream_high_confidence_harm_ledger
    promotion_only: true
    required_before_promotion:
      - bounded_harm_claim
      - causal_relation_and_scope
      - primary_or_best_available_evidence
      - typed_evidence_effects
      - uncertainty_and_missingness
      - confidence_or_proof_state
      - shared_harm_identity_when_multiple_contributors_or_routes_exist
      - lattice_return_path
      - correction_and_demotion_path
    prohibited_shortcuts:
      - repository_presence_as_proof
      - duplicate_harm_counting_across_contributors_or_routes

  - repository: UNUM-Lattice-News-Real-Bad-Policy
    role: policy_harm_investigation_aperture
    title_is_verdict: false

  - repository: UNUM-Lattice-News-Humanitarian-Environmentalism
    role: humanitarian_environmental_crossing_aperture

publication_routes:
  - repository: UNUM-Radical-Love-Revolution
    role: broad_human_facing_synthesis_and_publication_surface
    receives_from:
      - specialist_study_owners_when_their_work_warrants_public_synthesis
      - UNUM-Lattice-News_when_a_durable_news_evidence_synthesis_is_ready
    routing_contract: PUBLICATION_ROUTING.md
    locks:
      - public_synthesis_is_not_independent_corroboration
      - publication_does_not_replace_source_lineage
      - publication_clarity_does_not_inflate_certainty

promotion_states:
  - RESEARCH_INTAKE
  - ROUTED_TO_SPECIALIST
  - SPECIALIST_STUDY_ACTIVE
  - SPECIALIST_FINDING_RETURNED
  - NEWS_SOURCE_REVIEWED
  - CLAIM_TESTED
  - STATE_TRANSITION_REVIEWED
  - READY_FOR_LATTICE_REVIEW
  - NODE_RELATION_REVIEWED
  - SATELLITE_ELIGIBLE
  - DISSEMINATION_ELIGIBLE

promotion_rule: >-
  Advancement is claim-specific. A record may occupy different states for different edges. No later state retroactively upgrades weaker evidence.

crossing_packet_schema: schemas/CROSS_REPOSITORY_TRANSPORT_PACKET_v0_1.yaml
shared_harm_repair_schema: schemas/SHARED_HARM_REPAIR_CONTINUITY_v0_1.yaml

crossing_packet_minimum:
  - UNUM_Research_request_id_and_return_path
  - packet_id_and_lineage_root_id
  - specialist_owner
  - source_pointers_and_citation_lineage
  - exact_question_and_scope
  - relevant_clocks
  - evidence_effects_when_applicable
  - uncertainty_and_missingness
  - strongest_competing_model_or_discriminator_when_material
  - evidence_that_would_change_assessment
  - dissemination_and_reentry_paths
