schema: unum-lattice-news/repository-custody/v1.0
status: ACTIVE
updated: 2026-08-30
purpose: >-
  Define custody for one Lattice identity expressed through an active private Backend working
  surface and a public durable surface, while preserving true external specialist lifecycles.

prime_laws:
  - one_Lattice_identity_two_active_surfaces
  - Backend_owns_working_private_and_pre_durable_custody
  - Public_owns_reviewed_public_safe_durable_projection
  - promotion_across_surfaces_is_not_independent_corroboration
  - UNUM_Research_is_the_ecology_wide_external_retrieval_request_and_reentry_head
  - internal_lens_is_not_independent_truth_authority
  - lifecycle_state_is_not_domain_identity
  - external_specialist_repository_owns_genuinely_distinct_domain_study
  - evidence_updates_only_the_claim_edge_variable_or_model_component_it_bears_on
  - rhetorical_label_is_evidence_the_label_was_used_not_proof_the_classification_is_true
  - world_state_transition_and_evidence_state_transition_remain_distinct
  - repository_or_folder_boundary_is_not_causal_boundary
  - nothing_crosses_without_provenance_scope_uncertainty_and_return_path
  - private_sensitive_or_sealed_material_does_not_cross_to_Public_without_review
  - donor_material_is_adopted_semantically_not_blind_merged

lattice_surfaces:
  backend:
    repository: UNUM-Lattice-News-Backend
    status: ACTIVE_PRIVATE_WORKING_SURFACE
    visibility: private
    role: working_evidence_review_and_promotion_surface
    owns:
      - raw_news_candidates
      - source_identity_and_survival_custody
      - private_or_sensitive_evidence_allowed_by_repository_rules
      - citation_lineage_review
      - claim_extraction_drafts
      - chronology_and_clock_review
      - competing_models_and_discriminators
      - working_casework_and_investigations
      - internal_route_queues
      - promotion_review
      - harm_promotion_review
      - migration_and_reconciliation
      - operational_agents_workflows_and_automation
    does_not_own:
      - public_truth_by_repository_presence
      - automatic_publication
      - every_external_specialist_domain_study

  public:
    repository: UNUM-Lattice-News
    status: ACTIVE_PUBLIC_DURABLE_SURFACE
    visibility: public
    role: durable_reviewed_public_reality_mesh
    owns:
      - reviewed_public_events
      - public_safe_source_identity_and_lineage_projection
      - reviewed_claims_and_claim_posture
      - chronology_and_clocks
      - public_state_transitions
      - harms_and_consequences
      - causal_and_accountability_relations
      - recomposed_public_meshes_and_maps
      - scoped_high_confidence_harm_states
      - public_briefings
      - uncertainty_and_missingness
      - corrections
    does_not_own:
      - raw_intake_workbench
      - unresolved_private_source_custody
      - sensitive_or_sealed_working_casefiles
      - generic_ecology_wide_external_research_request_routing
      - every_specialist_domain_analysis

public_backend_promotion:
  schema: UNUM-Lattice-News-Backend/schemas/PUBLIC_PROMOTION_PACKET_v0_1.yaml
  minimum:
    - stable_object_identity
    - source_pointers_and_citation_lineage
    - exact_claim_event_relation_or_harm_edge_and_scope
    - relevant_clocks
    - evidence_effects_when_applicable
    - uncertainty_and_missingness
    - strongest_competing_model_or_discriminator_when_material
    - privacy_and_publication_safety_state
    - internal_lenses_used
    - external_specialist_returns_used
    - backend_return_path
    - public_destination_identity
  locks:
    - candidate_does_not_require_promotion
    - promotion_is_claim_specific
    - public_projection_is_not_new_corroboration
    - correction_or_demotion_can_return_to_Backend_review

research_front_door:
  repository: UNUM-Research
  role: external_retrieval_request_identity_source_recovery_routing_provenance_and_reentry
  owns:
    - external_lookup_request_identity
    - literature_web_and_reference_retrieval_heads
    - cross_repository_route_history
    - retrieval_provenance
    - return_and_watch_conditions
  does_not_own:
    - Lattice_local_substantive_public_reality_study
    - destination_domain_conclusion
    - automatic_promotion_into_UNUM_Lattice_News

internal_lenses:
  backend_registry: UNUM-Lattice-News-Backend/registries/LATTICE_INTERNAL_ROUTING.yaml
  public_registry: registries/LATTICE_INTERNAL_ROUTING.yaml
  apply_across:
    - Backend
    - Public
  lenses:
    - GEOPOLITICS
    - CAPITAL_POWER
    - HUMANITARIAN_ENVIRONMENTAL
    - TRAFFICKING
    - POLICY_MECHANISM
  rules:
    - object_may_activate_multiple_lenses
    - lens_routes_questions_gates_and_discriminators
    - lens_does_not_duplicate_evidence_lineage
    - lens_name_does_not_establish_its_named_conclusion

public_lifecycle_surfaces:
  durable_event: stories/
  bounded_claim: claims/
  mesh_relation: lattice/
  confirmed_harm:
    home: harm/confirmed/
    promotion_only: true
    locks:
      - high_confidence_is_claim_specific
      - neighboring_motive_intent_legality_membership_or_magnitude_claims_do_not_auto_promote
      - correction_and_demotion_remain_live
  review: reviews/
  public_evidence_projection: evidence/
  correction: CORRECTIONS.md

external_specialist_routes:
  - repository: UNUM-Governance
    role: authority_law_procedure_enforcement_oversight_resistance_and_appeal
  - repository: UNUM-Hierarchy-and-Supremacy-Studies
    role: ranked_status_unequal_entitlement_and_supremacy_mechanism
  - repository: UNUM-Laundering-Map
    role: rhetoric_framing_legitimacy_reputation_and_causal_partition_transformation
  - repository: UNUM-Extremism-Watch
    role: extremist_movement_ideology_lineage_propaganda_organization_and_normalization
  - repository: UNUM-Human-Relations
    role: interpersonal_dependency_grooming_conformity_culture_and_relational_coercion
  - repository: UNUM-Universal-Translation
    role: original_language_register_ambiguity_translation_and_semantic_loss
  - repository: UNUM-Earth-Environmental-Ecology
    role: environmental_system_place_scale_exposure_and_ecological_mechanism
  - repository: UNUM-Medical
    role: organism_health_clinical_and_biological_mechanism
  - repository: UNUM-Chemistry
    role: contaminant_reaction_composition_and_material_pathway
  - repository: UNUM-Engineering
    role: infrastructure_design_failure_mechanism_and_technical_system
  - repository: UNUM-Human-AI-Alliance
    role: human_ai_governance_rights_dependency_and_relational_consequence
  - repository: UNUM-Epstein-Discovery
    role: Epstein_specific_evidence_and_casework

shared_support_routes:
  - repository: UNUM-Timeline-Studies
    role: routed_chronology_clock_and_temporal_identity_study_service
  - repository: UNUM-Universal-Translation
    role: semantic_and_language_seat_preservation_service
  - repository: UNUM-Tools-Utilities
    role: reusable_instrument_schema_and_validation_service
  - repository: UNUM-Archives
    role: frozen_publication_history_and_historical_return_surface

former_lattice_satellites:
  - repository: UNUM-Lattice-News-Intake
    current_state: ACTIVE_DONOR_MIGRATION_TO_BACKEND
    destinations:
      - Backend:intake
      - Backend:evidence

  - repository: UNUM-Lattice-News-Proven-Harm
    current_state: ACTIVE_DONOR_SPLIT_LIFECYCLE
    destinations:
      - Backend:promotion/harm-review
      - Public:harm/confirmed

  - repository: UNUM-Lattice-News-Humanitarian-Environmentalism
    current_state: ACTIVE_DONOR_WORKBENCH_MIGRATION
    destinations:
      - Backend:routes/HUMANITARIAN_ENVIRONMENTAL
      - Backend:work/maps_reviews
      - Public:reviewed_maps_reviews
      - external_specialists_when_domain_lifecycle_is_stronger

  - repository: UNUM-Lattice-News-Real-Bad-Policy
    current_state: ACTIVE_DONOR_WORKBENCH_MIGRATION
    destinations:
      - Backend:routes/POLICY_MECHANISM
      - Backend:work/reviews
      - Public:reviewed_claims_maps_reviews
      - UNUM-Governance_when_authority_procedure_lifecycle_is_primary

  - repository: UNUM-Lattice-News-Geopolitics
    current_state: ACTIVE_DONOR_WORKBENCH_MIGRATION
    destinations:
      - Backend:routes/GEOPOLITICS
      - Backend:work/maps_reviews
      - Public:reviewed_maps_reviews

  - repository: UNUM-Lattice-News-Capital-and-Power
    current_state: ACTIVE_DONOR_WORKBENCH_MIGRATION
    destinations:
      - Backend:routes/CAPITAL_POWER
      - Backend:work/maps_reviews
      - Public:reviewed_maps_reviews
      - external_specialist_donation_when_distinct_lifecycle_emerges

  - repository: UNUM-News-Lattice-Trafficking
    current_state: ACTIVE_DONOR_WORKBENCH_MIGRATION
    destinations:
      - Backend:routes/TRAFFICKING
      - Backend:work/casework_reviews
      - Public:reviewed_claims_maps_reviews
      - external_specialist_donation_when_distinct_lifecycle_emerges

adoption_ledger: migration/LATTICE_SATELLITE_ADOPTION_LEDGER_2026-08-30.yaml
architecture: docs/SINGLE_REPOSITORY_LATTICE_ARCHITECTURE_v0_1.md

publication_routes:
  - repository: UNUM-Radical-Love-Revolution
    role: broad_human_facing_synthesis_and_publication_surface
    receives_from:
      - UNUM_Lattice_News_when_a_durable_public_evidence_synthesis_is_ready
      - other_specialist_study_owners_when_their_work_warrants_public_synthesis
    locks:
      - public_synthesis_is_not_independent_corroboration
      - publication_does_not_replace_source_lineage
      - publication_clarity_does_not_inflate_certainty

completion_rule: >-
  Former satellites cease to be active authorities only after their unique current-facing
  functions and objects have a live Backend, Public, or external-specialist owner; private
  custody is resolved; pointers and workflows are repaired; and historical provenance remains re-enterable.
