schema: unum-lattice-news/internal-routing/v0.2
status: ACTIVE
updated: 2026-08-30
purpose: >-
  Provide one routing grammar for Lattice-specific lenses across the planned private
  Backend and the public durable surface. Lenses route questions and evidence without
  creating independent truth authorities or duplicate source lineages.

prime_laws:
  - one_Lattice_identity_two_surfaces
  - Backend_is_working_surface
  - Public_is_reviewed_projection_surface
  - lens_is_routing_not_verdict
  - multi_lens_objects_are_normal
  - evidence_lineage_is_shared_not_multiplied_by_route_or_promotion
  - lifecycle_state_is_not_domain_identity
  - external_specialist_repository_remains_external_when_distinct_study_body_exists
  - private_or_sensitive_material_does_not_cross_to_Public_without_review
  - adoption_and_donation_require_provenance_scope_uncertainty_and_return_path

surface_roles:
  Backend:
    repository: UNUM-Lattice-News-Backend
    status: PLANNED_NOT_YET_INSTANTIATED
    role:
      - raw_intake
      - fuller_evidence_custody
      - private_sensitive_working_material_when_authorized
      - draft_claims_and_maps
      - casework
      - unresolved_reviews
      - route_queues
      - promotion_review
      - operational_agents_and_workflows

  Public:
    repository: UNUM-Lattice-News
    role:
      - reviewed_events_and_claims
      - public_safe_evidence_projection
      - reviewed_maps_and_meshes
      - scoped_confirmed_harm_states
      - corrections_and_public_briefings

internal_lenses:
  GEOPOLITICS:
    default_working_surface: Backend
    public_projection: reviewed_claim_map_review_or_mesh
    route_when:
      - cross_border_state_bloc_or_territorial_power_is_material
      - war_occupation_annexation_resistance_or_self_defense_causal_role_requires_reconstruction
      - sovereignty_recognition_partition_border_or_territorial_status_is_material
      - sanctions_foreign_aid_arms_transfer_alliance_or_security_cooperation_is_material
      - strategic_resource_shipping_energy_or_security_corridor_is_material
    locks:
      - state_status_does_not_assign_defensive_causal_role
      - alliance_does_not_establish_control_or_shared_command
      - transactional_crossing_does_not_establish_ideological_alliance
      - historical_continuity_does_not_establish_one_uninterrupted_conspiracy

  CAPITAL_POWER:
    default_working_surface: Backend
    public_projection: reviewed_claim_map_review_or_mesh
    route_when:
      - money_ownership_labor_debt_land_trade_tax_or_public_private_flow_is_material
      - procurement_contracting_defense_industry_subsidy_or_cost_incidence_is_material
      - campaign_finance_lobbying_or_access_pressure_requires_tracing
      - beneficiary_loss_bearing_dependency_or_terminal_gain_path_requires_reconstruction
      - market_concentration_bargaining_power_or_necessity_gating_is_material
    locks:
      - payment_or_financial_association_alone_does_not_establish_every_form_of_control
      - evidenced_financial_power_may_constitute_control_when_terms_or_enforcement_power_travel_with_it
      - lobbying_does_not_establish_bribery
      - profit_does_not_establish_exploitation_by_definition
      - policy_benefit_does_not_establish_quid_pro_quo
      - ownership_does_not_automatically_establish_every_downstream_operational_decision

  HUMANITARIAN_ENVIRONMENTAL:
    default_working_surface: Backend
    public_projection: reviewed_story_claim_map_review_or_mesh
    route_when:
      - environmental_condition_and_human_welfare_cannot_be_responsibly_separated
      - climate_water_air_soil_food_or_chemical_exposure_is_material
      - extraction_waste_disaster_famine_displacement_or_habitability_is_material
      - war_environment_public_health_or_infrastructure_crossing_is_material
    locks:
      - natural_event_does_not_erase_policy_or_infrastructure_contribution
      - legal_permit_does_not_establish_harmlessness
      - uncertain_exact_dose_does_not_erase_established_exposure
      - later_cleanup_does_not_erase_prior_realized_harm
      - people_are_not_merely_variables_in_environmental_models

  TRAFFICKING:
    default_working_surface: Backend
    public_projection: reviewed_story_claim_map_review_or_mesh_when_safe
    route_when:
      - trafficking_or_coercive_recruitment_control_relation_is_material
      - sexual_or_labor_exploitation_requires_trafficking_specific_discrimination
      - workforce_camp_boomtown_remote_labor_or_supply_chain_risk_architecture_requires_study
      - trafficking_related_jurisdiction_notice_response_or_mitigation_requires_reconstruction
    locks:
      - sex_work_does_not_establish_trafficking
      - migration_does_not_establish_trafficking
      - smuggling_does_not_establish_trafficking_automatically
      - sexual_violence_does_not_establish_trafficking_automatically
      - missing_person_status_does_not_establish_trafficking
      - workforce_camp_does_not_establish_trafficking_event
      - risk_architecture_does_not_establish_realized_trafficking
      - reported_increase_does_not_establish_true_prevalence_increase_without_measurement_review

  POLICY_MECHANISM:
    default_working_surface: Backend
    public_projection: reviewed_story_claim_map_review_or_mesh
    route_when:
      - law_order_rule_budget_program_or_administrative_change_is_material
      - stated_purpose_and_actual_mechanism_require_separation
      - implementation_capacity_attempt_realization_resistance_or_reversal_is_material
      - distribution_of_benefits_burdens_rights_access_or_exit_requires_review
    locks:
      - policy_name_does_not_establish_policy_effect
      - stated_benevolence_does_not_establish_benefit
      - formal_legality_does_not_establish_harmlessness
      - attempted_policy_does_not_equal_realized_implementation
      - blocked_policy_does_not_erase_attempted_direction
      - bad_outcome_does_not_automatically_establish_malicious_intent

working_lifecycle_targets:
  RAW_CANDIDATE:
    target: Backend:intake/candidates
  SOURCE_SURVIVAL:
    target: Backend:evidence/sources
  DRAFT_CLAIM:
    target: Backend:intake/claim-extraction
  WORKING_REVIEW:
    target: Backend:work/reviews
  WORKING_MAP:
    target: Backend:work/maps
  CASEWORK:
    target: Backend:work/casework
  PUBLIC_PROMOTION_REVIEW:
    target: Backend:promotion/public-review
  HARM_PROMOTION_REVIEW:
    target: Backend:promotion/harm-review

public_lifecycle_targets:
  PUBLIC_PROMOTION_RECEIPT:
    home: intake/
    role: optional_public_manifest_of_crossing_not_raw_review
  PUBLIC_EVIDENCE_PROJECTION:
    home: evidence/
    role: reviewed_public_safe_source_identity_lineage_and_reentry
  DURABLE_EVENT:
    home: stories/
  BOUNDED_CLAIM:
    home: claims/
  MESH_RELATION:
    home: lattice/
  CONFIRMED_HARM:
    home: harm/confirmed/
    locks:
      - one_confirmed_edge_does_not_promote_neighboring_claims
      - correction_and_demotion_remain_live
  REVIEWED_PUBLIC_REVIEW:
    home: reviews/
  CORRECTION:
    home: CORRECTIONS.md

