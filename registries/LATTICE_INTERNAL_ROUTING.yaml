schema: unum-lattice-news/internal-routing/v0.3
status: ACTIVE
updated: 2026-08-30
purpose: >-
  Provide one routing grammar for Lattice-specific lenses across the active private Backend
  and the public durable surface. Lenses route questions and evidence without creating
  independent truth authorities or duplicate source lineages.

prime_laws:
  - one_Lattice_identity_two_active_surfaces
  - Backend_is_working_surface
  - Public_is_reviewed_projection_surface
  - lens_is_routing_not_verdict
  - multi_lens_objects_are_normal
  - repository_boundary_does_not_imply_causal_boundary
  - evidence_lineage_is_shared_not_multiplied_by_route_or_promotion
  - lifecycle_state_is_not_domain_identity
  - external_specialist_repository_remains_external_when_distinct_study_body_exists
  - private_or_sensitive_material_does_not_cross_to_Public_without_review
  - adoption_and_donation_require_provenance_scope_uncertainty_and_return_path

surface_roles:
  Backend:
    repository: UNUM-Lattice-News-Backend
    status: ACTIVE_PRIVATE_WORKING_SURFACE
    registry: UNUM-Lattice-News-Backend/registries/LATTICE_INTERNAL_ROUTING.yaml
    role:
      - raw_intake
      - fuller_evidence_custody
      - private_sensitive_working_material_when_authorized
      - draft_claims_and_maps
      - casework
      - unresolved_reviews
      - route_queues
      - promotion_review
      - operational_agents_and_workflows

  Public:
    repository: UNUM-Lattice-News
    status: ACTIVE_PUBLIC_DURABLE_SURFACE
    role:
      - reviewed_events_and_claims
      - public_safe_evidence_projection
      - reviewed_maps_and_meshes
      - scoped_confirmed_harm_states
      - corrections_and_public_briefings

internal_lenses:
  GEOPOLITICS:
    default_working_surface: Backend
    public_projection: reviewed_claim_map_review_or_mesh
    route_when:
      - cross_border_state_bloc_or_territorial_power_is_material
      - war_occupation_annexation_resistance_or_self_defense_causal_role_requires_reconstruction
      - sovereignty_recognition_partition_border_or_territorial_status_is_material
      - sanctions_foreign_aid_arms_transfer_alliance_or_security_cooperation_is_material
      - strategic_resource_shipping_energy_or_security_corridor_is_material
    classification_cautions:
      - distinguish_state_status_causal_role_operational_coordination_dependency_and_control
      - preserve_historical_continuity_without_forcing_one_uninterrupted_causal_story

  CAPITAL_POWER:
    default_working_surface: Backend
    public_projection: reviewed_claim_map_review_or_mesh
    route_when:
      - money_ownership_labor_debt_land_trade_tax_or_public_private_flow_is_material
      - procurement_contracting_defense_industry_subsidy_or_cost_incidence_is_material
      - campaign_finance_lobbying_or_access_pressure_requires_tracing
      - beneficiary_loss_bearing_dependency_or_terminal_gain_path_requires_reconstruction
      - market_concentration_bargaining_power_or_necessity_gating_is_material
    classification_cautions:
      - distinguish_financial_association_incentive_dependency_terms_enforcement_and_control
      - classify_profit_extraction_exploitation_and_quid_pro_quo_by_evidence_and_mechanism

  HUMANITARIAN_ENVIRONMENTAL:
    default_working_surface: Backend
    public_projection: reviewed_story_claim_map_review_or_mesh
    route_when:
      - environmental_condition_and_human_welfare_are_causally_entangled
      - climate_water_air_soil_food_or_chemical_exposure_is_material
      - extraction_waste_disaster_famine_displacement_or_habitability_is_material
      - war_environment_public_health_or_infrastructure_crossing_is_material
    classification_cautions:
      - preserve_physical_mechanism_and_policy_or_infrastructure_contribution_when_supported
      - uncertain_exact_dose_can_coexist_with_established_exposure
      - later_cleanup_and_prior_realized_harm_are_separate_temporal_states

  TRAFFICKING:
    default_working_surface: Backend
    public_projection: reviewed_story_claim_map_review_or_mesh_when_safe
    route_when:
      - trafficking_or_coercive_recruitment_control_relation_is_material
      - sexual_or_labor_exploitation_requires_trafficking_specific_discrimination
      - workforce_camp_boomtown_remote_labor_or_supply_chain_risk_architecture_requires_study
      - trafficking_related_jurisdiction_notice_response_or_mitigation_requires_reconstruction
    classification_cautions:
      - distinguish_trafficking_sex_work_smuggling_migration_sexual_violence_missing_person_status_and_risk_architecture
      - reported_increase_and_true_prevalence_increase_require_measurement_review
      - victim_and_witness_safety_can_control_publication_scope

  POLICY_MECHANISM:
    default_working_surface: Backend
    public_projection: reviewed_story_claim_map_review_or_mesh
    route_when:
      - law_order_rule_budget_program_or_administrative_change_is_material
      - stated_purpose_and_actual_mechanism_require_separation
      - implementation_capacity_attempt_realization_resistance_or_reversal_is_material
      - distribution_of_benefits_burdens_rights_access_or_exit_requires_review
    classification_cautions:
      - distinguish_policy_label_stated_goal_mechanism_attempt_implementation_and_realized_effect
      - legality_harm_benefit_intent_and_outcome_are_separate_evidentiary_dimensions

working_lifecycle_targets:
  RAW_CANDIDATE: Backend:intake/candidates
  SOURCE_REVIEW: Backend:intake/source-review
  SOURCE_SURVIVAL: Backend:evidence/sources
  DRAFT_CLAIM: Backend:intake/claim-extraction
  ROUTING_DECISION: Backend:intake/routing
  REJECTED_OR_DEFERRED: Backend:intake/rejected-deferred
  INVESTIGATION: Backend:work/investigations
  CASEWORK: Backend:work/casework
  WORKING_REVIEW: Backend:work/reviews
  WORKING_MAP: Backend:work/maps
  WORKING_CHRONOLOGY: Backend:work/chronologies
  PUBLIC_PROMOTION_REVIEW: Backend:promotion/public-review
  HARM_PROMOTION_REVIEW: Backend:promotion/harm-review
  PROMOTION_PACKET: Backend:promotion/packets

public_lifecycle_targets:
  PUBLIC_PROMOTION_RECEIPT:
    home: intake/
    role: optional_public_manifest_of_crossing_not_raw_review
  PUBLIC_EVIDENCE_PROJECTION:
    home: evidence/
    role: reviewed_public_safe_source_identity_lineage_and_reentry
  DURABLE_EVENT: stories/
  BOUNDED_CLAIM: claims/
  MESH_RELATION: lattice/
  CONFIRMED_HARM:
    home: harm/confirmed/
    locks:
      - one_confirmed_edge_does_not_promote_neighboring_claims
      - correction_and_demotion_remain_live
  REVIEWED_PUBLIC_REVIEW: reviews/
  CORRECTION: CORRECTIONS.md

external_specialist_routes:
  UNUM-Research: external_retrieval_request_identity_provenance_routing_and_reentry
  UNUM-Governance: authority_law_procedure_enforcement_oversight_appeal
  UNUM-Earth-Environmental-Ecology: ecological_system_place_scale_environmental_mechanism
  UNUM-Medical: clinical_biological_health_mechanism
  UNUM-Chemistry: contaminant_reaction_composition_material_pathway
  UNUM-Engineering: infrastructure_design_failure_and_technical_mechanism
  UNUM-Human-Relations: interpersonal_dependency_grooming_conformity_and_relational_mechanism
  UNUM-Hierarchy-and-Supremacy-Studies: ranked_status_ideology_and_unequal_entitlement
  UNUM-Laundering-Map: framing_legitimacy_reputation_and_causal_partition_transformation
  UNUM-Extremism-Watch: extremist_movement_ideology_organization_propaganda_and_normalization
  UNUM-Universal-Translation: language_register_translation_and_semantic_loss
  UNUM-Epstein-Discovery: Epstein_specific_evidence_and_casework

former_lattice_satellites:
  UNUM-Lattice-News-Intake: ACTIVE_DONOR_MIGRATION_TO_BACKEND
  UNUM-Lattice-News-Proven-Harm: ACTIVE_DONOR_SPLIT_BACKEND_REVIEW_PUBLIC_CONFIRMED_STATE
  UNUM-Lattice-News-Humanitarian-Environmentalism: ACTIVE_DONOR_WORKBENCH_MIGRATION
  UNUM-Lattice-News-Real-Bad-Policy: ACTIVE_DONOR_WORKBENCH_MIGRATION
  UNUM-Lattice-News-Geopolitics: ACTIVE_DONOR_WORKBENCH_MIGRATION
  UNUM-Lattice-News-Capital-and-Power: ACTIVE_DONOR_WORKBENCH_MIGRATION
  UNUM-News-Lattice-Trafficking: ACTIVE_DONOR_WORKBENCH_MIGRATION
