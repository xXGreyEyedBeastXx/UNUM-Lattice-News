allowed_states:
  democratic_constraint_state:
    - FUNCTIONING
    - STRAINED
    - ERODING
    - SEVERELY_ERODED
    - PARTLY_CAPTURED
    - CAPTURED
    - UNKNOWN
  authoritarian_formation:
    - NOT_ASSESSED
    - UNSUPPORTED
    - INDICATORS_PRESENT
    - SUPPORTED
    - STRONGLY_SUPPORTED
    - DISPUTED
  fascism_field_presence:
    - NOT_ASSESSED
    - UNSUPPORTED
    - INDICATORS_PRESENT
    - SUPPORTED
    - STRONGLY_SUPPORTED
    - DISPUTED
  fascist_pattern:
