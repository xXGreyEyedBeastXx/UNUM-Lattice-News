version: 0.2
status: working
purpose: >-
  Machine-readable envelope for scoped trust and threat assessments.
  Assessment records are projections over evidence and must not be used as identity labels,
  guilt findings, enemy designations, positive reputation credits, or automatic action authority.

assessment_record:
  id: ""
  assessment_type: "" # trust | threat
  subject_ref: ""
  scope:
    claim: null
    domain: null
    event: null
    jurisdiction: null
    time_start: null
    time_end: null
  assessed_at: ""
  assessor: ""
  status: "" # draft | reviewed | superseded | withdrawn

  evidence:
    supporting: [] # legacy convenience list; does not replace evidence_effects
    evidence_effects:
      - evidence_ref: ""
        target: ""
        function: "" # CLAIM_DEFEATING | SCOPE_LIMITING | DIRECTION | ATTEMPT | CAPACITY | REALIZED_OUTCOME | CONSTRAINT_RESISTANCE | MOTIVE_LIMITING | RELATION_LIMITING | ALTERNATIVE_SUPPORTING | RELIABILITY_MODIFYING | NON_RESPONSIVE
        effect: ""
    legacy_counterevidence: [] # migration-only; no new untyped entries
    source_lineage: []
    missingness: []

  trajectory_state:
    direction: null
    attempt: null
    capacity: null
    realized_result: null
    surviving_resistance: null
    notes: ""

  laundering_claims:
    - type: "" # CAUSAL_PARTITION_LAUNDERING | TRUTH_CITATION_LAUNDERING | LEGALITY_LAUNDERING | VOLUNTARINESS_LAUNDERING | MORAL_LAUNDERING | ETHICAL_LAUNDERING | REPUTATION_LAUNDERING | PATRONAGE_RETURN_LAUNDERING | FINANCIAL_PROVENANCE_OBSCURATION | MONEY_LAUNDERING_LEGAL_CLAIM | LITERAL_LAUNDRY
      posture: ""
      target: ""
      transformation: ""
      evidence_effect_refs: []
      notes: ""

  confidence: "" # low | medium | high
  confidence_notes: ""

  trust:
    authenticity: null
    provenance: null
    evidence_recoverability: null
    independence_interest: null
    domain_competence: null
    historical_reliability: null
    correction_reentry: null
    transparency: null
    adversarial_survivability: null

  threat:
    capability: null
    expressed_direction: null
    trajectory: null
    constraint_erosion: null
    reach: null
    target_vulnerability: null
    irreversibility: null
    opacity: null
    precedent_repetition: null
    escalation_potential: null
    repair_capacity: null
    immediacy: null
    summary:
      current_threat: null
      escalation_risk: null
      maximum_plausible_harm: null

  scenario_branches: []

  scoring:
    mode: "" # none | ordinal | range | numeric
    value_or_band: null
    scale: null
    weights_version: null
    weights: {}
    limitations: []

  re_entry:
    next_review: null
    evidence_that_would_change_assessment: []
    correction_path: ""
    supersedes: null
    superseded_by: null

locks:
  - "evidence updates only the edge or variable it actually bears on"
  - "constraint success does not erase an attempted objective"
  - "trust != truth"
  - "trust != moral goodness"
  - "threat != enemy"
  - "harm != identity"
  - "score != action authority"
  - "missing != zero"
  - "confidence != score"
  - "MONEY_LAUNDERING_LEGAL_CLAIM requires legal evidentiary grounding"
  - "LITERAL_LAUNDRY is not an investigative laundering inference"
  - "deterministic evidence packet must survive score removal"
