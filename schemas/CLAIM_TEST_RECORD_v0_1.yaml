locks:
  - Recording that a claim was made does not establish that the claim is true.
  - Repetition, prominence, office, institutional authority, and media amplification do not increase evidentiary support by themselves.
  - A causal claim requires more than temporal association, prevalence change, or correlation.
  - Failure to disprove a claim is not evidence that the claim is true.
  - Rhetorical force, emotional salience, and policy usefulness must not substitute for evidence.
  - Unsupported claims may remain visible as rhetoric when their influence is itself newsworthy, but must not generate factual relations.
