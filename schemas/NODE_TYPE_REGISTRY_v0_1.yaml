relation_role_rule:
  actor_is_also_a_relation_role: true
  note: A node family does not determine its role in a relation. A person or institution may be actor, funder, regulator, target, beneficiary, affected party, loss-bearer, gatekeeper, term-setter, or another evidenced role.

identity_vs_jurisdiction_rule:
  note: >-
    Government, sovereign-state, international-organization, and court nodes are durable actors or institutions. Their territory or jurisdiction may also require a separate place_jurisdiction node. Do not force actor identity and territorial jurisdiction into one node merely because the same name is used in ordinary language.

resource_flow_rule:
  note: >-
    Resource-flow nodes may represent necessities or value carriers such as food, water, housing, healthcare, public benefits, debt, money, labor, land, or energy. A resource node does not by itself establish a right, deprivation, gatekeeper, extraction mechanism, or harmful condition; those remain typed relations, claims, or consequence nodes.

network_rule:
  note: A network node represents a typed mesh of evidenced or explicitly provisional relations. It is not a collective actor, shared intent, command structure, or conspiracy unless those properties are independently established.

condition_rule:
  note: A condition node does not determine whether every person associated with it is disabled, impaired, ill, deficient, or in need of the same support. Disability, impairment, support need, legal status, identity, and environmental mismatch must remain separately evidenced relations or claims.

analysis_framework_rule:
  note: Analysis-framework nodes describe reusable investigative operators or map structures. They are not evidence that a worldly actor, harm, relation, or causal mechanism exists in a particular case. Case-specific edges still require evidence.

legacy_field_compatibility:
  new_records:
    preferred_fields: [family, subtype]
    legacy_fields_allowed: false
  migrated_or_existing_records:
    accepted_legacy_fields: [node_type, entity_type]
    action: preserve_and_map_through_migration_aliases_without_forced_rewrite
  note: >-
    The repository contains older nodes using node_type or entity_type and newer nodes using family/subtype. Do not treat this schema-era difference as an identity difference or rewrite historical records solely for cosmetic uniformity.

validation:
  new_records:
    require_family_from_registry: true
    subtype_must_belong_to_family: true
  archived_records:
    preserve_legacy_type: true
    allow_migration_alias: true
    rewrite_required: false
  unknown_types:
    reject_for_new_records: true
    preserve_for_archived_records_with_review_flag: true

locks:
  - Node type classifies the record; it does not assign guilt, intent, moral status, incapacity, or uniform support need.
  - Relation roles are established by evidence, not inherited from node family.
  - Network membership does not establish common command, shared intent, guilt, or equal responsibility.
  - Analysis frameworks are maps and operators, not case evidence by themselves.
  - Resource or necessity classification does not establish deprivation or extraction by itself.
  - Migration aliases preserve old records without silently rewriting history.
  - Affected populations and ecologies should not be fragmented merely because a source lists them.
  - A diagnostic or institutional label is not the whole lived reality of a participant.
  - Empty landing results are valid; a story or spread does not owe the lattice a new node.
