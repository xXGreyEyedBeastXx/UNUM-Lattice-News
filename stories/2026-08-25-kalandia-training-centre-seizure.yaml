summary: >-
  Israeli security forces forcibly entered the UNRWA Kalandia Training Centre in occupied East Jerusalem on August 25,
  and Israeli officials publicly indicated the premises had been seized. The action interfered with operation of an active
  vocational training facility serving roughly 340 young Palestine Refugees per year, creating immediate education and service access disruption.
