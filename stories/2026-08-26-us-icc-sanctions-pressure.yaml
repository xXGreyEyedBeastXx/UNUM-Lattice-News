claim_posture: observed
summary: >-
  U.S. sanctions measures reached ICC President Tomoko Akane and other court personnel, increasing personal and
  institutional pressure on the court. The U.S. frames the measures as resistance to illegitimate jurisdiction;
  ICC officials and supporting states frame them as coercion against an independent accountability institution.
  The sanctions dispute does not itself adjudicate underlying criminal cases.
