summary: >-
  Meta and state plaintiffs reached a proposed nationwide settlement structure in teen-safety and child-privacy litigation,
  subject to court approval. Reported terms include large monetary obligations and product/design restrictions. The settlement
  does not admit every allegation and has not yet demonstrated realized teen-safety outcomes.
