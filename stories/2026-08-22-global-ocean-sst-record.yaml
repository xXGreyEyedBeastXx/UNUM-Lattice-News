summary: >-
  Copernicus reports that daily average sea-surface temperature across the extra-polar global ocean reached 21.1 C
  on August 22, 2026, exceeding the prior ERA5 daily record. The global measurement is a material climate-state signal;
  specific local ecosystem and human harms require local evidence.
