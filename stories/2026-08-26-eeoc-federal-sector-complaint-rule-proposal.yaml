summary: >-
  The EEOC advanced a proposed rewrite of federal-sector EEO complaint procedures, including changes to counseling,
  administrative-judge access, referral, and class-complaint adjudication. The proposal and its stated streamlining
  rationale are established; realized worker-access, delay, discrimination, and litigation effects are not yet established.
