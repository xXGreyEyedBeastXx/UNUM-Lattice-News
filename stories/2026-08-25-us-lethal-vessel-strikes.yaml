summary: >-
  U.S. military strikes on August 23 and August 25 killed two people in the eastern Pacific and four people in the Caribbean.
  Independent reporting and strike trackers report at least 227 deaths in 68 publicly acknowledged vessel strikes through August 25.
  SOUTHCOM's narco-trafficker or narco-terrorist labels remain official attributions rather than independently established identity or targetability findings.
