  MSF reported that restrictions on engine oil, generator parts and other critical supplies delayed aid and impaired services
  dependent on hospital generators, ambulances, water pumps and water trucks. WHO HeRAMS monitoring independently documents
  major continuing gaps in operational health-service availability and barriers to provision across Gaza.
