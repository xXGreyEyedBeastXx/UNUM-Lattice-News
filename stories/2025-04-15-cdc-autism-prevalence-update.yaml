version: v0_1
id: 2025-04-15-cdc-autism-prevalence-update
title: CDC reports autism identified in about 1 in 31 monitored eight-year-olds
event_date: "2022-01-01"
published: "2025-04-15"
status: reviewed
claim_posture: observed
summary: >-
  CDC's Autism and Developmental Disabilities Monitoring Network reported that
  about 1 in 31 eight-year-old children were identified with autism across 16
  monitored US communities using 2022 records. The result is an identified
  prevalence estimate within a defined surveillance network, not a national
  census or a direct explanation of causation.
what_changed:
  - The combined ADDM estimate increased from about 1 in 36 in 2020 data to about 1 in 31 in 2022 data.
  - Site estimates varied widely, underscoring differences in identification and evaluation practices.
