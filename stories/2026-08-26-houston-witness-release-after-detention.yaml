summary: >-
  Daniel Tirado Pantoja, a witness to the July 7 fatal shooting of Lorenzo Salgado Araujo by a federal immigration agent,
  was detained for roughly seven weeks before a federal judge ordered his release after finding the government had not
  justified continued detention or shown him to be a danger or flight risk.
