summary: >-
  Nassau County terminated its formal 287(g) agreement with ICE to comply with New York state law while county leadership
  opposed the law and pursued or planned litigation. The termination is a realized constraint on one formal enforcement mechanism;
  it does not establish that all local-federal immigration cooperation ended.
