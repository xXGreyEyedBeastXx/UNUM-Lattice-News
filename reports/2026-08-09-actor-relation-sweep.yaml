floating_claims:
  - Whether particular military targets were intentionally removed from no-strike protection before attack.
  - Whether specific immigration actions were personally designed by Stephen Miller or merely aligned with his known policy role.
  - Whether HHS autism research has preregistered disconfirmation criteria or is structured around predetermined conclusions.
  - Whether EPA deregulation materially increases exposure to specific developmental neurotoxicants in defined populations.
  - The degree to which U.S. material and diplomatic support was necessary, substitutable, or decisive for particular Israeli operations.

blocked_claims:
  - claim: Pete Hegseth raped and killed LaVena Lynn Johnson.
    reason: No credible primary or corroborated source linkage has been recovered.
  - claim: Every action of the Israeli government was ordered or controlled by Donald Trump.
    reason: Alliance and support do not erase independent Israeli command and decision-making.

reporter_rules:
  - Appointment creates an authority relation but does not by itself prove authorship of every subordinate action.
  - Material support, knowledge, leverage, and persistence after notice are separately traceable accountability relations.
  - Disagreement between allied actors must be retained rather than flattened into one node.
  - Harm attribution must distinguish direct action, command, authorization, enablement, financing, benefit, defense, and institutional shielding.
  - Unsupported allegations remain visible only as blocked claim records when their circulation is itself relevant.

