    - wealth
    - office
    - access
    - institutional_control
    - donor_network
    - agenda_setting_power
  rhetorical_elite_fields:
    - bureaucrat
    - teacher
    - professor
    - journalist
    - public_health_official
    - university
    - urban_or_cultural_opponent
  diagnostic: >-
    Compare who is described as powerful in rhetoric with who actually controls money,
    contracts, appointments, rules, enforcement, and protection in the causal network.

contract_and_preference_risk:
  trace:
    - prior_relationship_or_contribution
    - access_to_leader_or_agency
    - procurement_or_grant_gate
    - award_amendment_waiver_or_regulatory_relief
    - performance_history
    - enforcement_or_penalty_treatment
    - beneficiary_gain
    - competitor_public_or_user_loss
  questions:
    - Was the process competitively bid and independently scored?
    - Did connected and unconnected applicants face equivalent criteria?
    - Was scope or value expanded without renewed competition?
    - Were performance failures tolerated or penalties waived?
    - Which lobbyists donors former_associates ideological_partners or family_linked_entities had access?
    - Which subcontractors and intermediaries captured value?
  evidentiary_posture:
    - access_or_alignment_is_not_quid_pro_quo
    - contract_risk_requires_procurement_and_decision_specific_evidence
    - poor_performance_plus_expansion_raises_scrutiny_without_proving_corruption

federal_excuse_attribution:
  rule: >-
    Federal describes jurisdiction, not an ownerless force. When an official invokes
    federal rules or funding as an external constraint, trace the named actors who
    enacted, voted for, administered, interpreted, waived, preserved, opted into,
    or declined to change the constraint.
  fields:
    - congressional_sponsor_and_vote
    - president_and_executive_position
    - agency_rule_and_interpretation
    - waiver_authority
    - appropriation_control
    - state_opt_in_or_implementation
    - party_control_at_relevant_time
    - personal_role_and_available_alternatives
    - preservation_while_blame_is_externalized

harm_and_constraint_alignment:
  life_serving_direction:
    - protection_toward_vulnerability
    - accountability_toward_causal_power
    - benefit_without_hidden_externalization
    - transparent_gates
    - independent_audit
    - repair_and_compensation
  domination_direction:
    - benefit_toward_high_access_nodes
    - enforced_loss_toward_low_exit_participants
    - secrecy_and_protection_upward
    - scrutiny_and_burden_downward
    - fixed_obligations_left_with_revenue_loser
    - failed_feedback_and_repetition

current_working_hypotheses:
  - Public systems may retain universal and fixed obligations while portable public fiscal capacity moves toward selective private providers and intermediaries.
  - Lee and Blackburn may form a cross-level routing chain through state executive and federal legislative gates without occupying identical roles.
  - Freedom, family, local control, anti-tax, and anti-elite rhetoric may be selectively applied according to favored beneficiary and disfavored target.
  - Contract, donor, lobbyist, ideological, and appointment networks may shape access and tolerance, but preference and corruption must be established case by case.
  - Statewide aggregate balance may conceal concentrated household, district, rural, disability, or service loss.

