      - anti_tax_and_fiscal_restraint
      - parental_authority
      - local_control
      - school_choice
      - anti_elite_and_anti_bureaucracy
    repeated_test: >-
      Compare opposition to federal control with support for federal tax expenditures,
      defunding threats, ideological conditions, deregulation, policing, or enforcement.

