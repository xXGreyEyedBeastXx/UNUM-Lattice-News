schema: unum-lattice-news/rendition/v0.1
id: 2026-08-09-tennessee-power-money-harm-consolidation
title: Tennessee power, money, rhetoric, and accountability topology
as_of: 2026-08-09
status: draft_review
purpose: >-
  Consolidate the Tennessee education and governance thread into one causal subsystem
  covering taxes, federal and state funding, public-school obligations, private-school
  subsidies, household and district burden, institutions, gates, named leaders, policy
  levers, rhetoric, historical conduct, contracts, preferential-treatment risk,
  beneficiaries, enforced losses, audit, repair, and accountability.

core_operator:
  source: public_revenue_or_collective_capacity
  institution: body_holding_authority_money_duties_records_or_enforcement
  gate: decision_point_controlling_money_eligibility_permission_information_or_review
  leader: named_officeholder_with_capacity_to_open_close_preserve_or_redesign_gate
  lever: appropriation_tax_credit_formula_rule_waiver_contract_appointment_veto_or_enforcement_choice
  benefit: payment_subsidy_tax_advantage_access_revenue_market_or_institutional_capacity
  enforced_loss: compelled_revenue_loss_fixed_cost_service_loss_risk_or_diminished_future_capacity
  consequence: material_effect_on_students_households_workers_districts_communities_or_ecology
  audit: independent_review_of_evidence_process_and_distribution
  return_path: compensation_repair_amendment_enforcement_sanction_or_impunity

