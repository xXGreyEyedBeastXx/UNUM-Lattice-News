locks:
  - Do not compress federal state local private and intermediary routes into one government node.
  - Do not confuse gross dollars with income-relative or capacity-relative burden.
  - Do not infer collective guilt or party-wide authorship from individual acts.
  - Do not infer corruption from access donations ideology or contract benefit alone.
  - Do not erase leadership responsibility through delegation.
  - Do not erase agency constraints or procedural limits when attributing responsibility.
  - Unknowns and blind spots trigger research rather than premature defense or accusation.
