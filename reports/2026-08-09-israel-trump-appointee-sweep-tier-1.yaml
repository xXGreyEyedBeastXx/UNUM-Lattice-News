title: Trump appointees and personal-channel actors with major Israel-policy influence: tier one
as_of: 2026-08-09
status: draft_review
question: Which current Trump appointees or appointed advisers have the strongest documented connection to both Donald Trump and U.S. policy toward Israel, Gaza, or the wider regional conflict?
method:
  inclusion:
    - current formal appointment or explicit appointment to an administration-created policy body
    - direct access to Donald Trump
    - documented operational role in Israel, Gaza, Iran, arms, diplomacy, or reconstruction policy
  evidence_axes:
    - formal office
    - appointment or family/personal access
    - direct meetings and negotiations
    - public rhetoric
    - policy authority
    - funding, arms, sanctions, or military-command influence
  exclusions:
    - political sympathy without operational role
    - religious or ethnic identity without policy evidence
    - guilt by donor, family, or organizational association
