preliminary_finding: >-
  The highest-weight Israel-policy network around Trump is not one ideological bloc. It combines an evangelical ambassadorial bridge, personal real-estate and family intermediaries, formal State Department authority, and military command. Their overlap concentrates decision access while distributing responsibility across formal and informal channels.
