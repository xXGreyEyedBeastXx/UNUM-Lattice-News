notes:
  - Elise Stefanik and David Friedman require status caution because influence does not necessarily equal a current administration appointment.
  - Aryeh Lightstone and Josh Gruenbaum should be examined through their Board of Peace operational roles and prior Trump-Israel networks.
  - Tom Barrack should be examined as a regional envoy whose relations with Turkey, Syria, Gulf states, Trump, and Israel may create both alignment and tension edges.
claim_locks:
  - Do not equate Jewish identity, evangelical identity, or family relation with political ideology.
  - Do not infer Christian Zionism or supremacism without self-identification, repeated rhetoric, organizational advocacy, or policy evidence.
  - Appointment and access create accountability relevance, not automatic culpability for every downstream act.
  - Preserve disagreement and constraint edges; the network is hierarchical but not monolithic.
