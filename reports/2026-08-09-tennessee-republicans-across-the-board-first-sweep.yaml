locks:
  - Do not assign responsibility from party membership alone.
  - Do not let formal hierarchy erase informal donor, staff, lobbyist, or vendor influence.
  - Do not let informal influence substitute for evidence of control over a specific act.
  - Preserve beneficial actions and counterexamples alongside harmful or coercive conduct.
  - Date-stamp office and candidate status because multiple 2026 transitions remain incomplete.

