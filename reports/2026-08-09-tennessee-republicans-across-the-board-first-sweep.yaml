id: 2026-08-09-tennessee-republicans-across-the-board-first-sweep
title: Tennessee Republicans across the board: institutions, gates, leaders, and levers
as_of: 2026-08-09
status: draft_review
scope: >-
  First statewide power sweep covering Republican executive, legislative, legal,
  congressional, party, advocacy, donor, and vendor nodes. This is not a guilt-by-
  affiliation record. It identifies seats and gates for subsequent act-level tracing.

current_structural_facts:
  - The 114th Tennessee Senate consisted of 27 Republicans and 6 Democrats, giving Republicans supermajority control.
  - Current Senate leadership includes Randy McNally as lieutenant governor and speaker, Jack Johnson as Republican leader, and Ken Yager as caucus chair.
  - Current House leadership includes Cameron Sexton as speaker, William Lamberth as Republican leader, Mark Cochran as assistant leader, and Jeremy Faison as caucus chair.
  - Bill Lee controls the state executive gate through budget proposals, veto/signature authority, appointments, and agency direction.
  - Jonathan Skrmetti controls major state litigation and legal-opinion gates as attorney general, while the Comptroller supplies audit and public-reporting functions.
  - Tennessee's federal delegation is overwhelmingly Republican and occupies education, tax, appropriations, defense, financial-services, energy, and oversight gates.
  - Marsha Blackburn won the 2026 Republican gubernatorial primary, making the Lee-to-Blackburn transition a likely continuity path subject to the November election.

