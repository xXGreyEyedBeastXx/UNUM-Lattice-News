method:
  - trace nomination and confirmation pipeline
  - trace organizations and ideological training networks
  - trace gifts, travel, reimbursements, property transactions, and spousal income
  - trace recusals and cases involving connected actors
  - trace rulings on executive power, voting rights, reproductive rights, regulation, religion, labor, immunity, and civil rights
  - separate disclosed relationship from inferred influence and proven conflict
claim_locks:
  - Do not infer corruption solely from ideological voting.
  - Do not erase financial or access relationships merely because direct quid pro quo evidence is absent.
  - Apply the same disclosure, recusal, and conflict tests to liberal and conservative justices.
