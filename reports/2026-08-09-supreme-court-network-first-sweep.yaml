initial_findings:
  - The recovered research records a six-member conservative majority and three Trump appointees as of the 2026-08-09 snapshot.
  - Clarence Thomas, Samuel Alito, Neil Gorsuch, Brett Kavanaugh, and Amy Coney Barrett have disclosed Federalist Society connections in the recovered source bundle.
  - Leonard Leo served as a major bridge among judicial selection, confirmation advocacy, wealthy conservative donors, and private access to justices.
  - Clarence Thomas received extensive travel and other financial benefits from Harlan Crow and other wealthy benefactors, with significant items omitted from earlier disclosures and later amended or disputed according to the recovered reporting.
  - Samuel Alito took an undisclosed Alaska trip organized through Leonard Leo and financed in part by donor Paul Singer; Alito maintained disclosure was not required.
  - The Court adopted an ethics code in 2023; this research records no independent enforcement or complaint mechanism.
  - Network relation, ideological alignment, gift, travel, or access does not by itself prove that a particular vote was purchased; the proper test is repeated access, disclosure, recusal, litigant interest, timing, and decision pattern.
