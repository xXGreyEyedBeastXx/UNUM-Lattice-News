claim_locks:
  - Do not infer corruption solely from ideological voting.
  - Do not erase financial or access relationships merely because direct quid pro quo evidence is absent.
  - Apply the same disclosure, recusal, access, and conflict tests to any justice when needed to test the scoped hypothesis; symmetry of method does not require positive balancing or equal conclusions.
  - Unrelated institutionally respected rulings do not offset a documented conflict, ethics failure, rights harm, or expansion of unaccountable power.
