  - situated-relational-analysis supplies epistemic position and correction discipline
  - actor-relation sweeps supply concrete causal paths
  - life-serving-systems supplies the positive counter-architecture
  - event-specific reporting must still establish each edge rather than inheriting guilt from network proximity

research_rule: >-
  Unknowns, blind spots, unresolved crossings, and contradictions trigger research when evidence may be recoverable. Preserve genuinely unknowable or currently unresolvable claims explicitly rather than converting uncertainty into either accusation or exoneration.

next_steps:
