schema: unum-lattice-news/source-bundle/v0.1
id: source-medical-debt-and-nursing-home-ownership-2026-08-16
title: Medical debt enforcement and nursing-home ownership/quality baseline
status: active
as_of: 2026-08-16
purpose: >-
  Preserve primary government evidence for two necessity-linked harm circuits: medical care becoming debt and
  collection leverage, and publicly financed nursing-home care passing through complex ownership structures where
  ownership, staffing, quality, and accountability must remain jointly traceable.
