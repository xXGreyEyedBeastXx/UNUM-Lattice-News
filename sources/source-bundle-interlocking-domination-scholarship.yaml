limitations:
  - This bundle identifies intellectual lineages and does not substitute for work-specific citations.
  - Inclusion of a scholar does not mean that scholar endorses every proposition in the synthesis.
  - The framework must still be tested against concrete events, affected participants, competing theories, and disconfirming evidence.
  - Western academic sources should not displace Indigenous, Global South, embodied, artistic, oral, or community knowledge.
locks:
  - Do not use scholarly lineage as automatic proof of an event-specific causal claim.
  - Do not flatten differences among feminist, Indigenous, Marxist, disability-justice, decolonial, and care traditions.
  - Recover exact works and passages before quoting or attributing a specific proposition.
