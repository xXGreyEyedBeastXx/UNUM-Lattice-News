limitations:
  - This first sweep does not yet contain district-level tax, revenue, enrollment, or expenditure microdata.
  - Federal grant allocation totals and pass-through timing require separate U.S. Department of Education and Tennessee data extraction.
  - The source bundle establishes fiscal and legal channels but does not yet measure causal effects on achievement, segregation, tuition, staffing, or school closures.
  - Tax-credit scholarship rules beginning in 2027 may change through federal implementation guidance.
