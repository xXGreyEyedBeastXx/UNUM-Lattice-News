relevant_claims:
  - About 1 in 31 children aged 8 years were identified with autism across the CDC ADDM Network's 16 monitored communities using 2022 data.
  - Identified prevalence varied substantially across monitored communities.
limitations:
  - The estimate is based on monitored communities and is not a complete national census.
  - Identification rates reflect surveillance, evaluation, and service-access differences as well as underlying prevalence.
