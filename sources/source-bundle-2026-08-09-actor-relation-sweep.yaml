sources:
  - id: source-white-house-cabinet-appointments-2025
    title: President Trump Announces Cabinet and Cabinet-Level Appointments
    author_or_institution: The White House
    publication_date: "2025-01-20"
    source_type: official_statement
    url: https://www.whitehouse.gov/presidential-actions/2025/01/cabinet-and-cabinet-level-appointments/
    supports:
      - Trump nominated Pete Hegseth as Secretary of Defense.
      - Trump nominated Robert F. Kennedy Jr. as Secretary of Health and Human Services.
    limitations:
      - Establishes appointment and formal role, not responsibility for every subordinate action.

  - id: source-white-house-maha-commission-2025
    title: President Donald J. Trump Establishes the Make America Healthy Again Commission
    author_or_institution: The White House
    publication_date: "2025-02-13"
    source_type: official_statement
    url: https://www.whitehouse.gov/fact-sheets/2025/02/fact-sheet-president-donald-j-trump-establishes-the-make-america-healthy-again-commission/
    supports:
      - Trump established the MAHA Commission.
      - HHS Secretary Robert F. Kennedy Jr. chairs the commission.
    limitations:
      - Official goals do not establish implementation quality or scientific validity.

  - id: source-hhs-trump-kennedy-autism-actions-2025
    title: President Trump, Secretary Kennedy Announce Bold Actions to Tackle Autism Epidemic
    author_or_institution: U.S. Department of Health and Human Services
    publication_date: "2025-09-22"
    source_type: official_statement
    url: https://www.hhs.gov/press-room/hhs-trump-kennedy-autism-initiatives-leucovorin-tylenol-research-2025.html
    supports:
      - Trump and Kennedy jointly announced federal autism initiatives.
      - The administration publicly used epidemic, treatment, risk, and research framing.
    limitations:
      - Official announcement is evidence of rhetoric and policy, not proof of causal claims.

  - id: source-white-house-kirk-administration-roster-2025
    title: President Trump Joins Nation in Celebrating Charlie Kirk's Enduring Legacy
    author_or_institution: The White House
    publication_date: "2025-09-22"
    source_type: official_statement
    url: https://www.whitehouse.gov/articles/2025/09/president-trump-joins-in-celebrating-charlie-kirks-enduring-legacy/
    supports:
