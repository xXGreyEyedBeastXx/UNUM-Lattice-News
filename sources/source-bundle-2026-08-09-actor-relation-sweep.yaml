      - Used only for current-role identification, not ideological or causal attribution.

  - id: source-ap-epa-maha-deregulation-2026
    title: EPA promised a Make America Healthy Again agenda. It has yet to materialize, frustrating activists
    author_or_institution: Associated Press
    publication_date: "2026-07-01"
    source_type: investigative_reporting
    url: https://www.ap.org/news-highlights/elections/2026/epa-promised-a-make-america-healthy-again-agenda-it-has-yet-to-materialize-frustrating-activists/
    supports:
      - EPA publicly promised a MAHA environmental-health agenda.
      - AP documented conflict between those promises and broad deregulatory actions.
    limitations:
      - Establishes governance tension, not a direct causal link to autism.

  - id: source-reuters-netanyahu-rejects-trump-gaza-plan-2026
    title: Netanyahu says Israel won't pull out of Gaza before Hamas disarms
    author_or_institution: Reuters
    publication_date: "2026-08-09"
    source_type: investigative_reporting
    url: https://www.reuters.com/world/middle-east/israel-rejects-trumps-15-point-plan-gaza-pm-netanyahu-says-2026-08-09/
    supports:
      - Netanyahu rejected part of a Trump-backed Gaza plan.
      - The relationship includes alliance and material support alongside independent Israeli decision-making and disagreement.
    limitations:
      - Does not by itself document the full U.S.-Israel support chain.

  - id: source-un-gaza-genocide-inquiry-2025
    title: Legal analysis of the conduct of Israel in Gaza pursuant to the Convention on the Prevention and Punishment of the Crime of Genocide
    author_or_institution: UN Independent International Commission of Inquiry on the Occupied Palestinian Territory, including East Jerusalem, and Israel
    publication_date: "2025-09-16"
    source_type: official_investigation
    url: https://www.un.org/unispal/document/commission-of-inquiry-report-genocide-in-gaza-a-hrc-60-crp-3/
    supports:
      - The Commission concluded that Israeli authorities and forces committed genocidal acts and possessed specific genocidal intent.
      - Supplies the genocide-assessment target for tracing external support, knowledge, leverage, and enablement.
    limitations:
      - Does not by itself assign responsibility to every foreign supporter or official; those relations require separate evidence.
