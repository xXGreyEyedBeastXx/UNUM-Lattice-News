locks:
  - Prior-group identity, broader movement lineage, local-cell relation, and individual-act attribution are separate questions.
  - Denial of one relation type must not erase other demonstrated relation types.
  - Decentralized does not mean disconnected.
  - Preserve extremist material only as evidence; do not reproduce operational instructions or recruitment guidance beyond what is necessary for evidentiary identification.
  - Do not infer criminal conduct from ideology, anonymous channel participation, or attendance alone.
  - Do not publish private identities, addresses, or doxxing material.
