schema: unum-lattice-news/source-bundle/v0.1
id: source-proof-chain-closure-2026-08-17
title: Proof-chain closure — terminal beneficiaries, influence, redress, and extremist taxonomy
status: active
as_of: 2026-08-17
purpose: >-
  Close evidentiary gaps that remain after the article-readiness passes. This bundle emphasizes primary records
  showing terminal capital allocation, direct lobbying on revenue-relevant programs, institutional redress capacity,
  and careful typing of extremist or hate-group identities. It does not treat lobbying as proof of policy control,
  financial return as dollar-for-dollar tracing of a public payment, or ideological labels as substitutes for conduct.
