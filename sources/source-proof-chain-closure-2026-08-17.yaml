  - corporate_revenue != profit
  - high_concentration != anticompetitive_conduct_by_definition
  - extremist_monitor_classification != criminal_adjudication
  - nationalist_alone != white_nationalist_or_hate_group
  - named_group_membership_or_participation_requires_actor_specific_evidence
