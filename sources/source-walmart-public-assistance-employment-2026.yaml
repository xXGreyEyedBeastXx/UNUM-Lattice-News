schema: unum-lattice-news/source-bundle/v0.1
id: source-walmart-public-assistance-employment-2026
title: Walmart employment, public-assistance, compensation, profit, shareholder-return, and ownership evidence, 2026
accessed: 2026-08-16
purpose: >-
  Provide a recoverable source base for whole-circuit Walmart accounting: worker compensation,
  worker-household public-assistance participation, corporate surplus, executive compensation,
  shareholder distributions, and concentrated ownership. The bundle preserves legal distinctions
  while requiring the economic circuit to be recomposed before conclusions are drawn.
sources:
  - id: source-gao-working-medicaid-snap-employers-2026
    publisher: U.S. Government Accountability Office
    source_class: primary_government_analysis
    title: Federal Social Safety Net Programs: Millions of Workers, Including Many Employed by Large Employers, Continue to Rely on Medicaid and SNAP
    report: GAO-26-108703
    date: 2026-06-22
    public_release: 2026-07-22
    url: https://www.gao.gov/products/gao-26-108703
    supports:
      - GAO estimated 13.8 million wage-earning adults enrolled in Medicaid and 10.6 million wage-earning adults living in SNAP-recipient households worked at some point during 2024.
      - About two-thirds of wage-earning adults in each program worked full time for at least part of 2024.
      - Most working beneficiaries were employed in the private sector, and large private employers repeatedly appeared among the employers with the most beneficiaries in selected states.
      - Georgia September 2025 data estimated 4,595 working adult Medicaid enrollees employed by Walmart, 4.8 percent of the relevant working-adult Medicaid population in that table.
      - Tennessee September 2025 data estimated 3,513 working adult SNAP recipients employed by Walmart, 2.9 percent of working adult SNAP recipients working for an employer in that table.
    limitations:
      - Employer estimates are based on 15 state agencies in 11 states and are not generalizable to all states or nationwide employer totals.
      - Program participation does not identify why any individual worker is eligible.
      - The data do not estimate the public dollar cost associated with each employer's workforce.
      - GAO does not conclude that employers caused program participation or that public benefits are direct employer subsidies.

  - id: source-walmart-people-fye2026
    publisher: Walmart Inc.
    source_class: organization_primary_statement
    title: Our People / Working at Walmart
    date: 2026
    url: https://corporate.walmart.com/purpose/esgreport/our-people
    supports:
      - Walmart reports an average U.S. hourly wage of about 18 dollars overall as of FYE2026.
      - Walmart reports wage, health, retirement, education, leave, and other employee-benefit investments.
    limitations:
      - Employer self-report is appropriate for stated compensation policy but does not establish program incidence or household adequacy.
      - Average wage obscures variation by role, market, hours, tenure, and household circumstances.

  - id: source-walmart-fy2026-10k
    publisher: Walmart Inc. / U.S. Securities and Exchange Commission
    source_class: primary_corporate_filing
    title: Walmart Inc. Form 10-K for fiscal year ended January 31, 2026
    date: 2026-03
    url: https://www.sec.gov/Archives/edgar/data/104169/000010416926000055/wmt-20260131.htm
    supports:
      - 706.413 billion dollars in fiscal 2026 net sales
      - 29.825 billion dollars in operating income
      - 21.893 billion dollars in net income attributable to Walmart
      - 7.507 billion dollars in dividends paid
      - 8.088 billion dollars used to purchase company stock
      - 85.0 million shares repurchased at an average 95.13 dollars per share
    limitations:
      - Net income, dividends, buybacks, retained earnings, and equity appreciation overlap economically and cannot be summed as independent gains.
      - Company-wide accounts do not identify the causal contribution of worker public-assistance participation to corporate profit.

  - id: source-walmart-2026-proxy
    publisher: Walmart Inc. / U.S. Securities and Exchange Commission
    source_class: primary_corporate_filing
    title: Walmart Inc. 2026 Proxy Statement
    date: 2026-04-23
    url: https://www.sec.gov/Archives/edgar/data/104169/000119312526173673/wmt-20260423.htm
    supports:
      - fiscal 2026 total compensation of 29,240,930 dollars for then-CEO Doug McMillon
      - estimated fiscal 2026 total compensation of 30,520 dollars for Walmart's median associate under the SEC pay-ratio methodology
      - reported CEO-to-median-associate compensation ratio of 958 to 1
      - approximately 44 percent of Walmart shares held by entities related to founder Sam Walton's family as of April 10, 2026
      - Walton Enterprises beneficial ownership/voting figure of 44.11 percent when voting power over Walton Family Holdings Trust shares is included
      - Walton Family Holdings Trust held 513,524,456 shares, 6.44 percent of outstanding shares, whose voting power was exercised by Walton Enterprises under irrevocable proxy
      - Walmart states it returned 15.6 billion dollars to shareholders through dividends and share repurchases and approved a new 30 billion dollar repurchase authorization
    limitations:
      - The median-associate compensation figure uses SEC pay-ratio methodology and is not the same metric as average hourly wage.
      - April 10 ownership is not a record-date ledger for every fiscal 2026 dividend or repurchase.
      - Walton Family Holdings Trust shares are included within Walton Enterprises' beneficial/voting total and must not be double counted.
      - Ownership does not establish authorship of every corporate policy.

locks:
  - Medicaid or SNAP paid to a worker household != direct payment to Walmart.
  - Public support may create an indirect employer benefit, but the magnitude requires incidence or counterfactual analysis.
  - Legal-beneficiary separation must not terminate the money trace.
  - Household income, family size, work hours, other earners, and program rules can affect eligibility.
  - Selected-state beneficiary counts must not be summed into a national Walmart estimate without compatible national data.
  - Net income, dividends, repurchases, retained earnings, and equity-value change require anti-double-counting lineage.
  - Executive compensation and median-worker compensation can be compared distributionally without asserting a literal transfer between the two seats.
  - Ownership concentration is part of the terminal return path and must remain visible.
