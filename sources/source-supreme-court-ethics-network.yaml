limitations:
  - Financial or social connection does not by itself establish improper influence on a judicial decision.
  - Disclosure records may be incomplete, amended, delayed, or interpreted differently by the justice and ethics experts.
  - Individual cases require separate conflict, recusal, litigant-interest, timing, and decision analysis.
locks:
  - Absence of direct quid pro quo evidence does not make access, gifts, disclosure failures, recusal questions, donor relations, or selection networks irrelevant to accountability analysis.
