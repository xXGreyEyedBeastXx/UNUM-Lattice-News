locks:
  - Representative complaint sources are not a census of every left-wing or labor constituency.
  - Advocacy organizations are evidence of claims and framing; use their underlying data separately for factual promotion.
  - Federal contracts purchase goods and services and are not automatically corporate welfare.
  - Tax expenditures require incidence analysis before assigning corporate benefit.
  - Violence, criminal conduct, ideology, association, protest, and funding must remain separately typed.
