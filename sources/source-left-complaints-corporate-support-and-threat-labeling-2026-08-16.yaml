id: source-left-complaints-corporate-support-and-threat-labeling-2026-08-16
title: Left/labor complaint census, corporate public support, and ideological threat-labeling baseline
status: active
as_of: 2026-08-16
purpose: >-
  Preserve representative current complaint surfaces from labor, progressive, socialist, and public-interest
  organizations alongside primary government rhetoric and official public-finance baselines. This bundle
  records what is being complained about and what public institutions are actually doing; it does not assume
  that either side's causal interpretation is correct merely because it is stated.
