schema: unum-lattice-news/source-bundle/v0.1
id: source-climate-cross-sector-capital-capture-2026-08-17
title: Climate forcing, cross-sector ownership, damage demand, land scarcity, and food concentration
status: active
as_of: 2026-08-17
purpose: >-
  Preserve primary and high-quality evidence for the investigation of whether capital networks that
  are materially exposed to fossil-fuel production are also positioned to receive returns from
  building repair and replacement, agricultural inputs and processing, farmland appreciation,
  climate-risk analytics, and other sectors affected by climate-driven damage or scarcity. This
  bundle deliberately does not collapse common ownership, direct corporate control, active
  governance, climate knowledge, profit opportunity, and specific harmful intent into one claim.

sources:
  - id: exxonmobil-2026-proxy-beneficial-owners
    class: primary_sec_filing
    url: https://www.sec.gov/Archives/edgar/data/34088/000119312526147614/d16317ddef14a.htm
    date: 2026
    supports:
      - Vanguard_reported_as_10_4_percent_beneficial_owner_of_ExxonMobil
      - BlackRock_reported_as_6_5_percent_beneficial_owner_of_ExxonMobil
      - State_Street_reported_as_5_1_percent_beneficial_owner_of_ExxonMobil
    limitations:
      - Beneficial ownership reported in a proxy does not mean the asset manager is the ultimate economic owner of every share.
      - Reporting dates and underlying Schedule 13G dates differ and must be preserved.

