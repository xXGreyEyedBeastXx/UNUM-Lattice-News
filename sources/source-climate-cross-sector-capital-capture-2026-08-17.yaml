claim_partition:
  directly_observed_or_stated:
    - overlapping_reported_institutional_beneficial_ownership_across_fossil_fuel_building_materials_food_processing_and_farmland_companies
    - direct_Koch_operating_integration_across_refining_polymers_building_products_fertilizer_commodity_trading_and_investment_businesses
    - severe_storm_damage_can_raise_roofing_and_home_improvement_demand
    - Farmland_Partners_explicitly_markets_food_demand_and_high_quality_farmland_scarcity_as_an_investment_thesis
    - US_food_and_seed_markets_show_high_concentration_in_named_segments
    - BlackRock_explicitly_models_climate_risk_and_opportunity_in_investment_workflows
    - Exxon_internal_scientific_work_quantitatively_anticipated_warming
  supported_inferences:
    - diversified_capital_can_be_exposed_to_returns_on_both_climate_forcing_and_climate_damage_or_scarcity_sides_of_the_economy
    - common_ownership_and_direct_conglomerate_control_create_real_governance_and_coordination_channels_that_should_be_traced_rather_than_treated_as_unrelated_coincidence
    - climate_damage_can_generate_replacement_demand_and_asset_repricing_that_is economically legible to sophisticated investors
  unresolved:
    - whether_BlackRock_Vanguard_or_other_named_asset_managers_used_governance_power_to_preserve_fossil_emissions_for_the_purpose_of_creating_downstream_damage_or_scarcity_returns
    - whether_any_corporate_board_or_investment_committee_explicitly_linked_additional_global_warming_to_higher_replacement_demand_land_values_food_market_power_or_reconstruction_revenue
    - net_portfolio_gain_or_loss_from_additional_warming_after_all_cross_sector_losses_and_gains_are counted
    - actor_specific_knowledge_and_decision_paths_for_each_cross_sector_allocation
  affirmatively_not_established:
    - universal_claim_that_BlackRock_or_Vanguard_caused_every_major_current_harm
    - proof_that_major_storms_are intentionally generated by these firms
    - proof_that_product_lifetime_reduction_was_the_original purpose of fossil emissions

locks:
  - common_ownership != specific_directive
  - common_ownership != no_coordination_capacity
  - asset_manager_beneficial_ownership != ultimate_economic_ownership_of_every_share
  - direct_conglomerate_control != proof_of_harmful_motive
  - climate_knowledge != desire_for_every_climate_harm
  - foreseeable_damage_plus_persistence_can_strengthen_responsibility_without_proving_desire
  - storm_damage_demand != storm_creation
  - climate_change_can_amplify_weather_risk_without_making_every_storm_climate_attributable
  - farmland_scarcity_investment_thesis != proof_that_investors_caused_the_scarcity
  - institutional_farmland_interest != institutional_ownership_of_most_US_farmland
  - concentration != collusion
  - profit_opportunity != culpability_without_actor_specific_mechanism
  - preserve_each_edge_even_when_the_whole_circuit_is_not_yet_proven
