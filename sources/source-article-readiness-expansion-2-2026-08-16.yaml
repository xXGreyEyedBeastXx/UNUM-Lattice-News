id: source-article-readiness-expansion-2-2026-08-16
title: Article readiness expansion 2 — healthcare, housing ownership, data centers, labor, and servicing
status: active
as_of: 2026-08-16
purpose: >-
  Preserve primary and high-authority evidence for a third article-readiness fill pass covering public-healthcare
  finance and capital return, private-equity rental ownership, Tennessee data-center cost shifting, carceral labor,
  detected wage extraction, and the federal student-loan servicing ecosystem. Sources support scoped claims only.
