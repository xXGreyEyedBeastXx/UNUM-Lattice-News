schema: unum-lattice-news/source-bundle/v0.1
id: source-wlm-normalization-recruitment-ethnostate-2026-08-17
title: White Lives Matter normalization, recruitment, and ethnostate objective
status: active
as_of: 2026-08-17
purpose: >-
  Preserve the source lineage establishing that the April 2021 White Lives Matter initiative is not merely a generic
  slogan or loose white-supremacist identity marker. User-supplied primary copies of Activist Manual 2.0 (January 2022)
  and Activist Manual 3.0 (2024) were directly reviewed on 2026-08-17. They establish an explicit 99% or 99%+ White
  demographic objective, a White Nationalist ideological endpoint, and a deliberate normalization/recruitment pathway.
  Tactical recruitment, evasion, anonymity, and event-execution instructions are intentionally not reproduced.
