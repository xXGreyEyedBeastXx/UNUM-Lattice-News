schema: unum-lattice-news/source-bundle/v0.1
id: source-boycott-bans-and-selective-economic-redress-2026-08-16
title: Boycott bans, anti-boycott law, public contracting, and selective economic redress baseline
status: active
as_of: 2026-08-16
purpose: >-
  Preserve primary statutory, regulatory, judicial, and empirical sources showing how U.S. federal and
  state governments condition contracts, investments, tax treatment, or enforcement on participation
  in or refusal of boycotts. The bundle distinguishes political-boycott advocacy from commercial
  refusal-to-deal conduct and preserves conflicting constitutional rulings rather than treating
  'boycott' as a single legal category.
