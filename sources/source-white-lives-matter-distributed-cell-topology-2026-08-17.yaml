      - WLM branding is paired with books, physical training, heterosexual social/family imagery, and white reproduction messaging
    limitations:
      - image provenance should be tied to the source post before using it for a time-specific claim
  - id: fundraiser-14-words-capture
    artifact_sha256: e63dff53cd06877e7cd6356172f956474281791a81ab4cfc2807ba6cc19bac79
    artifact_kind: screenshot
    observed:
      - an anonymous donor message reproduces the 14 Words on a fundraiser page
    limitations:
      - this capture alone does not establish a WLM relation to the donor, beneficiary, fundraiser, or platform
      - retain as an unresolved ideological-signal lead unless additional provenance establishes a relation

relation_posture:
  movement_to_local_efforts: documented
  local_efforts_same_legal_entity: not_established
  local_efforts_independent_actors: not_established
  shared_manual_branding_schedule_infrastructure: documented
  individual_local_act_attribution: requires_event_specific_evidence

locks:
  - Decentralized does not mean disconnected.
  - Cell or chapter relation does not erase local attribution requirements.
  - Formal separation does not erase documented movement, infrastructure, messaging, or coordination relations.
  - Search-result similarity alone is not affiliation evidence; prefer official navigator placement, official forwarding, shared infrastructure, or other recoverable relation evidence.
  - Preserve extremist material as evidence without reproducing recruitment or operational instructions beyond what is necessary to identify the evidentiary relation.
  - Do not publish private identities, addresses, or doxxing material.
