    artifact_kind: screenshot
    observed:
      - WLM-branded Germany, Georgia chat, Greece, Germany chat, and Germany materials channels appear in search
      - these captures are discovery evidence; official-channel routing or cross-forwarding is the stronger affiliation test
  - id: wlm-lifestyle-recruitment-poster
    artifact_sha256: d76abd5af1e0b33ce92ab0feb6755a39cded156b5f45c8e7ab65c8fa0c3710b5
