    observed:
      - WLM Tennessee appears in recent results
      - WLM-branded materials, backup, viewing, Montana, events, Pennsylvania, and United Kingdom channels appear in global search
      - unrelated search results also appear, so search-result coincidence alone is not affiliation evidence
  - id: telegram-search-wlm-g-0901
