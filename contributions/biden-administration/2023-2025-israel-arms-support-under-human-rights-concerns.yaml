  contribution_type: transfer
  start_date: "2023-10-07"
  end_date: "2025-01-20"
  scope: >-
    Continued U.S. security assistance and arms-transfer policy toward Israel during
    the Gaza war while the administration's own review framework identified serious
    concerns about possible misuse and civilian harm.
  causal_fields:
    - Israel / Gaza
    - U.S. arms transfers
