    - cross-administration arms-transfer comparison
  immediate_mechanism: >-
    The Biden administration maintained arms/security assistance while adopting a
    human-rights-focused Conventional Arms Transfer policy and NSM-20 assurance framework.
    GAO reported that no transfers were stopped as a result of those updated policies.
  direct_effects:
    - "U.S. arms/security assistance to Israel continued during the war."
    - "Human-rights-focused policy and NSM-20 review did not result in a pause of arms transfers."
  downstream_effects:
    - "GAO reports State assessed U.S.-origin defense articles were likely involved in numerous incidents raising concern and that it was reasonable to assess covered articles had been used by Israel inconsistently with human-rights obligations."
    - "Specific incident-by-incident U.S.-weapon causation remained unresolved in the State assessment described by GAO."
