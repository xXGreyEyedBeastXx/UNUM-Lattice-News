  contribution_type: regulatory_action
  start_date: "2025-02-21"
  end_date: null
  scope: >-
    Rescission of National Security Memorandum-20, which had required specified
    written assurances regarding compliance with international law and humanitarian-assistance access for certain recipients of U.S. defense articles.
  causal_fields:
    - U.S. arms transfers
    - Israel / Gaza
    - civilian harm oversight
    - human-rights safeguards
