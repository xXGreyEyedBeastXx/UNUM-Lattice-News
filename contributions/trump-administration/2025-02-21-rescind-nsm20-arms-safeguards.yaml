    - military-industrial complex
    - arms-transfer accountability
  immediate_mechanism: >-
    Removal of NSM-20's additional assurance/reporting framework. GAO reported the
    memorandum was rescinded by the Trump administration on February 21, 2025.
  direct_effects:
    - "NSM-20's specified assurance framework was terminated."
    - "The related periodic review structure described by State officials no longer operated under NSM-20."
  downstream_effects:
    - "Specific arms transfers, recipient conduct, and civilian harms after rescission require transfer/event-level linkage."
  affected_participants_or_ecologies:
