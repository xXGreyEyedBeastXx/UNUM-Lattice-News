contribution_record:
  id: trump-2025-01-20-birthright-citizenship-restriction-order
  title: "Trump orders federal restriction of birthright citizenship; Supreme Court later rejects the constitutional theory"
  contributor_node: donald-trump
  mechanism_node: null
  contribution_type: policy
  start_date: "2025-01-20"
  end_date: "2026-06-30"
  scope: >-
    Executive Order 14160 directed federal agencies not to recognize birthright citizenship
    for specified children born in the United States based on parental immigration status.
    Federal courts enjoined implementation, and the Supreme Court held on June 30, 2026 that
    children born in the United States to parents unlawfully or temporarily present are citizens
    at birth under the Fourteenth Amendment.
  causal_fields:
    - citizenship
    - Fourteenth Amendment
    - executive constitutional interpretation
    - immigration
    - judicial constraint
  studies_or_spreads:
    - Trump constitutional safeguard trajectory ledger
    - citizenship and equal-membership study
    - judicial resistance and re-entry study
  immediate_mechanism: >-
    The order directed State, Justice, Homeland Security, Social Security, and other federal
    agencies to deny federal recognition of citizenship to specified U.S.-born children based
    on their parents' immigration status, with implementation scheduled after 30 days. Litigation
    prevented the policy from taking effect against the certified class, and the Supreme Court
    later rejected the order's interpretation of the Citizenship Clause.
  direct_effects:
    - "Federal agencies were ordered to prepare for nonrecognition of citizenship for the defined categories of U.S.-born children."
    - "Lower federal courts enjoined enforcement before the policy could take effect against the certified class."
    - "On June 30, 2026, the Supreme Court held that the affected children are citizens at birth under the Fourteenth Amendment and affirmed the injunction."
  downstream_effects:
    - "The attempted restriction is evidence of executive preference and formal action toward narrowing constitutional citizenship by executive order."
    - "The Supreme Court decision is evidence that a major judicial constitutional safeguard remained effective in this episode."
    - "Realized denial-of-citizenship harm should not be scored for the blocked class without evidence that any individual was actually denied recognition before or outside the injunction."
  affected_participants_or_ecologies:
    - U.S.-born children of parents unlawfully present in the United States
    - U.S.-born children of certain temporarily present noncitizen parents
    - immigrant families
    - federal and state citizenship-document systems
    - constitutional judicial review
