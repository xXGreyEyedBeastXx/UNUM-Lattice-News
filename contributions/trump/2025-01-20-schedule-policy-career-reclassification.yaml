contribution_record:
  id: trump-2025-01-20-schedule-policy-career-reclassification
  title: "Trump reinstates and later implements Schedule Policy/Career for policy-influencing civil-service positions"
  contributor_node: donald-trump
  mechanism_node: null
  contribution_type: regulatory_action
  start_date: "2025-01-20"
  end_date: null
  scope: >-
    Reinstatement, rulemaking, and implementation of Schedule Policy/Career for career
    positions classified as confidential, policy-determining, policymaking, or policy-advocating,
    with reduced adverse-action protections and stronger executive removal authority.
  causal_fields:
    - civil service
    - executive control
    - personnel independence
    - institutional constraint
    - policy implementation
  studies_or_spreads:
    - Trump constitutional safeguard trajectory ledger
    - civil-service independence study
  immediate_mechanism: >-
    The January 2025 order reinstated the former Schedule F framework as Schedule Policy/Career,
    while stating that covered employees need not personally or politically support the President
    but must faithfully implement lawful administration policy. OPM finalized implementing rules
    in February 2026, and a June 2026 executive order transferred listed senior policy-influencing
    positions into the category.
  direct_effects:
    - "A new implemented excepted-service category covers designated policy-influencing career positions."
    - "Covered positions remain career and merit-based according to OPM rather than becoming ordinary political appointments."
    - "Covered employees are exempted from ordinary adverse-action procedures specified in the implementing framework."
    - "The executive branch obtained greater removal discretion over designated policy-influencing career positions."
  downstream_effects:
    - "Potential reduction in career officials' practical ability to resist unlawful or improper pressure requires position- and event-specific evidence."
    - "Potential improvement in removal of poor performers or misconduct is the administration's stated protective rationale and must remain visible where supported."
  affected_participants_or_ecologies:
    - federal career civil service
    - policy-influencing federal employees
    - federal agency institutional continuity
    - public administration and oversight systems
