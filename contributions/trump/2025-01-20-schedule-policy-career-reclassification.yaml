  counterevidence:
    - "OPM states that Schedule Policy/Career positions remain career, merit-based positions rather than political appointments."
    - "The January 2025 order expressly says covered employees are not required to personally or politically support the President."
    - "The administration states the framework is intended to improve accountability for misconduct and poor performance."
  unknowns:
    - "How many employees have been removed, reassigned, chilled, or protected from misconduct under the implemented framework?"
    - "Which covered employees have alleged pressure to violate law or professional obligations, and what independent evidence supports those allegations?"
  path_forward:
    - "Build position- and agency-level implementation records rather than treating all covered employees as one population."
    - "Track litigation, Merit Systems Protection Board issues, whistleblower consequences, and measurable performance outcomes."
  debunking_record:
    claim_as_tested: "Schedule Policy/Career converts the federal civil service into a purely partisan patronage workforce."
    strongest_supporting_case:
      - "The framework increases removal discretion over policy-influencing career positions."
    expected_evidence_if_true:
      - "Political loyalty would be an employment requirement and positions would cease to be career or merit-based."
    recovered_evidence:
      - "OPM describes the positions as career and merit-based, and the executive order disclaims a requirement of personal or political support for the President."
    decisive_failure:
      - "The formal framework does not establish a purely partisan patronage workforce."
    why_claim_fails: "The supported claim is reduced adverse-action protection and increased executive personnel control, not formal conversion of all covered positions into political appointments."
    residual_claims:
      - "The framework is confirmed evidence of increased executive control over policy-influencing career personnel."
