contribution_record:
  id: trump-2025-02-18-independent-agency-presidential-control
  title: "Trump orders expanded White House supervision of independent regulatory agencies"
  contributor_node: donald-trump
  mechanism_node: null
  contribution_type: regulatory_action
  start_date: "2025-02-18"
  end_date: null
  scope: >-
    Executive order extending presidential and OMB supervision into covered independent
    regulatory agencies through regulatory review, budget-apportionment review, policy
    coordination, performance standards, White House liaisons, and controlling executive-branch
    legal interpretations.
  causal_fields:
    - executive power
    - independent regulatory agencies
    - institutional constraint
    - budget control
    - legal interpretation
  studies_or_spreads:
    - Trump constitutional safeguard trajectory ledger
    - executive centralization study
  immediate_mechanism: >-
    The order declares a policy of Presidential supervision and control of the entire executive
    branch, subjects covered independent agencies to White House regulatory review and policy
    coordination, authorizes OMB review and adjustment of covered agency apportionments consistent
    with law, and makes Presidential and Attorney General legal interpretations controlling for
    executive-branch employees.
  direct_effects:
    - "Covered independent regulatory agencies became subject to OIRA review for significant regulatory actions."
    - "OMB received an ongoing role reviewing covered independent-agency obligations against presidential policies and priorities, subject to law."
    - "Covered independent agencies were directed to coordinate priorities and strategic plans with White House offices."
    - "The order states that Presidential and Attorney General legal interpretations control executive-branch employees in official duties."
  downstream_effects:
    - "Potential reduction in institutional independence from direct presidential policy control requires agency-by-agency and litigation-specific review."
    - "Potential effects on election, communications, securities, competition, labor, and other regulatory safeguards depend on subsequent implementation."
  affected_participants_or_ecologies:
    - independent regulatory agencies
    - career and appointed federal officials
    - regulated populations and industries
    - public institutional checks and balances
