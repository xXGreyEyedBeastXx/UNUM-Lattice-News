  debunking_record:
    claim_as_tested: "The February 2025 order completed presidential capture of all independent federal institutions."
    strongest_supporting_case:
      - "The order expressly expands presidential and OMB control over covered independent regulatory agencies."
    expected_evidence_if_true:
      - "Elimination of legally meaningful independence across all covered institutions and inability of courts or Congress to constrain the change."
    recovered_evidence:
      - "The order preserves applicable-law limitations and excludes Federal Reserve monetary policy."
    decisive_failure:
      - "The order alone does not establish complete institutional capture or elimination of external judicial and legislative constraints."
    why_claim_fails: "The evidence supports expanded executive control, not completed control of every independent institution."
    residual_claims:
      - "The order is confirmed evidence of a preferred and implemented direction toward stronger presidential control over covered independent agencies."
