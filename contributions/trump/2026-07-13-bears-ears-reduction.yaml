contribution_record:
  id: trump-2026-07-13-bears-ears-reduction
  title: "Trump reduces Bears Ears monument protection and terminates Bears Ears Commission"
  contributor_node: donald-trump
  mechanism_node: bears-ears-2026-boundary-modification
  contribution_type: policy
  start_date: "2026-07-13"
  end_date: null
  scope: >-
    Presidential proclamation reducing Bears Ears National Monument, removing the
    Bears Ears Commission, and reopening excluded federal lands to specified public-land,
    mineral, geothermal, and mining-law uses after the stated delay.
  causal_fields:
    - Indigenous sovereignty
    - sacred land
    - public land
    - mineral extraction
    - environmental protection
  studies_or_spreads:
    - Trump second-term harm audit
    - Indigenous harm ledger
    - land and extraction study
  immediate_mechanism: >-
    Presidential proclamation excluded approximately 1,238,904 acres from the monument,
    retained approximately 121,096 acres, terminated the Bears Ears Commission, and
    provided for excluded lands to reopen to specified mineral/geothermal leasing and mining-law entry.
  direct_effects:
    - "Approximately 1.24 million acres lost Bears Ears National Monument status under the proclamation."
    - "The Bears Ears Commission was disbanded and terminated."
    - "Excluded lands were scheduled to reopen to specified extractive and public-land uses subject to law and existing rights."
  downstream_effects:
    - "Specific mining, leasing, ecological, archaeological, sacred-site, grazing, and cultural-resource harms require project/parcel-level tracing."
  affected_participants_or_ecologies:
    - Hopi Nation
    - Navajo Nation
    - Ute Indian Tribe of the Uintah and Ouray Reservation
    - Ute Mountain Ute Tribe
    - Pueblo of Zuni
    - cultural and sacred landscapes
    - affected ecosystems and future generations
