    Investigative operator for cases where anti-discrimination, affirmative-action, equity, or DEI
    measures are rhetorically classified as Marxist, discriminatory, wasteful, or anti-merit and the
    procurement state changes which contractor behaviors it requires, prohibits, investigates, or
    punishes. The operator compares the before-and-after coercive structure rather than describing the
    change as simple deregulation.
