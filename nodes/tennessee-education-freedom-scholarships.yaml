accountability_questions:
  - Which participating private schools receive aggregate public payments?
  - What admissions, disability-service, testing, educator-licensing, civil-rights, transparency, and financial-audit obligations attach to receipt?
  - How many recipients were already privately enrolled before receiving a subsidy?
  - What administrative vendors manage applications, payments, and data?
  - How are rejected applicants, lawful-presence checks, and priority categories distributed?
locks:
  - Public subsidy does not imply public-school-equivalent access or obligations.
  - A family receiving a scholarship is not itself evidence of wrongdoing.
  - Measure both direct state expenditure and indirect effects on public-district revenue growth and fixed costs.
