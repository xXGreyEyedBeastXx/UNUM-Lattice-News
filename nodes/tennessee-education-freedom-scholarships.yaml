id: tennessee-education-freedom-scholarships
title: Tennessee Education Freedom Scholarships
family: instrument
subtype: program
landing_status: landed
lifecycle_status: active
updated: 2026-08-09
summary:
  text: >-
    Tennessee state-funded scholarships that allow eligible K-12 students to use public funds for education expenses while enrolled in registered non-public schools, prioritizing tuition and fees.
  posture: observed
established_facts:
  - The program was enacted in February 2025.
  - The 2025-26 scholarship amount was $7,295.
  - The 2026-27 scholarship amount is $7,530.
  - The statutory maximum was increased to 35,000 scholarships for 2026-27.
  - The 2026 fiscal legislation estimated $150.6 million in General Fund expenditures for FY2026-27 under the enacted expansion.
  - Fiscal analysis warns that beginning in FY2027-28 local education agencies may forgo future TISA funding growth when students transfer from public to private schools, despite prior-year hold-harmless protections.
