summary:
  text: >-
    A statewide network tracing Republican officeholders, legislative leadership, executive appointees, legal officers, congressional delegation members, party organizations, advocacy groups, donors, vendors, and institutional gates that shape Tennessee policy. The node prevents the state government from being represented as a single actor and identifies who controls which levers, who receives gains from the mechanism under study, who absorbs enforced losses, and where accountability feedback is blocked, delayed, captured, or returned.
  posture: working_framework
