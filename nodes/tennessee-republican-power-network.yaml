unresolved_questions:
  - Which officeholders repeatedly vote or act against the dominant caucus when vulnerable constituents would otherwise absorb greater harm?
  - Which donors, advocacy groups, and contractors have the greatest cross-institutional reach?
  - Which committee leaders most often prevent transparency, accountability, labor, disability, public-school, or civil-rights measures from reaching floor votes?
  - Which federal and state actors jointly construct funding routes later described as unavoidable external constraints?
  - Which Republican actors display meaningful counter-patterns of repair, restraint, or protection across multiple domains?
