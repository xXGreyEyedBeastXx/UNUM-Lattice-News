unresolved_questions:
  - Which donors, advocacy groups, contractors, and officeholders have the greatest cross-institutional reach through documented relationships?
  - Which committee leaders most often prevent transparency, accountability, labor, disability, public-school, civil-rights, or other harm-reducing measures from reaching floor votes, and what harms follow?
  - Which federal and state actors jointly construct funding or enforcement routes later described as unavoidable external constraints?
  - Which officials control oversight, audit scope, evidence access, appointments, litigation posture, or remedy after harmful outcomes become visible?
  - Which dissenting or corrective actions materially narrow a specific shared-responsibility claim rather than merely improving an actor's general reputation?
locks:
  - Network membership does not establish shared guilt, intent, command, or equal responsibility.
  - Unrelated beneficial conduct does not belong in this harm-audit node.
  - Beneficiary means gain from the mechanism under study, not moral goodness.
  - Institutional complexity may explain distributed causation but may not launder responsibility.
