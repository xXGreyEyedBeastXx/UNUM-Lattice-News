safeguards:
  - Republican affiliation is not itself evidence of responsibility for a specific act.
  - Responsibility must be traced through seat, gate, lever, action, and consequence.
  - Preserve dissenting votes, blocked bills, recusals, repairs, and counterexamples.
  - Do not collapse elected officials, appointees, donors, vendors, and advocacy groups into one actor.
  - Party coordination, ideological alignment, donor influence, and direct command are distinct relations.
  - Current office status must be date-stamped because the 2026 election cycle is changing the network.
