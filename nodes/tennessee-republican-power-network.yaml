summary:
  text: >-
    A statewide network tracing Republican officeholders, legislative leadership,
    executive appointees, legal officers, congressional delegation members, party
    organizations, advocacy groups, donors, vendors, and institutional gates that
    shape Tennessee policy. The node is designed to prevent the state government
    from being represented as a single actor and to identify who controls which
    levers, who benefits, who absorbs enforced losses, and where accountability
    feedback is blocked or preserved.
  posture: working_framework
