current_evidence:
  observed:
    - Israeli law permits compulsory-service IDF soldiers to be stationed in Israel Police units through at least the end of 2026 under the cited temporary provision.
    - Israel Police states compulsory placement into Border Police is handled through IDF recruitment authorities.
    - Israel Police operates accelerated command tracks specifically recruiting discharged IDF officers and crediting prior military rank/experience.
    - Yamam states most of its fighters are veterans of IDF combat and elite units and that it conducts counterterrorism in cooperation with the IDF and Shin Bet.
    - Israel maintains a large reserve system in which civilians who completed IDF service return to military units during reserve duty.
  stated: []
  adjudicated: []
  alleged: []
  supported_inferences:
    - Formal institutional separation does not justify treating these bodies as personnel-independent or socially isolated.
    - Personnel can carry training, norms, relationships, intelligence practices and operational culture across institutional boundaries even when command authority changes.
    - Cross-institutional investigations involving personnel drawn from the same security ecology require an independence audit rather than automatic classification as external review.
  disputed: []
  ambiguous:
    - The exact proportion of police, IPS, Shin Bet and other security personnel simultaneously liable for or performing IDF reserve duty is not established by the current source set.
    - Operational command remains incident-specific; personnel kinship does not itself prove a shared order in any particular event.
  unknowns:
    - Unit-level dual-seat/reserve-duty map for personnel involved in documented Gaza, West Bank and detention incidents.
    - Appointment, promotion and transfer pathways between IDF, police, IPS, Shin Bet and military/legal investigative bodies.
  missing_or_withheld: []
  counterevidence:
    - The IDF, police, Yamam, Shin Bet and IPS have distinct statutory mandates and command structures; personnel kinship does not erase those distinctions.

