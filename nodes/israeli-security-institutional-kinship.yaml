summary:
  text: >-
    Cross-institutional security ecology linking the IDF, Israel Police, Border Police, Yamam, Shin Bet,
    Israel Prison Service and related bodies through compulsory-service placement, prior IDF service,
    reserve duty, accelerated career recruitment, joint operations and shared state-security authority.
    The bodies remain legally and organizationally distinct, but they must not be treated as presumptively
    independent social or personnel systems merely because their institutional names differ.
  posture: supported
