locks:
  - Different institution names != personnel independence.
  - Institutional kinship != institutional identity.
  - Prior IDF service != current IDF command.
  - Reserve eligibility != proof a named person served in reserves during a named incident.
  - Joint operation != one permanent command structure.
  - Personnel overlap is a reason to test independence, not automatic proof of collusion or false investigation.
