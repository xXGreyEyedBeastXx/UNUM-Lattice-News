summary:
  text: >-
    Pronatalism that preferentially encourages reproduction by a selected population in order to preserve or
    increase that population's demographic dominance. Peer-reviewed 2026 U.S. research distinguishes this from
    general pronatalism and finds Christian nationalism and replacement-theory belief associated with selective
    pronatalism.
  posture: supported inference
