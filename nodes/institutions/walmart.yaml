locks:
  - Decompose the carriers, then recompose the corporate circuit.
  - Benefit recipient != terminal economic beneficiary.
  - Workers receiving Medicaid or SNAP are the legal beneficiaries; do not relabel the benefit itself as a direct payment to Walmart.
  - Public assistance may still create an indirect employer-side economic benefit; do not erase that possibility merely because the legal recipient is the worker.
  - Executive compensation, worker compensation, public assistance, net income, dividends, buybacks, and ownership concentration must remain jointly visible even though they are different accounting categories.
  - A recurring employer-beneficiary association is evidence for labor-cost incidence investigation, not automatic proof of wage theft or illegality.
  - Intentional compensation term-setting != proven intent to cause public-assistance eligibility or deprivation.
  - Lack of harmful-endpoint intent != accidental compensation policy and != absence of accountability for foreseeable or credibly noticed consequences.
  - Capacity to know != actual knowledge; deliberate avoidance requires separate evidence.
  - Do not use uncertainty about motive to erase observed benefit incidence, firm surplus, or ownership return; uncertainty gets jurisdiction only over the motive/knowledge edge it actually bears on.
  - Do not double count Walton Family Holdings Trust shares inside and outside Walton Enterprises' beneficial/voting total.
