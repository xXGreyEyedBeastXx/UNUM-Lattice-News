summary:
  text: >-
    Large U.S. retailer and employer used as a whole-circuit corporate case node. The node traces ordinary-worker compensation, worker-household public-assistance participation, operating surplus, executive compensation, shareholder distributions, concentrated ownership, and the accountability path around intentionally set compensation terms, capacity to know material consequences, notice, correction capacity, persistence, and retained gain. Legally distinct carriers remain separate for attribution but must be recomposed so the aggregate economic picture is not lost.
  posture: observed

current_evidence:
  labor_and_public_assistance:
    observed:
      - GAO's 2026 update identifies Walmart among large employers with thousands of working adult Medicaid enrollees or SNAP recipients in selected states.
      - In Georgia, GAO estimated 4,595 nondisabled, nonelderly working adult Medicaid enrollees worked for Walmart in September 2025, the largest employer count in that table.
      - In Tennessee, GAO estimated 3,513 working adult SNAP recipients worked for Walmart in September 2025, second in the table behind app-based food delivery.
      - Walmart reports an average U.S. hourly wage of about 18 dollars overall for FYE2026, with pay varying by role and market.
    limits:
      - Household eligibility depends on household income, family size, hours, other earners, and program rules as well as one worker's wage.
      - Selected-state GAO counts are not a national Walmart total.
      - Medicaid or SNAP paid to a worker household is not a direct payment to Walmart.
      - Employer-side incidence requires a counterfactual compensation or benefit-cost analysis.

  firm_surplus_and_shareholder_return:
    observed:
      - Walmart reported 706.413 billion dollars in fiscal 2026 net sales.
      - Walmart reported 29.825 billion dollars in fiscal 2026 operating income.
      - Walmart reported 21.893 billion dollars in fiscal 2026 net income attributable to Walmart.
      - Walmart paid 7.507 billion dollars in dividends in fiscal 2026.
      - Walmart spent 8.088 billion dollars purchasing company stock in fiscal 2026.
      - Walmart therefore returned approximately 15.6 billion dollars through dividends and share repurchases in fiscal 2026 and announced a new 30 billion dollar repurchase authorization in February 2026.
    limits:
      - Net income, dividends, buybacks, retained earnings, and equity appreciation are overlapping seats of corporate surplus and must not be added as independent gains.
      - Buybacks are a use of corporate cash and change share count/per-share economics; they are not a cash payment to every continuing shareholder.

  executive_and_worker_compensation:
    observed:
      - Walmart's 2026 proxy reported fiscal 2026 total compensation of 29,240,930 dollars for then-CEO Doug McMillon.
      - The proxy estimated fiscal 2026 total compensation of 30,520 dollars for Walmart's median associate using the SEC pay-ratio methodology.
      - Walmart reported the resulting CEO-to-median-associate compensation ratio as 958 to 1.
    limits:
      - The median-associate figure is proxy total compensation, not the same metric as average hourly wage.
      - Doug McMillon retired as CEO effective January 31, 2026; John Furner became CEO February 1, 2026.
      - A pay ratio is a distributional fact, not by itself proof that executive compensation caused worker program eligibility.

  ownership:
    observed:
      - Walmart's 2026 proxy states that approximately 44 percent of Walmart shares were held by entities related to founder Sam Walton's family as of April 10, 2026.
      - Walton Enterprises reported 44.11 percent beneficial ownership/voting power when the shares held by Walton Family Holdings Trust under irrevocable proxy are included.
      - Walton Family Holdings Trust separately held 513,524,456 shares, 6.44 percent of outstanding shares, with dispositive power; those shares are included within Walton Enterprises' 44.11 percent voting/beneficial figure and are not additive.
    limits:
      - April 10, 2026 ownership does not prove identical ownership on each fiscal 2026 dividend record date.
      - Ownership creates an economic seat for dividends and equity-value changes but does not establish authorship of every corporate policy.

accountability_trace:
  intentional_action_or_term_setting:
    posture: supported_inference
    finding: >-
      Walmart's wage and benefit structure is an employer-controlled compensation system rather than an accidental market event. The current source bundle establishes Walmart's reported compensation levels and benefit programs but does not yet reconstruct every internal decision-maker, wage algorithm, market constraint, or historical wage-setting decision.
  intended_gain_cost_reduction_or_capacity_increase:
    posture: path_forward
    finding: >-
      Labor cost is part of the corporate cost structure and compensation choices affect operating surplus, but the current record does not yet quantify the portion of fiscal 2026 profit or shareholder return attributable to compensation levels associated with public-assistance incidence.
  harmful_endpoint_intent:
    posture: not_established
    finding: >-
      The current evidence does not establish that Walmart intended workers to experience poverty, food insecurity, healthcare insecurity, or eligibility for Medicaid or SNAP.
  knowledge_state:
    posture: path_forward
    current_state: KNOWLEDGE_UNKNOWN
    finding: >-
      The 2026 GAO report is a public notice surface showing Walmart prominently in selected-state employer tables. Public availability alone does not prove which Walmart decision-makers received or reviewed the report. Historical notice predating 2026 has not yet been reconstructed in this node.
  capacity_to_know:
    posture: supported_inference
    finding: >-
      Walmart's scale, payroll/benefits administration, public filings, compensation reporting, and ability to manage wage and benefit programs support treating the corporation as having substantial practical capacity to study compensation, workforce composition, benefit design, and related public-policy consequences. Capacity to know is not actual knowledge.
  capacity_to_correct:
    posture: supported_inference
    finding: >-
      Walmart has demonstrated practical capacity to change wages, benefits, staffing policy, and capital allocation. This does not establish that any particular proposed compensation change would eliminate program eligibility or be costless, but it makes correction capacity a live accountability variable rather than an assumed null.
  response_after_notice:
    posture: path_forward
    finding: >-
      Build a historical notice-and-response chronology before assigning continued-after-notice, mitigation, escalation, refusal-to-correct, or deliberate-avoidance states.
  gain_or_insulation_after_notice:
    posture: path_forward
    finding: >-
      Once notice chronology is established, compare worker compensation and benefit changes against profit, dividends, repurchases, executive compensation, and ownership return over the same periods.

whole_circuit_questions:
  - What share of worker-household public support is attributable to compensation structure versus household circumstances unrelated to Walmart?
  - What share of SNAP benefits used by Walmart-employed households is redeemed at Walmart stores?
  - What Medicaid or other public healthcare spending connected to Walmart-employed households returns to Walmart pharmacies or health businesses versus unrelated providers?
  - How much of fiscal 2026 shareholder distributions accrued to concentrated family, institutional, executive, employee, and dispersed ownership seats on the relevant record dates?
  - How do ordinary-worker compensation, public supplementation, executive compensation, firm surplus, and shareholder return change together over time?
  - When did Walmart leadership or compensation decision-makers first receive credible notice that substantial numbers of working Walmart households relied on Medicaid, SNAP, or comparable public support?
  - What wage, scheduling, benefit, staffing, or public-policy changes followed each major notice event?
  - How do employer payroll-tax effects, worker tax-base effects, corporate income-tax effects, tax preferences/credits, and public-assistance costs change under plausible compensation counterfactuals without double counting?

