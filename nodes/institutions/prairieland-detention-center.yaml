summary:
  text: >-
    ICE immigration-detention facility in Alvarado, Texas, operated by LaSalle Corrections. The
    recoverable record includes repeated sexual-assault/misconduct allegations in ICE's own 2017-2018
    intake/investigation dataset, including at least two explicit staff-on-detainee allegations; a 2018
    detainee death in which relevant surveillance evidence was not fully retained; repeated PREA and
    detention-oversight review; and documented 2025 overcrowding plus medical/access complaints before
    the July 4 2025 protest and later violence. The facility should be analyzed as a custody, contractor,
    complaint-intake, evidence-preservation, protest, and prosecution junction rather than only as the
    location of the July 2025 shooting.
  posture: supported

