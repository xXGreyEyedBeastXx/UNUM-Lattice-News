locks:
  - Facility history explains context; it does not excuse violence.
  - Violence by a participant does not erase facility abuse evidence.
  - Group or ideology label does not replace individualized conduct and knowledge.
  - Government-recorded allegation is evidence of the allegation, not proof of the alleged act.
  - Closed is not a disposition unless the underlying file establishes what closure meant.
  - Missing evidence must be typed as missing/lost/withheld rather than silently converted into either proof or exoneration.
  - Preserve LaSalle, ICE, DHS oversight bodies, individual guards, detainees, protesters, defendants, and Trump administration policy as distinct actors/seats.
