current_evidence:
  observed:
    - >-
      ICE's FOIA dataset 2018-ICFO-45499 contains multiple Prairieland-linked sexual-assault or
      sexual-misconduct records from 2017-2018.
    - >-
      Index 365 records a June 2017 staff-on-detainee sexual-assault allegation against an unnamed
      contract officer and codes it 0612 Staff on Detainee / Criminal / Investigation IG / Closed.
    - >-
      Index 95 records a December 2017 allegation that a male LaSalle detention officer / contract guard
      groped a detainee during a pat-down; the row's Primary FD identifies Staff on Detainee.
    - >-
      Index 95 also contains a structured-data contradiction: its Topic field says another detainee while
      its Case Summary, Synopsis, and Primary FD identify a LaSalle contract guard.
    - >-
      ICE indexes PREA audits for Prairieland in 2018, 2021, and 2023.
    - >-
      Gourgen Mirimanian died in ICE custody at Prairieland on April 10 2018 while the facility was
      operated by LaSalle Corrections. A records-based oversight review reports that some relevant video
      was of limited value and another video was not retained, impairing review preparation.
    - >-
      April 2025 reporting documented women sleeping on thin mats on concrete because the female holding
      unit was full during a period of expanding ICE detention.
    - >-
      A July 4 2025 daytime protest and later nighttime event occurred at the facility; the nighttime event
      escalated through fireworks, vandalism, and Benjamin Song's gunfire at responding officers.
    - >-
      A March 2026 jury convicted Song alone on the attempted-murder/firearm counts summarized by DOJ,
      while multiple other defendants were convicted on riot, material-support, and fireworks/explosives counts.

  stated:
    - >-
      Former detainee América Platt told The Washington Post she was denied antibiotics for an ear
      infection and denied telephone access while held at Prairieland in 2025.
    - >-
      DOJ states that some defendants attended a peaceful daytime protest before returning for the
      later nighttime event, and that a cooperating witness testified Song had proposed freeing detainees
      and bringing rifles at a pre-event gear check.

  adjudicated:
    - >-
      Benjamin Song was convicted in March 2026 of attempted murder of the Alvarado police officer and
      associated firearm counts, in addition to common riot/material-support/fireworks counts.
    - >-
      Other trial defendants were convicted of common riot/material-support/fireworks-related counts but
      were not convicted on Song's attempted-murder/firearm counts as summarized by DOJ.

  alleged:
    - >-
      June 2017: a detainee alleged sexual assault by an unnamed contract officer at Prairieland.
    - >-
      December 2017: a detainee alleged a male LaSalle detention officer / contract guard groped him
      during a pat-down.
    - >-
      Multiple 2017-2018 records allege detainee-on-detainee sexual assault, abuse, harassment, or
      inappropriate touching at Prairieland.
    - >-
      April 2025: a former detainee alleged denial of prescribed antibiotics and phone access.

  supported_inferences:
    - >-
      Prairieland has a recoverable pre-2025 humanitarian and sexual-safety history that makes the July 2025
      protest grievance independently legible; the later shooting does not erase that antecedent.
    - >-
      Demonstrated evidence-preservation failures at Prairieland and across ICE custody justify treating
      evidence custody and investigative completeness as variables when weighing non-substantiation or missing evidence.
    - >-
      Structured database fields can underdescribe or misclassify allegations; narrative-level extraction is
      necessary before aggregate counts are treated as reliable.
    - >-
      The 2025 detention-expansion environment plausibly increased capacity pressure at Prairieland, but
      facility-specific conditions require their own causal trace rather than automatic attribution to one policy actor.

  disputed:
    - >-
      The degree to which defendants in the July 2025 case constituted one pre-existing formal organization,
      versus overlapping activist, firearms, social, and trusted planning networks, remains contested outside
      the criminal verdicts on specific counts.
    - >-
      Whether every participant shared Song's proposed or eventual use of armed force remains a defendant-specific
      question requiring transcripts, jury instructions, chats, and verdict/sentencing records.

  ambiguous:
    - >-
      The administrative meaning of Closed in ICE FOIA 2018-ICFO-45499 does not reveal whether a sexual-abuse
      allegation was substantiated, unsubstantiated, unfounded, referred, declined, or disciplined.
    - >-
      DOJ's later North Texas Antifa Cell classifier is a documented prosecutorial label; whether it maps onto
      one formal organizational entity independently of the prosecution theory is not established by the current source bundle.

  unknowns:
    - Number and disposition of all staff-on-detainee sexual-abuse allegations at Prairieland beyond current extraction.
    - Whether any Prairieland allegation specifically alleged rape rather than other forms of sexual assault or abuse.
    - Identity and employment/discipline outcome of the unnamed contract officer in the June 2017 case.
    - Identity and disposition of the LaSalle guard allegation in December 2017.
    - Full findings and corrective actions from the 2018, 2021, and 2023 PREA audits.
    - Full DHS CRCL/OIG Prairieland complaint record.
    - Defendant-by-defendant knowledge and agreement in the July 2025 event beyond what verdicts and public summaries establish.
    - Whether later anti-Antifa executive policy materially influenced charging, classifier choice, trial framing, or sentencing.

  missing_or_withheld:
    - Full PREA investigative files and disposition records behind the FOIA spreadsheet entries are not present in the spreadsheet.
    - Some personal and investigative fields are FOIA-redacted.
    - Relevant surveillance video in the Mirimanian death was not fully retained according to the records-based oversight review.
    - AIC/BAJI records litigation indicates parts of the broader complaint/conditions record have required litigation to obtain.
    - Full trial transcript, complete jury instructions, presentence reports where nonpublic, and complete sentencing record are not contained in the current source bundle.

  counterevidence:
    - An allegation recorded by ICE is not proof the alleged abuse occurred.
    - The current source bundle does not establish a systematic rape program at Prairieland.
    - DOJ obtained convictions on serious non-attempted-murder offenses against multiple July 2025 defendants; acquittal on Song's attempted-murder theory does not erase those convictions.
    - Humanitarian grievance does not justify gunfire, assault, vandalism, or other criminal conduct.

