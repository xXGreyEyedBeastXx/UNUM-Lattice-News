summary:
  text: >-
    Federal environmental regulator whose rules, enforcement choices, exemptions, delays, rollbacks, funding, and cleanup decisions materially affect pollution exposure and environmental-health risk. In the harm-audit lane, trace which regulatory changes increase or preserve exposure, which populations absorb the burden, which industries or actors gain, and where accountability or repair is blocked.
  posture: observed_with_legacy_source_gaps
aliases: [EPA]
hashtags: [EnvironmentalRegulation, Pollution, Neurodevelopment, PublicHealth]
current_evidence:
  observed:
    - The legacy node records EPA recognition of lead, mercury, pesticides, PCBs, flame retardants, air pollution, and other environmental exposures as relevant to neurodevelopmental harm.
    - The legacy node records multiple deregulatory actions affecting greenhouse-gas, mercury, hazardous-air-pollutant, and PFAS protections during the period studied.
  stated:
    - The legacy node records EPA claims that deregulation protects health while lowering costs and advancing energy production.
  supported_inferences:
    - EPA policy choices are materially relevant when federal health authorities argue that environmental exposures may contribute to autism or other neurodevelopmental outcomes.
  disputed:
    - The exposure and health consequences attributable to specific regulatory changes.
  unknowns:
    - Net exposure effects, geographic distribution, latency, cumulative burden, and which developmental neurotoxicants are most affected by each policy change.
  claim_specific_counterevidence:
    - Retained or strengthened protections matter only when they narrow a specific claim about the scope, timing, mechanism, or magnitude of deregulation; they are not general reputation credit.
