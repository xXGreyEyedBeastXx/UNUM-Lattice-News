harm_audit_questions:
  - Which rollbacks, exemptions, delays, non-enforcement decisions, or weakened standards increase exposure to known or suspected developmental toxicants?
  - Which industries or asset holders receive reduced compliance cost, increased production capacity, or other gains from each change?
  - Which communities absorb increased risk by geography, class, race, age, disability, occupation, or existing exposure burden?
  - What harms are delayed or difficult to reverse, and what evidence/monitoring systems could reveal them?
  - Where does EPA itself control data, enforcement, waivers, compliance timing, or the evidence used to evaluate its own policies?
locks:
  - Regulatory authority does not prove causation for any individual diagnosis.
  - Environmental contribution must not be converted into blame toward autistic people or families.
  - Retained protections are recorded only when they materially narrow a specific harm claim; they do not offset unrelated deregulation harm.
  - Missing source records must be recovered before inherited regulatory assertions are promoted beyond their legacy posture.
