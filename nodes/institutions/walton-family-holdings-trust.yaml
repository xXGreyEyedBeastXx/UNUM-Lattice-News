summary:
  text: >-
    Walton-family-related trust holding a substantial Walmart equity position. The node preserves
    the economic/dispositive ownership seat separately from Walton Enterprises' voting authority.
  posture: observed
current_evidence:
  observed:
    - Walmart's 2026 proxy reported 513,524,456 Walmart shares held by the trust as of April 10, 2026, representing 6.44 percent of outstanding shares.
    - Voting power over those shares was exercised by Walton Enterprises under an irrevocable proxy, while dispositive power remained with the trust's trustees.
