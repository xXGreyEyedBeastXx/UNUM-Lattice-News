locks:
  - Agency record != automatic truth.
  - Agency record != automatic falsehood.
  - Custody authority, contractor, investigator, and oversight seats must remain distinguishable even when housed in one institutional ecology.
  - Missing or internally controlled evidence must be typed by custody and preservation state rather than silently treated as neutral absence.
