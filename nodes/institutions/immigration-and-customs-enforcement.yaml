  - oversight
  - evidence-custody
  - private-contractors

authority:
  has_authority: true
  seat: federal immigration enforcement and detention
  jurisdiction: United States
  level: federal
  oversight:
    - Department of Homeland Security
    - DHS Office of Inspector General
    - DHS Office for Civil Rights and Civil Liberties
    - federal courts
    - Congress
    - PREA and detention-standard review systems

current_evidence:
  observed:
    - ICE FOIA 2018-ICFO-45499 preserves JIC/OPR records of sexual-abuse and misconduct allegations in Texas detention facilities, including Prairieland.
    - ICE publicly indexes PREA and detention-oversight reviews for Prairieland.
    - Records-based oversight reporting documents ICE detention-death investigation failures involving evidence preservation, witness access, and omitted facts across the detention system.
    - Prairieland-specific records-based reporting documents surveillance-evidence non-retention in the 2018 death of Gourgen Mirimanian.
  stated: []
  adjudicated: []
  alleged: []
  supported_inferences:
    - >-
      ICE can occupy multiple seats in one accountability chain: custody authority, contractor, complaint recipient,
      investigator/oversight participant, and records custodian. Those overlapping roles create a potential epistemic
      chokepoint that must be tested case by case rather than assumed benign or corrupt.
  disputed: []
  ambiguous:
    - The degree of institutional independence among ICE custody, investigation, inspection, and records functions varies by component and case.
  unknowns:
    - How frequently ICE structured metadata misclassifies alleged actor/facility categories relative to narrative case fields.
    - How often complaint outcomes are externally verified rather than determined inside the custody/contracting ecology.
  missing_or_withheld:
    - Many underlying complaint, PREA, disciplinary, and death-review records require FOIA or litigation to obtain.
  counterevidence:
    - Internal-agency evidence can be accurate and probative; overlapping institutional roles do not by themselves establish concealment or bad faith.

