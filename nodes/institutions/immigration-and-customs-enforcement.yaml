unresolved_questions:
  - Which ICE component controlled each Prairieland complaint, video, medical record, inspection, and disposition decision?
  - What independence barriers exist between detention operations and misconduct/death investigations?
  - What retention schedules applied to surveillance and sexual-abuse investigation records at Prairieland?
  - Which Prairieland findings led to penalties, contract changes, discipline, prosecution, or no action?

