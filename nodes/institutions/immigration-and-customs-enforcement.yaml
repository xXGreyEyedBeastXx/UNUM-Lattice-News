summary:
  text: >-
    Federal agency within DHS that operates and contracts for civil immigration detention and participates
    in the complaint, investigation, inspection, records, and evidence systems used to evaluate detention
    conditions and misconduct. In the Prairieland investigation, ICE is not only the custody authority but
    also a central routing and evidence institution: its JIC/OPR data records sexual-abuse allegations, its
    oversight components inspect facilities, and its records/preservation practices affect what can later be
    established about deaths and abuse.
  posture: documented

