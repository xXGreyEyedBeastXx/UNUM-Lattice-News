summary:
  text: >-
    Private detention operator identified in records-based oversight reporting as the operator of Prairieland
    Detention Center. In the Prairieland evidence lattice, LaSalle is a high-centrality contractor node because
    facility operation joins custody conditions, staffing, alleged staff conduct, surveillance/evidence retention,
    and public detention revenue. A December 2017 ICE record specifically identifies a male LaSalle detention
    officer / contract guard in a staff-on-detainee groping allegation; the allegation's disposition remains unknown
    from the extracted FOIA spreadsheet.
  posture: documented_operator_relation_with_alleged_staff_conduct

