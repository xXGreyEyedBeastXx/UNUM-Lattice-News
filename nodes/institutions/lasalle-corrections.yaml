current_evidence:
  observed:
    - Records-based oversight reporting identifies LaSalle Corrections as Prairieland's private operator in 2018.
    - ICE FOIA index 95 identifies a male LaSalle detention officer / contract guard as the alleged actor in a December 2017 groping complaint at Prairieland.
    - The same row contains a conflicting Topic field that incorrectly points toward another detainee while its Case Summary, Synopsis, and Primary FD identify staff-on-detainee conduct.
  stated: []
  adjudicated: []
  alleged:
    - December 2017 Prairieland detainee alleged a male LaSalle detention officer / contract guard groped him during a pat-down.
  supported_inferences:
    - >-
      Where a private operator controls daily custody, employs or manages staff, and maintains operational systems such as
      surveillance, its contractual duties and evidence-retention practices become part of the abuse-accountability chain.
  disputed: []
  ambiguous:
    - The June 2017 unnamed contract officer's employer is not established by the extracted row and should not be silently assigned to LaSalle.
  unknowns:
    - Personnel identity, employment status, discipline, referral, and disposition for the December 2017 allegation.
    - Contractual evidence-retention and reporting duties in force during the Mirimanian death and the sexual-abuse allegations.
    - Prairieland-specific revenue, penalties, corrective actions, staffing levels, medical subcontractors, insurance, and indemnification over time.
  missing_or_withheld:
    - Underlying personnel and disciplinary files are not present in the current source bundle.
    - Complete Prairieland contract/modification history has not yet been compiled into this node.
  counterevidence:
    - Operator status and allegations against employees do not establish company-wide intent or liability for every alleged incident.

