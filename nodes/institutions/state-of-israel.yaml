locks:
  - Judaism != Zionism != State of Israel.
  - State of Israel != every Israeli citizen or Jew.
  - State policy != personal intent of every state employee.
  - State responsibility can exist without collapsing settlers, soldiers, ministers and agencies into one actor.
  - Security justification != observed conduct or legality.
  - State denial != debunking.
  - External fact finding != final criminal conviction.
  - Advisory opinion != criminal conviction.
