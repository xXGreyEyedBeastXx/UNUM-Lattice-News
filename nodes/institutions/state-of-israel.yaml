current_evidence:
  observed:
    - Israeli state institutions fund, authorize, administer and protect settlement infrastructure in the occupied West Bank.
    - Israeli officials continue to describe military and territorial measures using security, counterterrorism and self-defence rationales.
  stated:
    - Israel states that its Gaza military operations are directed against Hamas, Islamic Jihad and other armed groups and that it does not intentionally target civilians.
    - Israel rejects the UN Commission's findings of systematic sexual and gender-based violence and disputes the Commission's methodology and impartiality.
  adjudicated: []
  alleged: []
  supported_inferences:
    - Official security language must be tested against policy, observed conduct, effects, external findings and territorial persistence rather than accepted as the Lattice's own classification.
  disputed:
    - Israel disputes multiple UN Commission findings concerning collective punishment, deliberate civilian targeting, systematic sexual violence and genocide.
  ambiguous: []
  unknowns:
    - The complete current command, policy and accountability chain for every documented incident remains event- and unit-specific.
  missing_or_withheld: []
  counterevidence:
    - Israeli institutions publish civilian-harm mitigation rules, legal positions and internal-investigation claims; those records are preserved as counterposition and policy evidence and must be compared against practice and independent findings.

evidence_extensions:
  legal_advisory_findings:
    - date: 2024-07-19
      body: International Court of Justice
      finding: >-
        Israel's continued presence in the Occupied Palestinian Territory is unlawful; Israel must end it as rapidly
        as possible, immediately cease new settlement activity and evacuate settlers from the territory.
      posture: LEGAL_ADVISORY_FINDING
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
  external_fact_findings:
    - date: 2024-06
      body: UN Independent International Commission of Inquiry
      finding: >-
        The Gaza total siege and withholding of life-sustaining necessities constituted collective punishment; the
        Commission also found starvation as a method of war, forcible transfer, intentionally directing attacks
        against civilians/civilian objects and other serious violations within its scope.
      posture: COLLECTIVE_PUNISHMENT_FINDING
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
    - date: 2026-06
      body: UN Independent International Commission of Inquiry
      finding: >-
        The State of Israel is primarily responsible for actions of Israeli settlers in the West Bank, with violent
        settler activity functioning as a means of implementing State policy toward settlement entrenchment,
        annexation and Palestinian displacement.
      posture: EXTERNAL_FACT_FINDING
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
  territorial_effects:
    - scope: occupied West Bank
      effect: settlement expansion, land-control changes, Palestinian displacement and reduced territorial continuity
      posture: DOCUMENTED_EFFECT
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
    - scope: southern Lebanon
      effect: Israeli military presence in a declared security/buffer-zone framework with withdrawal tied to Hezbollah disarmament
      posture: CROSS_THEATER_ANALOGUE
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
    - scope: southern Syria / 1974 disengagement area and adjacent seized territory
      effect: Israeli military presence after the 2024 fall of Assad remains a subject of withdrawal/security negotiations
      posture: CROSS_THEATER_ANALOGUE
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026

timeline:
  - date: 2023-10-09
    event: Defense Minister Yoav Gallant announced a complete siege on Gaza cutting electricity, food, water and fuel.
    posture: stated
  - date: 2024-07-19
    event: ICJ issued advisory opinion finding Israel's continued presence in the Occupied Palestinian Territory unlawful and requiring an end to new settlement activity and evacuation of settlers.
    posture: LEGAL_ADVISORY_FINDING
  - date: 2026-07-24
    event: Netanyahu and Defense Minister Katz announced measures including checkpoints/traffic separation and acceleration of farm-outpost legalization and establishment after West Bank attacks.
    posture: FORMAL_POLICY
