summary:
  text: >-
    Sovereign state and primary public-authority seat for Israeli government policy. This node is distinct from
    Judaism, Jewish people, Zionism as an ideology/movement, Israeli civilians, any particular government,
    individual officials, the Israeli Security Forces, and settlers. Current Lattice investigation records
    international findings concerning Israel's unlawful continued presence and settlement activity in the
    Occupied Palestinian Territory, Commission findings of collective punishment and other serious violations
    in Gaza, and Commission findings assigning the State primary responsibility for settler actions in the West
    Bank within the cited scope. Israel disputes major UN findings and states that its military operations are
    directed at armed groups rather than civilians.
  posture: supported_inference
