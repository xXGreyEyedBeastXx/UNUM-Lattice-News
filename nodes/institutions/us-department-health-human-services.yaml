summary:
  text: >-
    U.S. federal health-policy institution whose recovered autism agenda includes etiology research, prevention, treatment, care, data integration, and public-health messaging. In the harm-audit lane, examine causal framing, research-direction pressure, data governance, privacy, pathologizing assumptions, resource allocation, and effects on autistic people and public health.
  posture: observed_with_legacy_source_gaps
aliases: [HHS, Department of Health and Human Services]
hashtags: [HHS, AutismPolicy, AutismResearch, PublicHealth]
current_evidence:
  observed:
    - The legacy node records autism research and policy as a departmental priority.
    - The legacy node records work on etiology, treatment/care, prevention-oriented research, data initiatives, and coordinating structures.
  stated:
    - Recovered institutional framing emphasizes gold-standard science, root-cause research, prevention, treatment, care, and support for families.
  supported_inferences:
    - Prevention-oriented framing may pathologize autism, narrow research priorities, or create pressure toward predetermined causal narratives depending on actual implementation.
  disputed:
    - Whether epidemic framing and broad causal assumptions accurately represent autism prevalence and causation science.
  unknowns:
    - Data governance, privacy protections, grant priorities, study design, and degree of autistic-led participation.
  claim_specific_counterevidence:
    - Identified prevalence does not by itself establish rising biological incidence or a single general causal exposure.
    - The recovered Reuters source does not support vaccine-autism causation and treats the administration's interest as policy activity rather than causal evidence.
