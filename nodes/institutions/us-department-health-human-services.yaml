harm_audit_questions:
  - Who controls research priorities, grant awards, datasets, endpoints, preregistration, and release of negative findings?
  - What privacy and consent constraints govern linked Medicare, Medicaid, electronic-record, wearable, or other health data?
  - Does prevention rhetoric target environmental injury in bounded subgroups or collapse autism itself into a preventable harm category?
  - What research/service resources are displaced by preferred causal agendas?
  - What decision power do autistic people and autistic researchers hold over scope, interpretation, privacy, and downstream policy?
locks:
  - Institutional stated goals are not demonstrated results or moral credit.
  - Care or research activity elsewhere does not offset a harmful causal frame, privacy failure, discriminatory policy, or unsupported public-health claim.
  - Missing source records must be relinked before inherited factual assertions are promoted beyond their legacy posture.
