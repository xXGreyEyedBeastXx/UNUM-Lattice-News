locks:
  - Walton Enterprises' 44.11 percent beneficial-ownership figure includes voting power over Walton Family Holdings Trust shares and must not be added again to the trust's 6.44 percent dispositive interest.
  - Ownership establishes a seat for distributions and voting power, not authorship of every Walmart policy.
