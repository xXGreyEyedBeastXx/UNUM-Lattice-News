summary:
  text: >-
    Walton-family-related ownership entity and major Walmart shareholder. The node exists to
    preserve the terminal ownership seat for Walmart dividends, voting power, buybacks, and
    equity-value changes without collapsing family identity into corporate or moral culpability.
  posture: observed
current_evidence:
  observed:
    - Walmart's 2026 proxy reported Walton Enterprises with 3,002,673,393 Walmart shares held directly as of April 10, 2026.
    - The same proxy reported 3,516,197,849 shares, or 44.11 percent of the class, as beneficially owned when voting power over shares held by Walton Family Holdings Trust is included.
  unknowns:
    - Record-date ownership for each fiscal 2026 dividend payment.
    - Shares sold into or retained through each Walmart repurchase period.
