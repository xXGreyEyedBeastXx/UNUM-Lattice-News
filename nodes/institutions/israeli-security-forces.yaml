locks:
  - Israeli Security Forces != every Israeli soldier, police officer, prison employee or citizen.
  - Finding against an institutional pattern != guilt of every member.
  - Soldier testimony != army-wide policy without corroboration.
  - Written civilian-protection rule != proof of compliance.
  - Hamas target present != civilians not targeted.
  - Civilian casualty != deliberate targeting by itself.
  - Deliberate-targeting finding != claim that every civilian casualty was intended.
  - Verified rape cases and systematic-pattern findings must not be downgraded to rumor because the institution denies them.
