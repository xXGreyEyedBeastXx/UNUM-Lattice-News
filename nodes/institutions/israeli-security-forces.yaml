current_evidence:
  observed:
    - Israeli forces conduct military operations, detention, checkpoint, buffer/control-zone and security activity across Gaza and the occupied West Bank.
    - Individual Israeli soldiers have publicly described orders or practices involving shooting persons entering designated no-go or buffer areas and unnecessary destruction of civilian property.
  stated:
    - IDF states it does not intentionally target civilians and that its directives prohibit deliberate attacks on civilians.
    - IDF states its operations are directed at Hamas, Islamic Jihad and other armed groups and that it uses civilian-harm mitigation procedures.
  adjudicated: []
  alleged: []
  supported_inferences:
    - Soldier testimony becomes stronger mechanism evidence when it converges with independent findings, repeated incidents, official orders or other corroborating records.
  disputed:
    - Israel rejects UN findings characterizing sexual and gender-based violence as systematic or as an operating procedure.
  ambiguous:
    - The degree to which local shoot orders and permissive rules described by soldiers were formalized at brigade, division, theater or national-command level varies by incident and remains trace-specific.
  unknowns:
    - Full unit-by-unit accountability chain for deliberate child targeting findings has not yet been entered into the Lattice.
    - Full disciplinary/criminal disposition map for verified sexual-violence cases remains incomplete.
  missing_or_withheld: []
  counterevidence:
    - IDF publishes rules and statements requiring civilian-harm mitigation and prohibiting deliberate attacks on civilians; these are retained as policy/counterposition evidence rather than treated as dispositive of practice.

evidence_extensions:
  operating_procedure_findings:
    - date: 2025-03
      body: UN Independent International Commission of Inquiry
      finding: >-
        Forced public stripping/nudity, sexual harassment including rape threats and sexual assault were found to
        form de facto parts of ISF standard operating procedures toward Palestinians; sexualized torture including
        rape and genital violence was found committed under explicit orders or implicit encouragement by top civilian
        and military leadership.
      posture: OPERATING_PROCEDURE
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
  verified_sexual_violence:
    - date: 2026-04
      body: UN Secretary-General / SRSG-SVC
      finding: >-
        UN verification included rape with objects, gang rape, attempted rape, genital violence, targeted shooting of
        genitals, forced nudity and rape threats against Palestinian detainees and others; perpetrators in verified
        cases included IDF, IPS units and Yamam.
      posture: EXTERNAL_FACT_FINDING
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
  deliberate_targeting_findings:
    - date: 2024-06
      body: UN Independent International Commission of Inquiry
      finding: >-
        Commission found intentionally directing attacks against civilians and civilian objects and found that the
        total siege constituted collective punishment within the examined period.
      posture: DELIBERATE_TARGETING_FINDING
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
    - date: 2026-06
      body: UN Independent International Commission of Inquiry
      finding: >-
        Commission found deliberate targeting and killing of Palestinian children, including documented direct
        shooting of vital organs with precision weapons such as quadcopters and snipers.
      posture: DELIBERATE_TARGETING_FINDING
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
  local_order_testimony:
    - source_actor: Israeli soldiers interviewed by Associated Press and Sky News
      finding: >-
        Multiple soldiers described local instructions or practices in which unauthorized persons crossing designated
        control/no-go lines could be shot regardless of an individually identified threat; some described arbitrary
        killing and unnecessary destruction.
      posture: LOCAL_ORDER
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
      limitation: Local testimony does not by itself establish an army-wide written policy.

