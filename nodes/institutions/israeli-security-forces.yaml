summary:
  text: >-
    Umbrella investigative node for Israeli military, prison, police and related security bodies when an external
    source uses a collective security-force category. It does not erase distinctions among the IDF, Israel Prison
    Service, police, Yamam, units, commanders, facilities or individual personnel. Current evidence includes UN
    findings of collective punishment and intentionally directed civilian attacks in Gaza within the Commission's
    scope; systematic sexual and gender-based violence including verified rape and gang rape in detention; and a
    2026 Commission finding of deliberate targeting of Palestinian children, including documented precision-fire
    cases. Israel and the IDF deny intentionally targeting civilians and reject the Commission's systemic SGBV findings.
  posture: supported_inference
