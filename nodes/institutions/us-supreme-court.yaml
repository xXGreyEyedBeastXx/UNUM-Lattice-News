harm_audit_questions:
  - Which selection and confirmation networks shaped each appointment?
  - Which gifts, travel, property, family-income, donor-access, or advocacy relations created disclosure or recusal questions?
  - Which connected actors had interests before the Court, directly or through organizations, and what recusal decisions followed?
  - Which decisions expanded executive, police, corporate, religious, electoral, or other concentrated power while reducing appeal, regulation, labor, voting, bodily-autonomy, or civil-rights constraints?
  - Which ethics, disclosure, oversight, or complaint mechanisms are controlled by the Court itself, and where can independent accountability enter?
locks:
  - Ideological alignment, friendship, travel, reimbursement, gift, or donor access does not alone prove a corrupt ruling.
  - Lack of direct quid pro quo evidence does not erase documented financial, access, disclosure, recusal, or selection-network relations.
  - Life tenure and institutional opacity increase the need for evidence-based conflict and recusal review; they do not establish guilt by themselves.
  - Do not add unrelated respected decisions or institutional achievements as offsets against a documented conflict or harmful ruling.
