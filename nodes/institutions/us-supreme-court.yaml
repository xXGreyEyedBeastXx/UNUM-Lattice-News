summary:
  text: >-
    The highest federal court and a major judicial gate over constitutional and federal questions. In the harm-audit lane, review focuses on judicial power, life tenure, selection networks, donor and access relationships, disclosure, recusal, ethics enforcement, and decisions that remove or preserve constraints on concentrated power.
  posture: observed
aliases: [SCOTUS, Supreme Court of the United States]
hashtags: [SCOTUS, JudicialPower, Ethics, FederalistSociety, SeparationOfPowers]
current_evidence:
  observed:
    - The Court is composed of nine life-tenured justices.
    - Five current justices have disclosed Federalist Society connections through travel, reimbursements, appearances, or other relationships in the recovered source bundle.
    - The Court adopted a formal ethics code in 2023; the recovered research describes no independent enforcement mechanism.
  supported_inferences:
    - Selection networks, donor access, life tenure, recusal discretion, and weak external enforcement materially affect accountability risk.
  disputed:
    - Whether ideological, donor, travel, gift, or access relationships improperly influence particular decisions.
  unknowns:
    - The full extent of undisclosed relationships and the causal effect of those relationships on specific case outcomes.
