    notes:
      - BIS_Office_of_Antiboycott_Compliance_administers_rules_that_discourage_and_in_some_cases_prohibit_US_persons_from_supporting_unsanctioned_foreign_boycotts.
      - Arab_League_boycott_of_Israel_is_identified_by_BIS_as_principal_current_unsanctioned_foreign_boycott.
      - reporting_and_civil_or_criminal_penalties_can_apply.
constitutional_baseline:
  - Claiborne_Hardware_protects_speech_nonviolent_picketing_solicitation_and_association_used_to_organize_a_political_boycott.
  - Arkansas_Times_creates_a_current_circuit_level_distinction_between_protected_advocacy_and_the_covered_commercial_refusal_itself.
  - precise_boundary_remains_context_and_jurisdiction_sensitive.
selective_permission_test:
  question: >-
    If the same economic tactic is used against a different target, does government still describe it
    as discrimination or unacceptable coercion, or does it describe the tactic as legitimate market
    choice, sanctions, divestment, national security, procurement policy, or industrial protection?
  comparison_targets:
    - Israel_and_Israeli_controlled_territories
    - fossil_fuel_companies
    - firearms_industry
    - foreign_government_imposed_boycotts
    - labor_boycotts_and_strikes
    - civil_rights_boycotts
    - sanctions_and_state_directed_divestment
locks:
  - boycott_ban_is_often_a_public_money_condition_not_a_general_criminal_prohibition.
  - anti_discrimination_rationales_must_be_tested_against_actual_target_definition_and_conduct.
  - criticism_of_Israel_Israelis_or_Zionism_must_not_be_collapsed_into_antisemitism_without_evidence_of_anti_Jewish_conduct_or_targeting.
  - boycott_of_a_state_or_company_is_not_identical_to_boycott_of_people_based_on_ethnicity_religion_or_national_origin.
  - constitutional_status_must_be_recorded_case_by_case_and_current_appeal_posture_preserved.
