schema: unum-lattice-news/node/v0.1
id: boycott-bans-and-selective-economic-redress
title: Boycott bans and selective economic redress
family: analysis_framework
subtype: nonviolent_redress_and_public_contracting_operator
landing_status: landed
lifecycle_status: active
updated: 2026-08-16
summary:
  text: >-
    Investigative operator for laws, contract clauses, investment restrictions, grant conditions,
    tax penalties, and other state actions that punish, discourage, or condition access to public
    money on a person's or company's refusal to buy from, sell to, invest in, or otherwise deal with
    a targeted country, industry, company, or class. Boycott activity must be separated into political
    advocacy, association, picketing, coordinated consumer choice, commercial refusals to deal,
    discriminatory conduct, and foreign-government boycott compliance because constitutional and
    statutory treatment differs across those seats.
  posture: working_framework
core_invariant:
  - boycott_is_a_nonviolent_redress_tool_but_not_every_boycott_act_has_identical_legal_status
  - government_is_not_neutral_when_it_conditions_public_money_on_participation_or_nonparticipation_in_a_boycott
  - loss_of_public_contract_or_investment_access_is_a_material_penalty_even_when_no_criminal_ban_exists
  - actor_country_and_industry_identity_must_not_substitute_for_mechanism_analysis
  - government_permission_to_boycott_or_refuse_a_boycott_is_itself_a_power_relation
required_trace:
  - grievance_or_policy_goal
  - boycott_target
  - boycotting_actor
  - conduct_type
  - state_rule_or_contract_condition
  - stated_nondiscrimination_security_or_industrial_policy_rationale
  - public_money_or_legal_access_conditioned
  - penalty_for_refusal_or_participation
  - protected_beneficiary_country_industry_or_firm
  - cost_to_taxpayer_or_public_entity
  - chilling_or_redress_effect
  - constitutional_or_statutory_review
  - lobbying_or_policy_authorship_if_evidenced
current_case_seats:
