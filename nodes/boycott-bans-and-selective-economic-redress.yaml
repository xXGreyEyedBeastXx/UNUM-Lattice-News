    notes:
      - Eighth_Circuit_en_banc_upheld_Arkansas_anti_BDS_contracting_law_by_treating_covered_refusals_to_deal_as_nonexpressive_commercial_conduct.
      - Supreme_Court_denied_certiorari_February_21_2023_so_no_nationwide_merits_resolution_was_created.
  texas_energy_firearms_israel:
    status: ACTIVE_MULTI_TARGET_BOYCOTT_POLICY
    notes:
      - Texas_has_used_public_contract_and_investment_restrictions_for_companies_that_boycott_Israel_boycott_energy_companies_or_discriminate_against_firearm_entities.
      - Texas_SB13_energy_boycott_law_was_declared_unconstitutional_by_district_court_in_February_2026.
      - Fifth_Circuit_stayed_that_injunction_May_29_2026_pending_appeal_allowing_enforcement_to_continue_during_appeal.
      - Chicago_Fed_research_estimated_Texas_anti_ESG_underwriter_restrictions_created_300_to_500_million_in_additional_interest_on_31_8_billion_borrowed_in_first_eight_months_after_enactment.
  federal_unsanctioned_foreign_boycotts:
