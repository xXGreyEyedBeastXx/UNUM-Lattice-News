summary:
  text: >-
    A political orientation that promotes higher fertility as a means of strengthening, preserving, or preventing
    decline of a nation or dominant national community. It is distinct from ordinary personal desire for children,
    family support policy, or religious encouragement of parenthood. Peer-reviewed U.S. research finds Christian
    nationalism strongly associated with nationalist pronatalism.
  posture: supported inference
