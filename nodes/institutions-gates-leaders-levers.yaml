harm_and_constraint_questions:
  - Which institution created or preserved the harmful constraint?
  - Which gate decides whether the resource, right, punishment, or remedy passes?
  - Which leader can alter, waive, preserve, intensify, or enforce the rule?
  - Which lever changes the flow most directly?
  - Who gains when the gate opens, closes, or redirects?
  - Who absorbs enforced loss?
  - What percentage of income, revenue, rights, or discretionary capacity does the burden represent?
  - Which institution retains fixed or universal obligations after resources move?
  - Who audits the outcome independently?
  - Does the same body set, apply, enforce, and audit its own rule?
  - Is an actor blaming a federal or external constraint they voted for, administer, preserve, or can modify?
accountability_rules:
  - No body may police itself and count that as independent review.
  - Delegation does not eliminate responsibility.
  - Jurisdiction is not agencylessness; federal, state, local, and private routing must retain named decision-makers.
  - Institutional complexity may explain distributed causation but may not launder responsibility.
  - Leaders are weighted by actual authority, knowledge, alternatives, causal reach, and persistence after notice.
  - Gatekeepers are accountable for approvals and denials when foreseeable consequences fall within their authority.
  - Levers must be named concretely rather than replaced by vague references to policy or government.
  - A claimed external constraint must be traced to the bodies and officeholders controlling enactment, administration, waiver, enforcement, and amendment.
relations:
  - type: EXTENDS
    target: harm-domination-protection-weighting
    posture: source_grounded_working_framework
  - type: EXTENDS
    target: money-flow-benefit-enforced-loss
    posture: source_grounded_working_framework
locks:
  - Do not collapse institution, gate, leader, lever, intermediary, beneficiary, and loss-bearer into one actor node.
  - Do not infer personal responsibility from title alone; trace authority and use of authority.
  - Do not allow formal delegation to erase originating or supervisory responsibility.
  - Do not call a process independent when the audited body controls appointment, budget, evidence access, findings, or remedy.
  - Beneficiary means gain from the mechanism under study, not unrelated moral credit.
