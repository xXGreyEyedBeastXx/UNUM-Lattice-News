  - oversight_body
  - self_policing_risk
  - affected_populations
  - retained_obligations
  - authority_to_change_rule
  - authority_claimed_absent
function_separation:
  norm_setting:
    meaning: defines and revises constraints, eligibility, formulas, standards, and rights
  adjudication:
    meaning: interprets and applies constraints to particular disputes or claims
  enforcement:
    meaning: implements decisions and stops or imposes conduct through administrative, fiscal, civil, or coercive means
  independent_harm_audit:
    meaning: tracks outcomes, diffuse harms, concentrated losses, hidden beneficiaries, failed safeguards, and correction history
actor_roles:
  leader:
    definition: officeholder or executive with agenda-setting, appointment, veto, waiver, enforcement, budget, or rulemaking authority
  gatekeeper:
    definition: participant controlling whether money, eligibility, information, review, appeal, enforcement, or remedy can pass
  intermediary:
    definition: body routing resources or decisions between source and destination without necessarily controlling the originating authority
  auditor:
    definition: participant independently evaluating outcomes, compliance, concealed harm, diffuse harm, and accountability failure
  beneficiary:
    definition: participant receiving direct or indirect material, legal, political, or institutional advantage from the mechanism under study
  loss_bearer:
    definition: participant compelled to absorb revenue loss, fixed costs, service reduction, risk, delay, exclusion, rights loss, or diminished future capacity
