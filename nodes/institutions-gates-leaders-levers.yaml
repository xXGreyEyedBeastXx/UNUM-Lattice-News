summary:
  text: >-
    A governance operator for naming the institutional bodies, decision gates, officeholders, and material or procedural levers through which harm is constrained, enabled, redirected, concealed, repeated, or corrected. It prevents institutional complexity and delegation from laundering responsibility.
  posture: source_grounded_working_framework
institution_fields:
