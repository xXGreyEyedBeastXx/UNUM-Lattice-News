id: attribution-routing-and-grievance-redirection
title: Attribution routing and grievance redirection
family: analysis_framework
subtype: attribution_routing_operator
landing_status: landed
lifecycle_status: active
updated: 2026-08-16
summary:
  text: >-
    A reusable investigative operator for cases where a real or perceived material,
    social, or status pressure is attributed to a person, population, institution,
    ideology, or event. It keeps separate the pressure's material causes, the causes
    people perceive, the causes public actors assert, the targets selected in rhetoric,
    the funders and amplifiers of that framing, the responses it mobilizes, and the
    material or power effects that return after those responses.
  posture: working_framework

core_trace:
  - pressure_or_loss
  - pressure_bearer
  - material_cause_candidates
  - visible_intermediate_or_competitor
  - perceived_cause
  - publicly_asserted_cause
  - targeted_population_or_actor
  - claim_producer
  - funder_or_resource_route
  - amplifier_or_distribution_channel
  - audience
  - affective_or_status_carrier
  - political_or_social_response
  - policy_or_institutional_transform
  - beneficiary_or_loss_bearer_after_transform
  - material_or_power_return
  - correction_or_re_entry

distinctions:
  material_pressure_vs_status_pressure:
    rule: >-
      Material deprivation, wage pressure, tax burden, housing cost, debt, or service loss
      must not be collapsed with fear of losing relative social position, cultural dominance,
      prestige, identity security, or political control.
  actual_vs_perceived_vs_asserted_cause:
    rule: >-
      The best-supported material cause, the cause an affected participant believes, and the
      cause asserted by a politician, donor, media actor, institution, or movement are separate
      fields even when they coincide.
  target_vs_cause:
    rule: >-
      A population named as the cause of a harm is not thereby established as a material cause.
      The causal claim must survive independent evidence and relevant counterfactuals.
  funder_vs_controller:
    rule: >-
      Funding a message, institution, network, or campaign establishes a resource route, not
      automatic command, intent, coordination, persuasion, or downstream policy control.
  beneficiary_vs_author:
    rule: >-
      Benefiting from a policy or outcome does not establish authorship, intent, or causal
      responsibility. Contribution and control require independent evidence.

