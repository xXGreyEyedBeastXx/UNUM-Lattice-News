adversarial_models:
  - id: deliberate_grievance_redirection
    question: >-
      Are actors with material or political power knowingly financing or amplifying a false or
      materially misleading attribution that redirects anger toward a lower-power target?
  - id: political_opportunism_without_central_coordination
    question: >-
      Are actors exploiting a grievance frame because it mobilizes support even if they did not
      create the underlying belief or coordinate with other actors?
  - id: distributed_ideological_alignment
    question: >-
      Are similar messages emerging independently from shared ideology, status threat, market
      incentives, or audience demand rather than central control?
  - id: target_materially_contributes
    question: >-
      Does the targeted population actually cause a meaningful share of the claimed harm, and
      is the rhetoric proportionate to the measured effect?
  - id: mixed_mechanism
    question: >-
      Are genuine local costs, status threat, organized messaging, and upstream material gains
      interacting without any single mechanism explaining the whole pattern?

discriminators:
  - Compare the claimed target's measured fiscal or material effect with the magnitude asserted in rhetoric.
  - Compare who experiences loss with who receives income, profit, asset, tax, subsidy, or authority gains.
  - Trace whether message financing predates, follows, or is independent of the material pressure.
  - Test whether the same audience responds differently when the group cue changes but the stated economic facts remain constant.
  - Test whether a claimed economic explanation persists after contradictory fiscal or causal evidence is supplied.
  - Separate policy outcomes that reduce the stated pressure from outcomes that primarily increase upstream wealth, authority, insulation, or coercive capacity.
  - Preserve local and subgroup costs even when national aggregate effects are positive.

relations:
  - type: EXTENDS
    target: money-flow-benefit-enforced-loss
    posture: working_framework
  - type: REQUIRES
    target: situated-relational-analysis
    posture: working_framework
  - type: INTERLOCKS_WITH
    target: interlocking-domination
    posture: working_framework

locks:
  - Actual cause != perceived cause != asserted cause != politically targeted cause.
  - Material insecurity != status insecurity.
  - Visibility of a target != magnitude of its causal contribution.
  - Funding != control.
  - Benefit != causation.
  - Group-level experimental effects do not prove that any particular person was persuaded.
  - A documented local cost does not establish a national net harm, and a national net benefit does not erase local cost.
  - Wealth, income, race, citizenship, class, or ideological membership does not itself establish participation or culpability.
  - A false or exaggerated attribution may be harmful even when no central conspiracy exists.
  - Repeated reporting or message repetition does not create independent evidence of the underlying causal claim.
  - Corrections must be able to return through the same attribution path.
