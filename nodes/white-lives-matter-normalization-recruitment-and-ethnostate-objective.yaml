summary:
  text: >-
    Preserves the April 2021 White Lives Matter initiative as more than a generic white-supremacist slogan. Primary
    movement manuals previously reviewed in UNUM-Extremism-Watch support an explicit 99%+ White demographic objective,
    a White Nationalist ideological endpoint, and a deliberate normalization/recruitment strategy in which approachable
    public activism is used to reach mainstream White families and move participants toward a White Nationalist worldview.
    Operational recruitment, evasion, anonymity, and event-execution instructions are intentionally not reproduced.
  posture: evidence_bound
