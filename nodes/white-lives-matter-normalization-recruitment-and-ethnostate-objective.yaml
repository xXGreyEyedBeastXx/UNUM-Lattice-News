      movement_capacity -> 99_percent_plus_White_demographic_objective_and_exclusive_spaces
cross_version_inference:
  posture: supported_inference
  text: >-
    The 2024 revision appears to refine optics and public accessibility rather than abandon the 2022 movement's core
    demographic endpoint. The inference is supported not merely by wording differences but by 3.0's own explicit emphasis
    on approachability, mainstream-family appeal, message separation, step-by-step ideological development, and a retained
    99%+ White long-term goal.
  lock: do_not_call_wording_change_deception_without_separate_evidence_of_intent_beyond_the_manuals_explicit_message_control_and_approachability_strategy
