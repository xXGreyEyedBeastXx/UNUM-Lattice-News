summary:
  text: >-
    Preserves the April 2021 White Lives Matter initiative as more than a generic white-supremacist slogan. Direct review
    of user-supplied primary copies of Activist Manual 2.0 (2022) and 3.0 (2024) establishes an explicit 99% or 99%+
    White demographic objective, a White Nationalist ideological endpoint, and a deliberate normalization/recruitment
    strategy. The strategy uses simple, positive, family-centered and socially approachable public messaging as an entry
    surface, then seeks to move sympathetic people into deeper ideological material, recurring activism, local networks,
    and movement capacity. Operational recruitment, evasion, anonymity, vetting, and event-execution instructions are
    intentionally not reproduced.
  posture: primary_source_verified
movement_level_findings:
  - both_2022_and_2024_primary_manuals_preserve_a_99_percent_or_99_percent_plus_White_demographic_endpoint
  - 2022_manual_is_more_explicit_about_racially_restricted_citizenship_and_near_total_demographic_control
  - 2024_manual_retains_the_same_demographic_endpoint_while_streamlining_public_facing_language
  - 2024_manual_explicitly_prioritizes_mainstream_White_families_over_hardcore_fringe_audiences
  - 2024_manual_explicitly_describes_approachable_public_activism_as_a_doorway_toward_a_White_Nationalist_worldview
  - both_versions_treat_public_activism_as_a_recruitment_and_conversion_surface_not_merely_expression
  - the_manuals_measure_success_by_growth_joining_recurring_participation_and_conversion_of_sympathizers_into_activists
  - the_manuals_describe_local_network_functions_for_recruitment_vetting_marketing_teaching_logistics_and_event_scaling
  - the_manuals_deliberately_separate_publicly_approachable_message_and_optics_from_more_explicit_extremist_or_polarizing_content
  - 2024_manual_describes_step_by_step_development_of_pro_White_sentiments_and_later_explicitly_requires_transforming_potential_sympathizers_into_activists
  - movement_capacity_is_directed_toward_an_absolute_White_majority_and_exclusive_White_spaces_backed_by_legal_measures
  - user_supplied_Telegram_search_screenshots_show_WLM_branded_state_country_material_event_and_backup_or_viewing_surfaces_including_a_recent_result_labeled_WLM_TENNESSEE
  - user_supplied_WLM_branded_propaganda_visually_combines_self_improvement_socialization_family_formation_and_white_reproduction_with_the_official_Telegram_link
