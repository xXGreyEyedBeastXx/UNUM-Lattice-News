  - productive_or_administrative_transformation
  - accumulated_capacity
  - increased_ability_to_set_terms_or_impose_constraints
  - feedback_into_next_extraction_or_control_cycle
historical_discovery_surface:
  - Stalinist forced-labor, industrialization, party-state, and coercive-capacity accumulation without private shareholder primacy
required_questions:
  - What durable capability was created or strengthened?
  - Who controls that capability?
  - Can it set the next terms of labor, price, access, information, law, or enforcement?
  - Does it increase the cost of refusal, competition, dissent, exit, or correction?
locks:
  - Public capacity can serve legitimate public purposes; capacity alone is not harm.
  - Attribute harm when the capacity is created through or used for an evidenced harmful mechanism.
  - Do not force all extraction into a private-profit model.
