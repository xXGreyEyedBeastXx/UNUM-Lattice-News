  - creditor_and_financial_capacity
  - monopoly_or_market_power
  - land_and_resource_control
  - state_fiscal_capacity
  - military_capacity
  - police_detention_or_coercive_capacity
  - surveillance_and_data_capacity
  - party_or_political_capacity
  - bureaucratic_capacity
