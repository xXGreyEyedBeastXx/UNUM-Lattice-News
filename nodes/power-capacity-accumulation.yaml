summary:
  text: >-
    Operator extending extraction accounting beyond private profit. Surplus, coerced labor, public
    resources, information, land, technology, or administrative control may accumulate as state,
    party, military, police, detention, surveillance, bureaucratic, informational, monopoly, or
    political capacity even when no private shareholder is the terminal beneficiary.
  posture: working_framework
