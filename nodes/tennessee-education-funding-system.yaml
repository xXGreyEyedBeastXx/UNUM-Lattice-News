summary:
  text: >-
    The network of Tennessee state appropriations, local education revenue, the TISA public-school funding formula, state-funded private-school scholarships, and federal pass-through or tax-credit mechanisms that route public fiscal capacity toward education providers, districts, families, vendors, and scholarship organizations.
  posture: observed
major_channels:
  public_school_formula:
    name: Tennessee Investment in Student Achievement
    funding_mix:
      - state funding
      - local funding
    components:
      - base funding for every public-school student
      - weighted funding for low-income students, concentrated poverty, English learners, students with disabilities, dyslexia characteristics, sparse and small communities
      - direct funding for literacy, career and technical education, postsecondary readiness, and other priorities
      - outcomes funding tied to student achievement
  state_private_school_subsidy:
    name: Education Freedom Scholarship Program
    source: Tennessee General Fund and other available state funds
    mechanism: per-student scholarship used primarily for tuition and fees at registered non-public schools
  federal_pass_through:
    mechanism: restricted federal grants administered through state and local education agencies
    examples:
      - Title I
      - IDEA
      - other ESSA and federal program funds
  federal_tax_expenditure:
    name: Federal Tax Credit Scholarship Act channel
    mechanism: federal tax credits for donations to scholarship-granting organizations rather than direct appropriations to schools
relations:
  - type: FUNDS
    target: tennessee-public-school-districts
    posture: observed
  - type: SUBSIDIZES
