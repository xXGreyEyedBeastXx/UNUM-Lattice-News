unresolved_questions:
  - Which taxes and revenue streams supply each state and local education channel by district and fiscal year?
  - How much federal pass-through funding is retained, delayed, redirected, or conditioned at the state level?
  - Which private schools, vendors, and scholarship organizations receive funds, in what amounts, and under what accountability standards?
  - How do enrollment shifts affect future TISA growth, district fixed costs, staffing, transportation, special education, and rural-school viability?
  - Which decision-makers control each routing change and which populations absorb the resulting losses?
locks:
  - Distinguish direct appropriations, formula funding, reimbursements, grants, tax expenditures, and private donations induced by tax credits.
  - Do not treat a scholarship payment as equivalent to a public-school funding obligation; recipient duties and admissions rules differ.
  - Do not assume nominal hold-harmless protection preserves future revenue growth or covers fixed institutional costs.
  - Aggregate spending increases do not erase concentrated district or population losses.
