    posture: observed
  - type: ROUTES_THROUGH
    target: scholarship-granting-organizations
    posture: observed
  - type: ADMINISTERED_BY
    target: tennessee-department-of-education
    posture: observed
  - type: TESTED_BY
    target: money-flow-benefit-enforced-loss
