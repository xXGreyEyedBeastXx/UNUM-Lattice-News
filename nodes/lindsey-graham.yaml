summary:
  text: >-
    Former U.S. senator from South Carolina and major congressional advocate for the Trump-Netanyahu alliance, U.S.-Israel military cooperation, and aggressive policy toward Iran. Graham died in July 2026.
  posture: observed
aliases: [Sen. Lindsey Graham, Lindsey O. Graham]
hashtags: [Trump, Israel, Netanyahu, Iran, Congress, MilitarySupport]
current_evidence:
  observed:
    - Publicly described the Trump-Netanyahu alliance as one of the strongest partnerships in the history of U.S.-Israel relations.
    - Traveled to Israel in January 2026 to meet Prime Minister Benjamin Netanyahu and his team.
    - Advocated a joint U.S.-Israel weapons-development venture that he compared to a 21st-century Manhattan Project.
    - Praised President Trump's strikes on Iranian nuclear facilities and maintained long-standing support for Israeli military and security policy.
  stated:
    - Framed the U.S. and Israel as sharing common enemies and common values.
  supported_inferences:
    - Functioned as a congressional, military-policy, and rhetorical bridge connecting Trump, Netanyahu, Israel policy, weapons development, and Iran escalation.
  disputed: []
  unknowns:
    - The full extent of his informal influence on particular operational decisions.
  counterevidence:
    - Advocacy and alliance do not establish command responsibility for every Israeli or U.S. military action.
