  adjudicated: []
  alleged: []
  supported_inferences:
    - The WLM slogan/movement lineage predates the April 2021 Telegram initiative.
    - The 2021 initiative is a later movement instantiation / organizing configuration rather than the origin of the WLM slogan or broader white-supremacist movement lineage.
  disputed: []
  ambiguous:
    - The exact personnel, administrator, infrastructure, and organizational continuity between pre-2021 WLM formations and the April 2021 initiative remains relation-specific and incompletely resolved.
  unknowns:
    - The full genealogy of channels, groups, organizers, and successor surfaces between earlier WLM formations and the April 2021 initiative.
  missing_or_withheld:
    - Manual 1.0 or any earlier version referenced by the existence of Manual 2.0 has not been recovered in the current evidence set.
  counterevidence: []
