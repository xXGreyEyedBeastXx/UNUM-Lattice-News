summary:
  text: >-
    A white-supremacist slogan and movement lineage that predates the April 2021 Telegram initiative.
    External monitoring traces the phrase's white-supremacist use to early 2015 as a racist counter-response
    to Black Lives Matter. The April 2021 initiative explicitly distinguishes itself from prior WLM groups
    while also describing itself as continuing a broader, older pro-White / white-racial-consciousness struggle.
    Organizational identity, personnel continuity, movement lineage, and local-cell relation are therefore
    separate evidentiary questions and must not be collapsed into a single connected/disconnected binary.
  posture: supported inference
