adversarial_tests:
  - Benefit receipt does not itself prove the employer caused eligibility.
  - Eligibility may depend on household size, other household income, work hours, disability, age, or program rules.
  - Employer-sponsored insurance availability does not prove affordability, enrollment, or adequacy for a particular household.
  - A public benefit paid to a worker is not a direct cash payment to the employer.
  - An indirect employer subsidy claim requires a counterfactual or incidence argument showing that public provision reduces compensation pressure or employer-borne cost.
  - Employee benefit counts from selected states are not national employer totals unless a source establishes national coverage.
  - The absence of evidence that an employer intended workers to qualify for public assistance does not make the employer's compensation policy accidental.
  - Intentional compensation term-setting and intent to cause public-assistance eligibility are separate claims and require separate evidence.
  - Repeated public evidence, audits, litigation, worker complaints, or internal warnings can change the employer knowledge state even when the underlying compensation mechanism is unchanged.
  - Capacity to know is not actual knowledge; actual knowledge and deliberate avoidance require their own evidence.
