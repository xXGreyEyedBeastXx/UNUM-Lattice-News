locks:
  - Worker benefit receipt != worker culpability.
  - Worker benefit receipt != direct corporate subsidy.
  - Employer association with benefit recipients != proof of illegal underpayment.
  - Public cost and employer indirect benefit are separate quantities.
  - Do not count the same public benefit once as worker assistance and again in full as employer capture.
  - Count employer-side capture only to the extent a supported incidence or counterfactual analysis attributes value to the employer.
  - Intentional compensation policy != proven intent to cause poverty, hunger, illness, or program eligibility.
  - Lack of harmful-endpoint intent != lack of accountability for foreseeable or credibly noticed consequences.
  - Continued conduct after credible notice, where the actor has meaningful capacity to correct, is a separate accountability fact and must remain visible.
