summary:
  text: >-
    A reusable operator for tracing employment arrangements in which workers or their households receive means-tested public benefits while employed. The operator keeps distinct the legal recipient of the benefit, the employer's intentionally set compensation package, household eligibility conditions, the public cost, any indirect employer benefit created when public programs cover necessities that otherwise would require greater private compensation or household resources, and the employer's knowledge, notice, correction capacity, persistence, and retained gain where accountability is being tested.
  posture: working_framework
