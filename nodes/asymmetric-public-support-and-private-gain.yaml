comparison_question: >-
  When collective public support for households is attacked as dependency, socialism, or communism,
  while collective public support for private firms is described as investment, competitiveness,
  national security, development, or market policy, compare the actual structure of ownership,
  conditions, risk, return, and democratic control instead of accepting either label.
relations:
  - type: EXTENDS
    target: public-to-private-revenue-and-ownership-return
  - type: EXTENDS
    target: power-capacity-accumulation
  - type: EXTENDS
    target: patronage-return-laundering
locks:
  - Do not count every government contract as corporate welfare.
  - Do not count every tax expenditure as a corporate subsidy; resolve beneficiary incidence.
  - Do not erase genuine public value from industrial policy, procurement, research, or infrastructure.
  - Do not let genuine public value terminate the downstream ownership and risk trace.
