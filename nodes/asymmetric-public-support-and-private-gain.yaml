summary:
  text: >-
    Tests whether public money, credit, tax preference, insurance, infrastructure, legal privilege,
    monopoly protection, procurement, bailout capacity, or externalized risk supports privately owned
    firms while upside remains disproportionately private and downside is shifted to taxpayers,
    workers, consumers, communities, or future generations. It compares this support with the
    conditions, stigma, work requirements, means tests, and enforcement attached to support for
    households and workers.
  posture: working_framework
