  supported_inferences:
    - Christian nationalism is distinct from Christianity, Christian identity, or ordinary religious commitment; it is a political ideology concerning nation, authority, and social order.
    - Peer-reviewed nationally representative research identifies Christian nationalism as a strong predictor of nationalist pronatalism.
    - 2026 peer-reviewed research distinguishes general pronatalism from selective pronatalism and finds Christian nationalism, unlike ordinary religious commitment, associated with selective pronatalism aimed at preserving demographic dominance and with replacement-theory belief.
    - Peer-reviewed research finds Christian nationalism and White nationalism independently associated with support for arresting women who obtain abortions, with the strongest support where the two overlap.
    - Anti-abortion policy is a reproductive-autonomy constraint as a matter of legal effect because it removes or narrows the pregnant person's authority to terminate pregnancy; supporters' fetal-protection rationale is relevant to motive but does not erase that effect.
    - A pattern-level reproductive-control investigation is warranted where pronatalism, abortion restriction or punishment, patriarchal gender-order beliefs, barriers to minor abortion assistance, and defenses of minor marriage repeatedly converge.
    - Distributed state implementation does not itself defeat a movement-level pattern; coordination, common funding, model legislation, shared personnel, rhetoric, and organizations remain separate relation questions.
  disputed: []
  ambiguous:
    - The degree to which any particular anti-abortion, pronatalist, child-marriage, or parental-control campaign is organizationally connected to Christian-nationalist institutions must be established case by case.
    - Some relevant policies may arise from conservative religious, partisan, patriarchal, economic, or other motives without a demonstrable Christian-nationalist causal edge.
  unknowns:
    - The full donor, legal-network, model-legislation, church, think-tank, political-party, and personnel conductance connecting the currently identified policy clusters has not yet been exhaustively mapped.
    - The extent to which selective pronatalism and white-nationalist demographic politics directly shape particular state bills remains unresolved without actor-specific evidence.
  missing_or_withheld: []
  counterevidence:
    - Many Christians reject Christian nationalism, and Christian identity alone is not evidence of Christian-nationalist ideology.
    - The research does not show that every Christian nationalist supports child marriage, lowering age of consent, rape, or criminal punishment of abortion patients.
    - Opposition to abortion can arise from non-nationalist moral or religious beliefs; actor-level classification requires more than an anti-abortion position.

