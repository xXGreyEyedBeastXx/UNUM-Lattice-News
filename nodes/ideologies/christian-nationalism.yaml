locks:
  - Christianity != Christian nationalism.
  - Christian identity != Christian-nationalist ideology.
  - Anti-abortion rationale != absence of bodily-autonomy constraint.
  - Convergence != coordination.
  - Lack of proven central coordination != lack of movement-level pattern.
  - Different states, churches, or organizations do not become causally independent merely because implementation is distributed.
  - Shared outcome alone does not prove common command.
  - Child marriage != rape in every case.
  - Minimum marriage age != age of consent.
  - Marital exemption != proof a particular offender used it.
  - Do not infer that every Christian nationalist supports every reproductive-control policy.
  - Do not use Christians who reject Christian nationalism as counterevidence to what Christian-nationalist actors or institutions demonstrably advocate.
  - Claims about rape facilitation, abuse protection, intent, coordination, or criminal conduct require their own evidence chains.
