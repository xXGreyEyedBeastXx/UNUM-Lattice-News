summary:
  text: >-
    A political-nationalist ideology and movement that seeks to bind national identity, public authority,
    law, and social order to a privileged conception of Christianity. It is not Christianity itself and
    should not be inferred from Christian identity. In the contemporary United States, peer-reviewed research
    links Christian nationalism to nationalist pronatalism, selective pronatalism, replacement-threat beliefs,
    and more punitive anti-abortion attitudes. These findings support investigation of a broader reproductive-
    autonomy convergence involving pronatalism, abortion restriction, patriarchal gender ordering, barriers to
    care for pregnant minors, and some defenses of minor marriage. The evidence supports pattern-level
    convergence; it does not establish that every Christian nationalist supports every such policy or that all
    relevant states and organizations operate under a single command structure.
  posture: supported inference
