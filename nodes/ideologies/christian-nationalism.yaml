unresolved_questions:
  - Which organizations and funders connect Christian-nationalist pronatalism to specific abortion, parental-control, child-marriage, and reproductive-policy campaigns?
  - Which model-bill, litigation, church, think-tank, activist, and donor networks provide conductance across state boundaries?
  - Where do White-nationalist or replacement-theory networks overlap personnel, funding, rhetoric, or policy with Christian-nationalist reproductive politics?
  - Which documented child-marriage opponents of reform are connected to Christian-nationalist organizations, and which are better explained by other religious, patriarchal, libertarian, or local traditions?
  - Which attempts to change age-of-consent law actually occurred after 2021, and which claims instead concern marriage-age or marital exemptions and must remain separately typed?
  - How often do rape/incest abortion exceptions fail in practice because of reporting, gestational, provider, parental-consent, or travel barriers even where an exception exists on paper?

