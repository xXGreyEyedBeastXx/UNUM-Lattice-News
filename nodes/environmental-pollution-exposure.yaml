summary:
  text: Exposure to harmful contaminants in air, water, soil, food, workplaces, and built environments, including recognized developmental neurotoxicants.
  posture: observed
aliases:
  - toxic exposure
hashtags:
  - Pollution
  - EnvironmentalHealth
  - Neurodevelopment
  - EnvironmentalJustice
current_evidence:
  observed:
    - EPA identifies lead, mercury, criteria air pollutants, pesticides, PCBs, flame retardants, and other chemicals as relevant to neurodevelopmental harm.
    - NIEHS supports research on gene-environment interactions and autism, including air pollution and pesticide exposure.
  stated: []
  supported_inferences:
    - Pollution governance is materially relevant when government officials frame autism as environmentally caused or preventable.
  disputed:
    - The magnitude and causality of specific exposure-autism relationships vary by pollutant, timing, study design, and population.
  unknowns:
    - Which exposures, combinations, windows, and susceptibilities are causally important for autism.
  counterevidence:
    - Environmental association does not establish that autism has one environmental cause or that identified prevalence trends are caused by pollution.
