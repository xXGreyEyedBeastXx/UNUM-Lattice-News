research_queue:
  - full pre-office and early-career platform archive
  - vote record on enacted federal scholarship tax-credit provisions
  - committee roles and amendment history
  - telecom, pharmaceutical, education, and ideological-network donors
  - lobbying meetings, access patterns, and revolving-door relationships
  - federal funding conditions later described as external constraints
