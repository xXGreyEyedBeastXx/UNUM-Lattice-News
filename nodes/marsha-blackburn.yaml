locks:
  - Separate campaign rhetoric, bill sponsorship, committee influence, vote, enactment, implementation, and downstream consequence.
  - Do not infer quid pro quo from donations or policy alignment without stronger evidence.
  - Do not allow federal jurisdiction to erase named legislative and executive control.
