historical_policy_domains:
  - federal education control and Department of Education opposition
  - scholarship tax credits and private-school subsidies
  - teacher unions, DEI, CRT, and ideological funding conditions
  - abortion and reproductive restrictions
  - telecommunications, broadband, privacy, and net-neutrality policy
  - pharmaceutical distribution, opioid enforcement, and PBM policy
  - border and immigration enforcement
  - judicial nominations and executive power
  - Israel policy and national-security alignment
working_pattern:
  proposition: >-
    Blackburn frequently condemns federal power when used for public regulation,
    civil-rights enforcement, labor capacity, or broad public institutions while
    supporting federal tax expenditures, funding threats, ideological conditions,
    deregulation, policing, and enforcement when they advantage favored actors or
    discipline disfavored institutions.
  status: supported_hypothesis_requires_vote_and_policy_specific_trace
counterevidence_and_limits:
  - Some later healthcare legislation targets concentrated intermediary power, including pharmacy-benefit managers.
  - Sponsorship of a related bill is not equivalent to voting for or causing the final enacted provision.
  - Party control does not prove personal authorship of every federal rule.
  - Material-elite status and anti-elite rhetoric are distinct fields; rhetorical contradiction must be demonstrated rather than assumed.
