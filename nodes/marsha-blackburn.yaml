summary:
  text: >-
    Tennessee federal lawmaker and gubernatorial candidate whose public rhetoric emphasizes limited government, anti-tax policy, parental authority, local control, school choice, conservative moral order, and opposition to bureaucratic or cultural elites. Her record should be traced through federal legislative, tax-code, funding-condition, confirmation, oversight, and coalition gates.
  posture: observed_with_supported_inference
claimed_ideals:
  - limited federal government
  - anti-tax and fiscal restraint
  - parental authority and school choice
  - local control
  - government accountability
  - religious-conservative moral order
  - anti-elite and anti-bureaucracy politics
institutional_seat:
  institution: united-states-senate
  role: senator
  gate_types:
    - legislation
    - committee_and_subcommittee
    - appropriation_and_tax_code
    - confirmation
    - oversight
    - federal_funding_condition
    - coalition_and_party_agenda
  lever_types:
