locks:
  - Settler != State employee by default.
  - Settler violence != independent private violence when state responsibility, participation, protection or shared objectives are evidenced.
  - State relation != organizational identity.
  - Settlement expansion != proof every individual settler supports violence.
  - Intervention against some settlers != falsification of a broader state-settler ecology.
