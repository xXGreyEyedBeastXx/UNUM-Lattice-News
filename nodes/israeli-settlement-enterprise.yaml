current_evidence:
  observed:
    - Israeli governments authorize, service, protect or retroactively legalize settlement/outpost activity in parts of the occupied West Bank.
    - Settlement expansion and settler violence have displaced Palestinian residents and constrained access to land, water, homes and movement in documented cases.
  stated:
    - Finance Minister Bezalel Smotrich has publicly framed settlement expansion as strengthening Israeli control and preventing a Palestinian state.
    - Netanyahu and Defense Minister Katz announced in July 2026 that farm-outpost legalization and new outpost establishment would be accelerated among West Bank response measures.
  adjudicated: []
  alleged: []
  supported_inferences:
    - The settlement enterprise should be analyzed as a state-settler ecology rather than presuming either complete private independence or complete actor identity.
  disputed:
    - Israel disputes the international legal characterization of much of the occupied-territory and settlement regime.
  ambiguous:
    - State responsibility, military participation, settler-organizational role and individual perpetration vary by event and require separate attribution.
  unknowns:
    - Full current funding, land-transfer, security-coordination and organizational map across settlement/outpost networks remains incomplete.
  missing_or_withheld: []
  counterevidence:
    - Israeli military or police have at times intervened against particular settlers/outposts; those events must be retained and do not by themselves negate broader state-policy or responsibility findings.

evidence_extensions:
  legal_advisory_findings:
    - date: 2024-07-19
      body: International Court of Justice
      finding: Israel must cease immediately all new settlement activities and evacuate all settlers from the Occupied Palestinian Territory.
      posture: LEGAL_ADVISORY_FINDING
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
  external_fact_findings:
    - date: 2026-06
      body: UN Independent International Commission of Inquiry
      finding: >-
        Settler violence functions as a means of implementing Israeli State policy and violent settlers and the State
        pursue overlapping strategic objectives including occupation maintenance, settlement entrenchment,
        annexation and displacement of Palestinians from land.
      posture: EXTERNAL_FACT_FINDING
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
  territorial_effects:
    - effect: Palestinian displacement and reduced return/access to homes, agricultural land, grazing land, roads, water and community space in documented cases
      posture: DOCUMENTED_EFFECT
      source: source-israel-palestine-state-conduct-and-territorial-control-2023-2026
