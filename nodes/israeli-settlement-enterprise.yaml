id: israeli-settlement-enterprise
title: Israeli Settlement Enterprise in the Occupied West Bank
entity_type: ecology
actor_roles: []
status: active
updated: 2026-08-17
summary:
  text: >-
    A state-settler territorial ecology encompassing settlement authorization, outposts, infrastructure,
    land administration, state services/protection, settler organizations and individual settlement activity
    in the occupied West Bank including East Jerusalem. It is not a claim that every settler is violent or that
    settlers and the State are legally identical. The ICJ found continued Israeli settlement activity unlawful
    and required Israel to cease new settlement activity and evacuate settlers. In 2026 the UN Commission of
    Inquiry found that settler violence functions as a means of implementing Israeli State policy and that the
    State and violent settler actors work toward overlapping strategic objectives including settlement
    entrenchment, annexation and Palestinian displacement.
  posture: supported_inference
