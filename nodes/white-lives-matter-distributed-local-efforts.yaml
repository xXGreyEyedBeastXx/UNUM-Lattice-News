locks:
  - Network membership does not establish common command, shared intent, guilt, or equal responsibility.
  - Decentralized does not mean disconnected.
  - Channel rename, deletion, ban, backup, or successor creation does not by itself create a new independent actor.
  - Search-result similarity alone is not affiliation evidence; prefer movement recognition, official routing, shared infrastructure, or other recoverable relations.
