locks:
  - Judaism is not Zionism.
  - Jewish identity is not Zionist ideology.
  - Zionism is not identical to the State of Israel, an Israeli government, or every Israeli citizen.
  - Self-identification with an ideology is evidence of claimed identity, not automatic evidence that every position held by the actor faithfully instantiates the ideology.
  - Subtype difference does not erase the parent ideology.
  - Internal dissent does not become representative counterevidence without evidence of representativeness.
  - Do not use one reformer or humane outlier to morally average, sanitize, or redefine a parent movement.
  - Nationalist or ethnonationalist classification does not by itself establish every alleged harm or individual intent; causal and conduct claims require separate evidence.
