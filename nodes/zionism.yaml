unresolved_questions:
  - Which historical and contemporary Zionist currents retain, alter, or reject the parent movement's state-centered and peoplehood-centered commitments?
  - For any specific actor claiming a Zionist identity, what program do they actually support, what do they understand, and what material or political consequences do their actions support?
corrections:
  - date: 2026-08-17
    previous: Martin Buber's binational Zionist self-identification was treated as evidence that Zionism itself could therefore be represented as non-exclusionary.
    updated: >-
      Buber's self-identification and participation remain historically relevant, but his rejection of Jewish sovereign statehood and Jewish majority rule and his advocacy of a binational state are typed as internal dissent/outlier positions, not representative counterevidence against the dominant institutional Zionist program.
    reason: >-
      Scholarly sources describe Buber as opposing the dominant state-building trajectory, seeking demographic parity and binationalism, and recognizing that his views were unlikely to sway the Zionist majority.
references:
