summary:
  text: >-
    A Jewish nationalist movement. The World Zionist Organization's official Jerusalem Program defines Zionism
    as the national liberation movement of the Jewish people and centers a Jewish, Zionist State of Israel,
    Jewish national continuity, aliyah, national Zionist interests, and settlement. For lattice classification,
    Zionism is seated first under nationalism and Jewish ethnonationalism before its internal currents are
    distinguished. Internal branches or dissidents may differ materially in program, tactics, religion, economics,
    borders, or treatment of Palestinians, but branch labels must not erase parent commitments that remain
    evidenced. The contemporary Israeli state expression includes a legal exclusivity rule: the 2018 Nation-State
    Basic Law states that exercise of national self-determination in Israel is unique to the Jewish people.
