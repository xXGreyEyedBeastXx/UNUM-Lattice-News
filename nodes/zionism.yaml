current_evidence:
  observed: []
  stated:
    - The World Zionist Organization defines Zionism as the national liberation movement of the Jewish people.
    - The World Zionist Organization's official platform centers a Jewish, Zionist State of Israel, aliyah, Jewish national interests, Jewish national continuity, and settlement of the country.
    - Israel's 2018 Nation-State Basic Law states that national self-determination in Israel is unique to the Jewish people and that Jewish settlement is a national value.
  adjudicated: []
  alleged: []
  supported_inferences:
    - Zionism is properly classified as a nationalist movement and, in its peoplehood/state-centered structure, as a form of Jewish ethnonationalism.
    - The current state-law expression contains an exclusionary national-self-determination structure because the collective right is expressly reserved to one national people.
    - Internal Zionist currents are modalities or disputes within the parent movement unless their program rejects or materially transforms parent commitments; the existence of such a current does not by itself redefine the parent movement.
    - Martin Buber is best treated as an internal dissident/outlier for questions of sovereign Jewish statehood, Jewish demographic majority, and binationalism rather than as representative counterevidence to the dominant Zionist state-building program.
  disputed: []
  ambiguous:
    - The term Zionism has been used historically by actors whose programs diverged substantially from dominant institutional political Zionism; self-identification therefore requires program-level classification rather than label-only inference.
  unknowns: []
  missing_or_withheld: []
  counterevidence:
    - Internal Zionist dissent and binational Zionist self-identifications are historically documented; they establish contestation but do not automatically establish representativeness of the parent movement.
