unresolved_questions:
  - Which Tennessee-linked public actions since 2021 can be attributed to which specific WLM local channel/cell, and which channel successions or renamed handles connect those records over time?
  - What documented relationships exist between this initiative and contemporary neo-Nazi, Klan, Active Club, Patriot Front, or other white-supremacist networks?
  - Which regional WLM channels have been shut down, renamed, replaced, or recreated, and what source evidence establishes successor relations rather than merely similar names?
  - Has the initiative's recurring monthly action tradition remained active through 2025-2026, and where is that independently observable?
  - Which public-facing messages function as entry points to more explicit white-nationalist material, and how has that strategy changed between manual versions?
  - What evidence can distinguish ideological overlap, alliance, cell relation, operational coordination, shared personnel, and formal organizational control?
  - Can Manual 1.0 or another pre-2.0 activist manual be recovered and dated?
corrections:
  - date: 2026-08-17
    previous: Preserve the initiative's claimed separation from earlier WLM groups unless independent evidence establishes continuity.
    updated: >-
      Preserve the narrow claim that the April 2021 initiative denies identity/organizational continuity with prior WLM groups, but do not use that disclaimer to sever the separately evidenced broader movement lineage or the initiative's distributed local-cell topology.
    reason: >-
      Manual 2.0 explicitly distinguishes prior WLM groups from the broader pro-White movement and says the initiative continues an older struggle; both manuals and the official public channel document common local-effort infrastructure and shared movement goals.
