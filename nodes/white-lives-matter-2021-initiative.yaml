current_evidence:
  observed:
    - The official public Telegram channel repeatedly forwards and attributes activity to recognized regional WLM efforts, including Tennessee, Montana, Pennsylvania, United Kingdom, Germany, and others.
    - The official public channel publishes a structured state-channel navigator and has used successor/backup channel handles over time, showing that channel-name change does not by itself terminate movement continuity.
  stated:
    - The 2024 manual states that the initiative seeks to awaken white racial consciousness through real-world action.
    - The 2024 manual states a long-term objective of populations above 99 percent white in countries and continents it identifies as white-built.
    - The 2024 manual centers the 14 Words as its core ideological message.
    - The 2024 manual describes its public outreach as a doorway toward a White Nationalist worldview.
    - The 2024 manual directs WLM-branded outreach away from overt Nazi, fascist, MAGA, antisemitic, anti-LGBT, and other polarizing messaging because those associations can interfere with mainstream recruitment.
    - The 2022 manual stated a 99 percent white demographic objective and racially restricted citizenship in envisioned white states.
    - The manuals state that the April 2021 initiative is not the same as prior WLM groups while separately describing the initiative as continuing an older pro-White / white-racial-consciousness struggle.
    - The 2022 manual describes an ideal of many small autonomous local nests acting as a unit toward the same stated goals.
    - The manuals prescribe common local-channel structures, admin expectations, vetting, branding, recurring action schedules, conduct rules, and shared movement infrastructure.
    - The official public channel has explicitly described local WLM efforts using a cell metaphor while presenting their success as shared across the initiative.
  adjudicated: []
  alleged: []
  supported_inferences:
    - The movement's stated demographic and political objectives support classifying its program as white nationalist and white supremacist rather than as a generic equal-treatment campaign.
    - The distinction between acceptable public-facing messaging and broader ideological material functions as an exoteric/esoteric recruitment boundary.
    - The initiative's local/regional efforts are better represented as distributed cells, chapters, or local efforts within a common movement topology than as presumptively independent actors.
    - Formal decentralization and individual-responsibility disclaimers coexist with common standards, movement routing, vetting, branding, schedules, and shared infrastructure; therefore decentralization is not evidence of causal disconnection.
    - Language disassociating unlawful local conduct from the initiative may function as an accountability-separation mechanism, but this functional inference does not establish central command over unlawful acts.
  disputed: []
  ambiguous:
    - The degree of legal-entity, personnel, administrator, or infrastructure continuity between the April 2021 initiative and particular pre-2021 WLM groups remains relation-specific and incompletely resolved.
    - The exact authority hierarchy among central surfaces, local administrators, chats, channels, and individual activists is only partially observable because the initiative intentionally uses anonymity and distributed organization.
  unknowns:
    - Current size, geographic distribution, administrator identity, and activity level of every local cell are not established by the manuals alone.
    - The extent of overlap with specific contemporary neo-Nazi, Klan, Active Club, Patriot Front, or other extremist organizations requires node-specific evidence.
    - The full succession history of renamed, replaced, banned, backup, or recreated regional Telegram channels remains to be reconstructed.
  missing_or_withheld:
    - participant and administrator identities are intentionally obscured by the movement's anonymous structure
    - Manual 1.0 or an earlier manual version has not been recovered in the current evidence set
  counterevidence:
    - The movement repeatedly states that WLM-branded activism should remain legal and nonviolent; ideological classification or movement-cell relation should not be converted into an unsupported allegation of criminal conduct by the initiative or every participant.
