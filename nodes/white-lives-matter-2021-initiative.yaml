current_evidence:
  observed: []
  stated:
    - The 2024 manual states that the initiative seeks to awaken white racial consciousness through real-world action.
    - The 2024 manual states a long-term objective of populations above 99 percent white in countries and continents it identifies as white-built.
    - The 2024 manual centers the 14 Words as its core ideological message.
    - The 2024 manual describes its public outreach as a doorway toward a White Nationalist worldview.
    - The 2024 manual directs WLM-branded outreach away from overt Nazi, fascist, MAGA, antisemitic, anti-LGBT, and other polarizing messaging because those associations can interfere with mainstream recruitment.
    - The 2022 manual stated a 99 percent white demographic objective and racially restricted citizenship in envisioned white states.
    - Both manuals claim the April 2021 initiative is distinct from earlier groups using the White Lives Matter name.
  adjudicated: []
  alleged: []
  supported_inferences:
    - The movement's stated demographic and political objectives support classifying its program as white nationalist and white supremacist rather than as a generic equal-treatment campaign.
    - The distinction between acceptable public-facing messaging and broader ideological material functions as an exoteric/esoteric recruitment boundary.
  disputed: []
  ambiguous:
    - The degree of organizational continuity, if any, between the April 2021 initiative and earlier White Lives Matter formations is not established by the manuals themselves.
  unknowns:
    - Current size, geographic distribution, and activity level of local cells are not established by the manuals alone.
    - The extent of overlap with specific contemporary neo-Nazi, Klan, Active Club, Patriot Front, or other extremist organizations requires node-specific evidence.
  missing_or_withheld:
    - participant identities are intentionally obscured by the movement's anonymous structure
  counterevidence:
    - The movement repeatedly states that WLM-branded activism should remain legal and nonviolent; ideological classification should not be converted into an unsupported allegation of criminal conduct.
