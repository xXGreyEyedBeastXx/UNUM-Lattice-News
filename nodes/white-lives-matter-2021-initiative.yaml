summary:
  text: >-
    A self-described worldwide, anonymous, decentralized White Lives Matter initiative launched in April 2021.
    Its 2022 and 2024 activist manuals state a long-term objective of maintaining populations above 99 percent
    white in countries and continents it identifies as white-built, center the white-supremacist slogan commonly
    known as the 14 Words, and describe mainstream-facing outreach as a pathway toward a White Nationalist
    worldview. The initiative denies identity or organizational continuity with prior WLM groups, but its own
    manuals separately place the initiative within a broader older pro-White / white-racial-consciousness movement
    lineage. Its decentralization is operational rather than causal separation: the manuals and public channel
    document common doctrine, manuals, branding, schedules, vetting, local-admin expectations, shared submission
    and communication infrastructure, and recognized regional/local efforts. Local cells remain distinct bodies for
    event-specific attribution, but should not be treated as independent actors merely because responsibility is
    formally distributed or names/channels change.
  posture: supported inference
