locks:
  - Node inclusion is not an accusation of criminal conduct.
  - Prior-group identity, movement lineage, local-cell relation, operational coordination, and individual-act attribution are different relation types.
  - Organizational discontinuity is not movement discontinuity.
  - Decentralized does not mean disconnected.
  - A cell/chapter relation does not erase event-specific attribution requirements.
  - Denial of one relation type must not erase other demonstrated relation types.
  - Missing proof of an edge is not affirmative proof of causal disconnection.
  - White-nationalist or white-supremacist classification should rest on stated goals and documented ideology, not on racial identity or political affiliation alone.
  - Anonymous participation is not sufficient evidence to identify a person as a member or organizer.
  - Do not publish operational-security guidance, private identities, addresses, or doxxing material.
  - Distinguish ideological overlap, shared media, attendance, alliance, cell/chapter relation, coordination, and formal organizational control as separate evidence classes.
