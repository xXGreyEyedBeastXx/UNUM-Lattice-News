summary:
  text: >-
    A self-described worldwide, anonymous, decentralized White Lives Matter initiative launched in April 2021. Its own 2022 and 2024 activist manuals state a long-term objective of maintaining populations above 99 percent white in countries and continents it identifies as white-built, center the white-supremacist slogan commonly known as the 14 Words, and describe mainstream-facing outreach as a pathway toward a White Nationalist worldview. The manuals distinguish public-facing optics from the broader ideological material available inside the movement's ecosystem. The initiative claims no organizational connection to earlier groups using the White Lives Matter name; that claimed separation should remain distinct unless independently established otherwise.
  posture: supported inference
