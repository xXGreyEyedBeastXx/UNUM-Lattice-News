summary:
  text: The highest federal court, composed of nine life-tenured justices, with final appellate authority over major constitutional and federal questions and unusually weak external ethics enforcement compared with lower federal courts.
  posture: observed
aliases: [SCOTUS, Supreme Court of the United States]
hashtags: [SCOTUS, JudicialPower, Ethics, FederalistSociety, SeparationOfPowers]
current_evidence:
  observed:
    - The current Court has nine justices and a six-member conservative majority.
    - Five current justices have disclosed ties to the Federalist Society through travel, reimbursements, appearances, or other relationships.
    - The Court adopted its first formal ethics code in 2023, but the code lacks an independent enforcement mechanism.
  supported_inferences:
    - Selection networks, donor access, life tenure, recusal discretion, and weak enforcement materially affect accountability risk.
  disputed:
    - Whether ideological and donor-network ties improperly influence particular decisions.
  unknowns:
    - The full extent of undisclosed relationships and the causal effect of those relationships on case outcomes.
