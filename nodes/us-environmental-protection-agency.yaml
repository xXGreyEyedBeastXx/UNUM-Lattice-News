summary:
  text: Federal environmental regulator whose actions materially affect pollution exposure, enforcement, standards, and environmental-health risk.
  posture: observed
aliases:
  - EPA
hashtags:
  - EnvironmentalRegulation
  - Pollution
  - Neurodevelopment
  - PublicHealth
current_evidence:
  observed:
    - EPA recognizes that lead, mercury, pesticides, PCBs, flame retardants, air pollution, and other environmental exposures can contribute to neurodevelopmental harm.
    - EPA announced and finalized multiple deregulatory actions affecting greenhouse-gas, mercury, hazardous-air-pollutant, and PFAS protections during the current administration.
  stated:
    - EPA states that its deregulatory program protects health while lowering costs and advancing energy production.
  supported_inferences:
    - EPA policy choices are materially relevant to any federal claim that environmental exposures may contribute to autism or other neurodevelopmental outcomes.
  disputed:
    - Whether the current balance of deregulation, delayed compliance, retained standards, and targeted cleanup adequately protects vulnerable populations.
  unknowns:
    - Net exposure effects of the full current policy package.
  counterevidence:
    - EPA has also continued Superfund work, PFAS funding, emergency response, and some retained pollution standards.
