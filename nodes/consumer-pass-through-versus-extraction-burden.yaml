summary:
  text: >-
    Operator for testing whether lower consumer prices, cheaper inputs, faster logistics, or other
    downstream gains are proportionate to the extraction, subsidy, public risk, labor burden,
    ecological cost, displacement, coercive cost, or foreign-policy support used to obtain them.
    A lower price is a benefit seat, not a complete welfare verdict.
  posture: working_framework
