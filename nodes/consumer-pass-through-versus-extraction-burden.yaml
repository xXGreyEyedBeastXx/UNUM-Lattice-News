core_question: >-
  Of the value created or costs reduced by the intervention, how much reaches ordinary consumers and
  host-country populations, how much is retained by firms, creditors, owners, or strategic state
  capacity, and who absorbs the non-price harms that make the lower price possible?
locks:
  - Lower consumer prices are real when measured, but they do not erase upstream extraction or harm.
  - A reduction in transport or input cost is not proof that retail prices fall by the same amount.
  - Do not treat consumer surplus as identical to corporate surplus; measure both.
  - Do not compare a recurring extraction burden with a one-time consumer saving without time normalization.
  - Do not monetize lethal, coercive, rights, displacement, or ecological harms as if a dollar-equivalent automatically resolves moral weight.
  - The host population is not one seat; separate workers, landholders, displaced residents, local consumers, state revenue recipients, elites, and owners.
