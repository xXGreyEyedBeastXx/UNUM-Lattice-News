summary:
  text: >-
    Traces the transformation of medically necessary care into household debt and the enforcement channels that can
    follow nonpayment, including collections, credit reporting, liens, lawsuits, attachment, garnishment, and delayed
    care. For tax-exempt hospitals, federal tax law requires financial-assistance safeguards before extraordinary
    collection actions; the operator tests whether those safeguards function in practice.
  posture: evidence_bound
