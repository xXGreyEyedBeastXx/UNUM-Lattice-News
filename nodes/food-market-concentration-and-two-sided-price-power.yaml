id: food-market-concentration-and-two-sided-price-power
title: Food-market concentration and two-sided price power
family: analysis_framework
subtype: essential_goods_market_power_operator
landing_status: landed
lifecycle_status: active
updated: 2026-08-17
summary:
  text: >-
    Investigates essential-food markets where concentrated buyers or processors may exercise power over suppliers
    while concentrated processors or retailers may also influence downstream prices. The operator tests both sides of
    the market and requires costs, margins, scale economies, entry conditions, and local/product market definition
    before promoting concentration into an extraction claim.
  posture: evidence_bound
current_evidence:
  - USDA_reports_four_largest_beef_packers_handle_about_85_percent_of_steer_and_heifer_purchases
  - USDA_reports_four_largest_pork_packers_handle_about_67_percent_of_hog_purchases
  - USDA_reviews_recent_evidence_that_reduced_competition_can_lower_cattle_prices
  - USDA_also_preserves_scale_economy_evidence_that_larger_plants_can_reduce_costs_and_consumer_prices
  - USDA_reports_county_level_food_retail_concentration_rose_94_percent_from_1990_to_2019
