  - local_or_product_market_definition
  - buyer_processor_or_packer's_market_share
  - price_paid_to_supplier
  - processing_cost_and_margin
  - wholesaler_or_distributor
  - retailer_market_share_and_margin
  - price_paid_by_consumer
