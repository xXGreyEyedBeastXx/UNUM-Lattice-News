locks:
  - Autism is not an actor and does not possess intent.
  - Autistic people are not reducible to a diagnosis, prevalence statistic, service market, or institutional account.
  - Disability, impairment, support need, identity, and environmental mismatch are related but not interchangeable.
  - Prevalence means identified prevalence within a defined surveillance method and population; it is not automatically national incidence.
  - Claims about causes, treatments, or harms require claim-specific evidence and must not be inherited from hashtag proximity.
