summary:
  text: >-
    Autism is a heterogeneous neurological and developmental condition associated
    with differences in communication, interaction, learning, behavior, sensory
    processing, interests, and support needs. It can be disabling, and disability
    may arise from intrinsic impairments, co-occurring conditions, environmental
    barriers, unmet support needs, or their interaction. No single institutional,
    medical, advocacy, or personal description exhausts autistic lived reality.
  posture: supported_inference

