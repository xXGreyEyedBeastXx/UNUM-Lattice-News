current_evidence:
  observed:
    - CDC ADDM data identified autism in about 1 in 31 eight-year-old children across 16 monitored US communities in 2022; the estimate is not a national census and varied substantially by site.
    - NIMH describes autism as a neurological and developmental disorder with a broad range of characteristics, needs, strengths, and challenges.
  stated:
    - Medical and federal sources commonly classify autism as a developmental disorder or disability.
    - Autistic people and advocacy organizations use varied identity, disability, and neurodiversity framings.
  supported_inferences:
    - Autism should be represented as a condition node rather than an actor, institution, population, or accusation.
    - A relation to autism does not establish identical impairment, support need, identity preference, or legal disability status for every autistic person.
  disputed:
    - Preferred terminology, causal framing, intervention goals, subgroup labels, and the balance between medical and neurodiversity models remain contested.
  unknowns:
    - A single prevalence estimate cannot determine why identification rates differ across communities.
  counterevidence: []

timeline:
  - date: 2025-04-15
