application_to_tennessee_education:
  working_hypothesis: >-
    Private-school subsidy beneficiaries may receive portable public fiscal capacity while public districts retain fixed and universal obligations and may lose future funding growth. The existence, magnitude, distribution, enforceability, and burden ratio of that loss must be measured district by district rather than assumed from statewide totals. Federal funding claims must also identify which Tennessee and federal officials controlled program participation, appropriations, tax-credit design, implementation, and public blame allocation.
  trace:
    - taxpayers_and_public_revenue
    - household_tax_burden_by_income
    - state_or_federal_routing_mechanism
    - federal_and_state_control_authority
    - family_private_school_or_scholarship_intermediary_gain
    - subsidy_value_relative_to_recipient_income
    - district_revenue_and_growth_effect
    - district_loss_as_percent_of_total_and_discretionary_revenue
    - fixed_cost_and_service_obligation_retention
    - affected_students_workers_and_communities
    - compensation_hold_harmless_or_unrepaired_loss
    - rhetoric_assigning_responsibility_elsewhere
safeguards:
  - Do not treat every gain as proof of another party's loss.
  - Do not treat every loss as enforced; distinguish voluntary exchange, shared sacrifice, and coercive transfer.
  - Do not hide tax expenditures by describing them as private donations when public revenue is forgone.
  - Do not equate hold-harmless floors with full compensation for future growth, fixed costs, or service obligations.
  - Preserve gross gain, gross loss, net transfer effect, timing, burden ratio, and affected population separately.
  - Trace both direct and opportunity-cost effects.
  - Do not let jurisdictional complexity erase actors who controlled or preserved the rule.
  - Do not infer total control from party label alone; require decision-specific evidence.
  - Do not use unrelated beneficial conduct as a credit against enforced loss.
relations:
  - type: EXTENDS
    target: harm-domination-protection-weighting
    posture: working_framework
unresolved_questions:
  - Which Tennessee districts lose future TISA growth under scholarship expansion, and by how much and what percentage of operating revenue?
  - Which costs remain fixed or increase as enrollment and revenue shift?
  - Which private schools, vendors, scholarship organizations, donors, and families capture the largest gains?
  - What proportion of subsidy spending expands access versus replacing private tuition families would otherwise have paid?
  - How do scholarship and tax-credit gains distribute across household income percentiles?
  - What percentage of income do Tennessee households contribute through sales, property, income-linked federal, and other taxes that support each route?
  - Which federal and Tennessee officials voted for, administered, opted into, preserved, or publicly blamed each funding mechanism?
  - How do disability access, rural access, segregation, staffing, and transportation costs change?
locks:
  - Gain and loss must be traced as separate but potentially coupled flows.
  - Policy-created opacity does not erase public causation.
  - Net aggregate balance must not erase concentrated local loss.
  - Dollar totals without capacity-relative percentages are incomplete.
  - Federal labeling does not erase state participation or federal actors' responsibility for rules they control.
  - Beneficiary gain is not moral goodness and cannot offset documented harm.
