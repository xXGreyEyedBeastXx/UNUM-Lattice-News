unresolved_questions:
  - Which Tennessee districts lose future TISA growth under scholarship expansion, and by how much and what percentage of operating revenue?
  - Which costs remain fixed or increase as enrollment and revenue shift?
  - Which private schools, vendors, scholarship organizations, donors, and families capture the largest benefits?
  - What proportion of subsidy spending expands access versus replacing private tuition families would otherwise have paid?
  - How do scholarship and tax-credit benefits distribute across household income percentiles?
  - What percentage of income do Tennessee households contribute through sales, property, income-linked federal, and other taxes that support each route?
  - Which federal and Tennessee officials voted for, administered, opted into, preserved, or publicly blamed each funding mechanism?
  - How do disability access, rural access, segregation, staffing, and transportation costs change?
locks:
  - Benefit and loss must be traced as separate but potentially coupled flows.
  - Policy-created opacity does not erase public causation.
  - Net statewide balance must not erase concentrated local loss.
  - Dollar totals without capacity-relative percentages are incomplete.
  - Federal labeling does not erase state participation or federal actors' responsibility for rules they control.
