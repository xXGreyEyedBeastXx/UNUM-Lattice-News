application_to_tennessee_education:
  working_hypothesis: >-
    Private-school subsidy beneficiaries may receive portable public fiscal capacity
    while public districts retain fixed and universal obligations and may lose future
    funding growth. The existence, magnitude, distribution, enforceability, and burden
    ratio of that loss must be measured district by district rather than assumed from
    statewide totals. Federal funding claims must also identify which Tennessee and
    federal officials controlled program participation, appropriations, tax-credit
    design, implementation, and public blame allocation.
  trace:
    - taxpayers_and_public_revenue
    - household_tax_burden_by_income
    - state_or_federal_routing_mechanism
    - federal_and_state_control_authority
    - family_private_school_or_scholarship_intermediary_benefit
    - subsidy_value_relative_to_recipient_income
    - district_revenue_and_growth_effect
    - district_loss_as_percent_of_total_and_discretionary_revenue
    - fixed_cost_and_service_obligation_retention
    - affected_students_workers_and_communities
    - compensation_hold_harmless_or_unrepaired_loss
    - rhetoric_assigning_responsibility_elsewhere
safeguards:
  - Do not treat every benefit as proof of another party's loss.
  - Do not treat every loss as enforced; distinguish voluntary exchange, shared sacrifice, and coercive transfer.
  - Do not hide tax expenditures by describing them as private donations when public revenue is forgone.
  - Do not equate hold-harmless floors with full compensation for future growth, fixed costs, or service obligations.
  - Preserve gross benefit, gross loss, net effect, timing, burden ratio, and affected population separately.
  - Trace both direct and opportunity-cost effects.
  - Do not let jurisdictional complexity erase actors who controlled or preserved the rule.
  - Do not infer total control from party label alone; require decision-specific evidence.
relations:
  - type: EXTENDS
    target: harm-domination-protection-weighting
    posture: working_framework
  - type: APPLIES_TO
