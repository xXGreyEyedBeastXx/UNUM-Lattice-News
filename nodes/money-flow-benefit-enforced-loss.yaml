id: money-flow-benefit-enforced-loss
title: Money flow, beneficiary gain, and enforced loss
family: analysis_framework
subtype: resource_distribution_operator
landing_status: landed
lifecycle_status: active
updated: 2026-08-13
legacy_classification:
  family: causal_ethical_field
  subtype: resource_distribution_operator
  source_branch: reconcile-node-schema-v0-1
summary:
  text: >-
    A distributional operator for tracing who receives money, subsidy, tax advantage, service expansion, asset appreciation, political access, or institutional capacity, and who is compelled to absorb revenue loss, fixed costs, reduced service, risk, debt, displacement, exclusion, or diminished future capacity. It distinguishes voluntary cost, ordinary tradeoff, and enforced loss created through law, taxation, funding formulas, contract structure, or policy design. Dollar totals should be paired with burden ratios showing the share of household income, district revenue, operating capacity, or taxable base affected.
  posture: working_framework
terminology_lock:
  beneficiary: >-
    A participant receiving an evidenced material, financial, legal, political, access, authority, or institutional gain from the mechanism under study. This is a distributional term, not moral praise and not an offset against harm.
  benefit: >-
    A measurable gain produced by or routed through the mechanism under study. Unrelated beneficial conduct by an actor is outside this operator and does not reduce documented harm.
core_question: >-
  Does one participant's gain depend upon another participant or public system being forced to absorb a loss, who had authority to impose or preserve that transfer, and how large is the burden relative to the affected participant's actual capacity?
gain_fields:
  - direct_payment
  - subsidy
  - tax_credit_or_tax_expenditure
  - increased_revenue
  - reduced_cost
  - asset_appreciation
  - market_access
  - administrative_fee
  - political_access
  - political_or_institutional_capacity
  - authority_or_insulation_gain
  - future_growth_capture
loss_fields:
  - direct_revenue_loss
  - foregone_tax_revenue
  - reduced_future_funding_growth
  - stranded_or_fixed_costs
  - service_reduction
  - staffing_loss
  - infrastructure_underuse
  - debt_or_deficit_transfer
  - increased_user_cost
  - exclusion_or_access_loss
  - rights_or_agency_loss
  - transferred_risk
  - diminished_future_capacity
burden_ratio_fields:
  - household_cost_as_percent_of_gross_income
  - household_cost_as_percent_of_disposable_income
  - tax_or_fee_as_percent_of_income
  - subsidy_value_as_percent_of_recipient_income
  - district_loss_as_percent_of_total_revenue
  - district_loss_as_percent_of_discretionary_revenue
  - district_loss_as_percent_of_local_tax_base
  - federal_funding_as_percent_of_total_district_revenue
  - fixed_costs_as_percent_of_post_transfer_revenue
  - service_loss_as_percent_of_prior_capacity
  - gain_as_percent_of_beneficiary_revenue_or_assets
  - cumulative_multi_year_burden
burden_rules:
  - Equal dollar amounts do not represent equal burdens across unequal incomes, tax bases, bargaining power, legal status, or operating margins.
  - Use disposable income where essential costs materially constrain real capacity.
  - Preserve median, distribution, and subgroup burdens rather than relying only on statewide averages.
  - Distinguish nominal percentage from effective burden after credits, exemptions, debt, transportation, tuition gaps, and required service costs.
  - Report concentrated district, household, population, or ecological losses even when an aggregate percentage appears small.
enforced_loss_test:
  examine:
    - who made or preserved the decision
    - whether affected participants consented
    - whether exit was realistic
    - whether the loss was avoidable
    - whether law or policy compelled the transfer
    - whether fixed obligations remained after revenue moved
    - whether the beneficiary could externalize costs
    - whether the affected system retained universal service duties
    - whether the transfer was transparent and reviewable
    - whether repair or compensation existed
    - how large the burden was relative to income, revenue, reserves, rights, bargaining capacity, and required obligations
causal_pattern:
  - public_collective_or_private_resource
  - policy_contract_or_power_routing_decision
  - beneficiary_receives_gain
  - affected_participant_system_or_ecology_absorbs_loss
  - accountability_compensation_or_correction_returns_or_fails_to_return
federal_control_attribution:
  purpose: >-
    Prevent officials from treating federal taxes, grants, conditions, contracts, or tax-credit mechanisms as external natural forces when they or their political coalition hold material control over legislation, appropriations, executive agencies, rulemaking, waivers, enforcement, appointments, litigation posture, or state opt-in decisions.
  trace_fields:
    - federal_legislative_control
    - federal_executive_control
    - relevant_agency_control
    - appropriations_authorship_and_votes
    - rulemaking_and_waiver_authority
    - state_opt_in_or_opt_out_authority
    - litigation_or_non_enforcement_choice
    - party_alignment_across_state_and_federal_levels
    - public_rhetoric_assigning_blame
    - actual_decision_authority
  attribution_rules:
    - Federal origin does not mean no local or state agency; trace state acceptance, matching requirements, implementation, and discretionary routing.
    - Party control does not prove personal authorship; identify the specific vote, appointment, rule, waiver, budget, or implementation choice.
    - Officials may not plausibly cite federal constraints as wholly external when they helped create, maintain, administer, or decline to change them.
    - Distinguish inherited constraint from actively preserved constraint.
    - Distinguish lack of unilateral control from lack of responsibility or influence.
relation_types:
