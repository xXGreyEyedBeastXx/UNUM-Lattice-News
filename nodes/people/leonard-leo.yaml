harm_audit_questions:
  - Which organizations, donors, nomination pipelines, media campaigns, and confirmation operations did Leo materially coordinate or route?
  - Which justices or judicial candidates received access, advocacy, travel, event, or network support through Leo-linked institutions?
  - Which funding flows created durable legal advocacy, selection, litigation, or influence capacity?
  - Which Court decisions or recusals involved actors with documented network relationships, and what can actually be established about influence?
locks:
  - Network influence is not automatic proof of control over a justice or a particular ruling.
  - Financial, travel, appointment, advocacy, donor, and ideological relations must be traced separately.
  - Ideological conservatism is not itself a harm edge; responsibility attaches to evidenced mechanisms and consequences.
  - Unrelated charitable, civic, or professional conduct does not offset a documented harmful or accountability-relevant mechanism.
