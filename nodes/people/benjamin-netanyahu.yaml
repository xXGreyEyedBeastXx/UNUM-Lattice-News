locks:
  - Netanyahu != State of Israel != Israeli population != Jewish people.
  - Hebrew != truth by default; English != lie by default.
  - Audience divergence != proven deception unless motive is separately evidenced.
  - Material contradiction must not be downgraded to mere tonal difference.
  - Rhetoric != policy != order != implementation != effect.
  - Official denial is a stated position, not claim-defeating evidence unless independently supported evidence gives it that function.
  - Favorable or less-inflammatory rhetoric is NON_RESPONSIVE to unrelated harm, policy, command or implementation claims.
  - ICC warrant-stage reasonable-grounds finding != conviction.
