current_evidence:
  observed:
    - Netanyahu directs or participates in high-level Israeli security, war and territorial policy through the prime-ministerial authority seat.
    - His Hebrew domestic and English international public records contain documented cases of materially divergent policy presentation.
  stated:
    - Netanyahu has repeatedly framed Gaza operations as necessary to defeat/disarm Hamas and prevent future threats.
    - He has publicly rejected Palestinian statehood in multiple recent domestic and parliamentary settings.
    - He has described post-October-7 Israeli security doctrine as moving security envelopes inside Gaza, Lebanon and Syria.
  adjudicated:
    - The ICC Pre-Trial Chamber issued an arrest warrant after finding reasonable grounds within the warrant standard concerning alleged crimes and civilian-superior responsibility; this is not a conviction.
  alleged: []
  supported_inferences:
    - Audience, venue, diplomatic pressure, electoral pressure and coalition pressure are relevant variables when interpreting Netanyahu's public messaging.
  disputed:
    - Netanyahu and the Israeli government dispute major international allegations/findings concerning war crimes, genocide, civilian targeting and unlawful conduct.
  ambiguous:
    - The degree to which any specific audience divergence reflects strategic deception, genuine reversal, coalition management, legal positioning or changed circumstances must be traced separately.
  unknowns:
    - Complete paired Hebrew/English corpus for 2023-2026 has not yet been compiled.
    - Full order-by-order responsibility chain for all documented civilian-targeting and territorial-control practices remains incomplete.
  missing_or_withheld: []
  evidence_effects:
    - evidence_ref: source-netanyahu-audience-differentiated-framing-2015-2026
      target: claim:netanyahu-english-messaging-uniformly-sanitized
      function: CLAIM_DEFEATING
      effect: >-
        Some official English-language Netanyahu statements are themselves highly explicit about territorial-security
        doctrine. This defeats the absolute claim that English messaging is uniformly sanitized. It does not offset,
        mitigate or weaken separately evidenced policy, command, implementation, harm, territorial-control or
        accountability claims.

evidence_extensions:
  audience_divergence:
    - id: 2015-palestinian-statehood
      posture: MATERIAL_POLICY_PRESENTATION_DIVERGENCE
      summary: >-
        Hebrew domestic pre-election statement rejected a Palestinian state while he remained prime minister; three days later an English NBC interview stated support for a sustainable peaceful two-state solution while denying a policy change.
      source: source-netanyahu-audience-differentiated-framing-2015-2026
    - id: 2023-2024-gaza-displacement
      posture: MATERIAL_POLICY_PRESENTATION_DIVERGENCE
      summary: >-
        Hebrew Likud-meeting remarks were reported as Netanyahu actively working on voluntary migration and seeking recipient countries; shortly afterward an English international-facing message stated Israel had no intention of displacing Gaza's civilian population.
      source: source-netanyahu-audience-differentiated-framing-2015-2026
    - id: 2025-back-to-back-pressers
      posture: AUDIENCE_DIFFERENTIATED_FRAMING
      summary: >-
        Same-day English and Hebrew press conferences emphasized different legitimating frames: international denial/rebuttal versus domestic victory/continuation messaging.
      source: source-netanyahu-audience-differentiated-framing-2015-2026
  command_and_accountability:
    - id: icc-civilian-superior-responsibility
      posture: COMMAND_RESPONSIBILITY_FINDING
