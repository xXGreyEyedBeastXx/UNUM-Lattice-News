summary:
  text: >-
    U.S. health-policy authority node whose autism rhetoric and actions in the recovered 2025-2026 research materially shaped federal causal framing, research priorities, data use, treatment priorities, and public understanding. This harm-audit node focuses on unsupported causal claims, research-direction pressure, privacy/data risks, pathologizing framing, and downstream public-health consequences rather than a net biography.
  posture: observed_with_legacy_source_gaps
aliases: [RFK Jr., Robert F. Kennedy Jr.]
hashtags: [RFKJr, HHS, AutismPolicy, AutismRhetoric, MAHA]
current_evidence:
  observed:
    - The recovered node records public framing of autism as an epidemic, preventable disease, and environmentally caused.
    - The recovered node records federal initiatives focused on autism etiology, prevention, treatment pathways, and large-scale data analysis.
  stated:
    - Recovered HHS/RFK rhetoric emphasizes root causes, prevention, treatment, care, gold-standard science, and answers for families.
  supported_inferences:
    - The recovered agenda gives prevention and causal discovery greater emphasis than accommodation, rights, services, or autistic self-determination.
  disputed:
    - Claims that rising identified prevalence proves an epidemic caused generally by an environmental toxin or vaccine-related mechanism.
  unknowns:
    - Final research priorities, grant allocations, privacy safeguards, participation structure, and whether research design will genuinely discriminate among competing hypotheses.
  claim_specific_counterevidence:
    - Identified prevalence is not biological incidence by itself.
    - The recovered CDC/NIMH records do not support a singular causal inference from prevalence change.
    - The recovered Reuters policy-watch source says prior large studies did not establish a credible vaccine-autism causal link.
