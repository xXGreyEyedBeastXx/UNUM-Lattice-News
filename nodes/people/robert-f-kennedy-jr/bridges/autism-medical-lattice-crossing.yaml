harm_questions:
  - Does conflating autism with intellectual disability, language impairment, medical comorbidity, and adaptive support needs distort the target of causal research?
  - Does catastrophic population rhetoric increase stigma toward autistic people as a class?
  - Are identifiable and treatable co-occurring conditions obscured when their effects are attributed generically to autism?
  - Are research attention or resources displaced away from present-life support, medical care, and quality-of-life questions toward broad cause-and-prevention agendas?
  - Does prevention rhetoric aimed at a highly heritable neurodevelopmental phenotype create an ethically recognizable eugenic pathway even absent an announced reproductive policy?
locks:
  - Autism, intellectual disability, language impairment, medical comorbidity, and adaptive-function outcome must not be collapsed into one variable.
  - Eugenic-risk analysis does not establish private eugenic intent or an announced eugenics program.
  - Legitimate research into defined environmental exposures or defined subgroups remains distinct from a broad claim that autism generally is a preventable modern environmental disease.
  - Medical evidence should be anchored in UNUM-Medical and linked rather than rhetorically reproduced without provenance.
next_stitches:
  - HHS autism prevalence/intellectual-disability framing versus underlying CDC categories
  - RFK/HHS prevention language and root-cause research agenda
  - diagnostic-overshadowing literature and treatable co-occurring conditions
  - autism research allocation and opportunity-cost evidence
  - vaccine-policy consequences where autism rhetoric is used as causal support
