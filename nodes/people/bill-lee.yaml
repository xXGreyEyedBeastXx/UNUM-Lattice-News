    Lee repeatedly uses freedom, family, local-control, and opportunity framing while exercising centralized state power in ways that may expand discretion and public-resource gain for favored private, religious, market, or politically aligned institutions and route retained obligation, enforcement, or loss toward public systems and participants with fewer exit options.
  status: supported_hypothesis_requires_case_by_case_trace
claim_specific_counterevidence_and_limits:
  - Executive office alone does not prove authorship of every agency or legislative action.
  - Personal impressions and private encounters are context, not public evidentiary proof.
  - Favoritism or quid pro quo requires procurement, access, donor, contract, and decision-specific evidence.
