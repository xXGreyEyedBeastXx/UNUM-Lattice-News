title: Portfolio-level climate moral hazard
family: analysis_framework
subtype: cross_sector_externality_and_return_operator
landing_status: proposed_investigation_node
lifecycle_status: active
updated: 2026-08-17
summary:
  text: >-
    Investigates whether a diversified capital holder, asset manager, conglomerate, insurer,
    creditor, or other ownership seat can remain exposed to activities that generate climate
    externalities while simultaneously holding or controlling businesses that receive repair,
    replacement, adaptation, scarcity, reconstruction, land-appreciation, or concentrated-market
    returns from consequences of the same externality. The node measures the whole circuit without
    treating cross-sector ownership as proof of specific harmful intent or treating diversified
    ownership as economically irrelevant.
  posture: supported_working_framework

core_question: >-
  Does diversification, governance capacity, direct corporate integration, insurance, public
  backstops, market power, or capital mobility allow a capital seat to hedge or capture climate
  consequences more successfully than households, workers, tenants, small farmers, communities,
  governments, or ecosystems that bear the physical loss?

