summary:
  text: >-
    Investigative operator for tracing when public money, public credit, diplomacy, security assistance,
    covert action, development finance, export finance, infrastructure, or political influence is used
    to secure access to resources, supply chains, export markets, or commercial terms abroad, while
    material, ecological, political, or coercive burdens are borne primarily by local populations.
    The operator distinguishes development benefit from extraction rather than assuming either one.
  posture: working_framework
