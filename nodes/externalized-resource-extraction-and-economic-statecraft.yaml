required_questions:
  - What public exposure was committed, obligated, disbursed, guaranteed, insured, or placed at risk?
  - What resource or market access was an explicit or implicit strategic objective?
  - Which foreign political actors, state-owned enterprises, private firms, traders, and investors control the deal?
  - What local value remains through wages, taxes, royalties, ownership, infrastructure, procurement, technology transfer, and downstream processing?
  - What value leaves through extraction, transfer pricing, debt service, dividends, offtake, management fees, procurement, or imported inputs?
  - What harms or risks fall on workers, displaced residents, Indigenous or rural communities, civilians, ecosystems, or future generations?
  - Does security or political support strengthen actors who can suppress local opposition or bargaining?
  - Who owns the corporate claims that capture the downstream gain?
locks:
  - Foreign aid, development finance, export finance, security assistance, and private investment are distinct accounting seats but may participate in one mesh.
  - Public financing is not synonymous with a grant or budget outlay; distinguish loans, guarantees, equity, insurance, and contingent exposure.
  - Host-country jobs, infrastructure, taxes, royalties, or lower transport costs are real benefits when evidenced; they do not terminate the extraction trace.
  - Corporate participation does not prove that the project is harmful; distribution, constraint, and burden must be measured.
  - Anti-communist, national-security, development, or supply-chain rationales may coexist with commercial interests; do not erase one because another is present.
  - Historical evidence of regime intervention does not prove identical present-day conduct.
