summary:
  text: >-
    Donald Trump's former personal attorney and former White House counselor whose attempted and disputed placement as New Jersey's top federal prosecutor illustrates the conversion of personal loyalty into federal prosecutorial authority.
  posture: observed
aliases: [Alina Saad Habba]
hashtags: [Trump, DOJ, ProsecutorialPower, Loyalty, NewJersey]
current_evidence:
  observed:
    - Trump appointed Habba Counselor to the President after praising her loyalty and legal defense of him.
    - Trump later installed her as interim U.S. attorney for the District of New Jersey.
    - Her permanent nomination was withdrawn after Senate and judicial resistance.
    - DOJ attempted procedural maneuvers to retain her; a federal appeals court later ruled the acting appointment unlawful.
  stated:
    - Trump described her as unwaveringly loyal and a defender against alleged lawfare.
  supported_inferences:
    - Habba is a high-confidence Trump personal-loyalty and prosecutorial-power node.
    - Her placement is relevant to selective enforcement, retaliation, appointment safeguards, and institutional capture analysis.
  disputed:
    - The legality and legitimacy of the appointment maneuvers were contested and litigated.
  unknowns:
    - Her current formal DOJ role after the appellate ruling.
    - Whether she has any material Israel-policy role beyond general alignment with the Trump administration.
  counterevidence:
    - Current reviewed sources do not establish a strong direct Israel-policy, Zionist-organizational, or Gaza-policy connection comparable to Huckabee, Graham, Rubio, Witkoff, Kushner, or Hegseth.
timeline:
  - date: 2024-12-08
    event: Trump announced Habba as Counselor to the President.
  - date: 2025-03-28
    event: Sworn in as interim U.S. attorney for the District of New Jersey.
  - date: 2025-07-24
    event: Permanent nomination withdrawn amid appointment dispute.
  - date: 2025-12-01
    event: Federal appeals court ruled the maneuver keeping her as acting U.S. attorney unlawful.
