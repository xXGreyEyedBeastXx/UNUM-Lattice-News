summary:
  text: >-
    Palestinian civilian residents of the occupied West Bank including East Jerusalem, preserved separately from
    Palestinian armed actors and political institutions. Current evidence documents settlement expansion, settler
    and military violence, land and movement restrictions, demolitions, forced displacement, detention and other
    coercive conditions. The 2026 UN Commission found violent settler activity functioning as a means of Israeli
    State policy toward settlement entrenchment, annexation and Palestinian displacement.
