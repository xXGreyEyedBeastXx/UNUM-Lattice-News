locks:
  - Decomposition must recompose.
  - Legal recipient != terminal economic beneficiary.
  - Worker benefit != employer capture, but worker benefit also != proof that the employer receives no indirect economic benefit.
  - Profit != wrongdoing, and lawful compensation != adequacy.
  - Executive pay, worker pay, public assistance, and shareholder return may be compared in one corporate circuit without asserting that one dollar literally moved from one named person to another.
  - Ownership concentration changes the distribution of corporate returns and must not be omitted from the terminal seat.
  - A corporation may create genuine public value while simultaneously participating in extractive or externalizing mechanisms; both remain traceable.
