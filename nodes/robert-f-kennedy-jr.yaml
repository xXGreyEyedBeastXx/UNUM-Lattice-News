summary:
  text: U.S. Secretary of Health and Human Services whose autism policy rhetoric and actions materially shape federal research, public-health framing, data use, treatment priorities, and public understanding.
  posture: observed

aliases: [RFK Jr., Robert F. Kennedy Jr.]
hashtags: [RFKJr, HHS, AutismPolicy, AutismRhetoric, MAHA]

current_evidence:
  observed:
    - As HHS Secretary, publicly framed autism as an epidemic and preventable disease and asserted an environmental cause.
    - Directed or supported federal initiatives focused on autism etiology, prevention, treatment pathways, and large-scale data analysis.
  stated:
    - Says HHS seeks root causes, prevention, treatment, care, gold-standard science, and answers for families.
  supported_inferences:
    - The public rhetoric gives prevention and causal discovery greater emphasis than accommodation, rights, services, or autistic self-determination.
  disputed:
    - Claims that rising identified prevalence proves an epidemic caused by an environmental toxin.
  unknowns:
    - How final research priorities, grant allocations, privacy safeguards, and autistic participation will be implemented.
  counterevidence:
    - CDC and independent experts attribute much of the rise in identified prevalence to broader recognition, diagnostic criteria, screening, and service access; autism has multiple known and suspected contributors, including substantial genetic influence.

timeline:
  - 2025-04-16: Publicly characterized autism as a real epidemic, preventable disease, and environmentally caused.
  - 2025-05-07: HHS announced NIH-CMS data partnership focused first on autism root-cause research.
  - 2025-09-22: HHS announced autism initiatives involving treatment, acetaminophen guidance, and NIH data-science awards.
  - 2026-01-28: Appointed a new Interagency Autism Coordinating Committee.

