summary:
  text: >-
    Investigative operator for tax-code provisions, business deductions, credits, accelerated
    depreciation, research expensing, preferential income treatment, and related measures that reduce
    public revenue while leaving private ownership and upside intact. It compares these supports with
    household-level spending cuts and distributional effects without treating every tax expenditure as
    corporate welfare.
  posture: working_framework
