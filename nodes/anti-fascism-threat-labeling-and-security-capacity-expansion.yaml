summary:
  text: >-
    Investigative operator for cases where violent acts attributed to anti-fascist actors are used to
    expand a broader security frame around self-described anti-fascism, anti-capitalism, associated
    networks, funding, or protected political activity. It requires criminal conduct, ideology,
    association, financing, and nonviolent protest to remain separately typed while tracing any
    resulting expansion of investigative, prosecutorial, grant, surveillance, or administrative power.
  posture: working_framework
principle_level_orientation: >-
  Antifascism is opposition to fascist domination. At the principle seat, that opposition is compatible with
  and can function in defense of democratic conditions such as plural political life, equal political standing,
  association, accountable government, and peaceful removability of rulers. This does not classify every actor,
  organization, tactic, or act using an antifascist label as democratic, lawful, defensive, or harmless.
