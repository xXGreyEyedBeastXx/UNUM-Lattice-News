locks:
  - Do not collapse chattel slavery, prison labor, benefit work requirements, ordinary employment, taxation, and regulation into one legal category.
  - Do compare their constraint envelopes, enforcement mechanisms, exit costs, extracted value, and power effects where the same structural question recurs.
  - Formal choice is evidence about legal form, not proof of meaningful freedom.
  - State authority is not literal ownership of persons; ownership language must be typed as structural or legal rather than silently switched between the two.
  - The relevant moral and causal question is how much meaningful agency remains over one's body, labor, necessities, movement, livelihood, and political redress.
