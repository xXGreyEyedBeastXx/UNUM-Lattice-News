  text: >-
    Traces how large data centers receive tax treatment, impose new electric-load infrastructure needs, and may
    create cost-shift risks for utilities and other customers. Tennessee's 2026 Public Chapter 961 is treated as
    a corrective rule and evidence of recognized cost-allocation risk, not proof of prior actor-specific abuse.
