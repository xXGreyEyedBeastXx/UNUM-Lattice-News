locks:
  - Direction of effect != proof of motive.
  - Fetal-protection rationale != absence of autonomy loss to the pregnant person.
  - Convergence != coordination.
  - Lack of central command != absence of a recurring system-level pattern.
  - Child marriage != rape in every case.
  - Minimum marriage age != age of consent.
  - A legal exception on paper != practical access in every case.
