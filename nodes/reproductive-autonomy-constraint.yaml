id: reproductive-autonomy-constraint
title: Reproductive Autonomy Constraint
entity_type: concept
actor_roles: []
status: seed
updated: 2026-08-17
summary:
  text: >-
    A cross-case analytical node for laws, policies, institutions, or movement strategies that reduce a person's
    practical or legal ability to decide whether to continue a pregnancy, avoid pregnancy, obtain pregnancy-related
    care, or exit reproductive consequences imposed through coercion or abuse. This node records direction of effect,
    not a single ideology, actor, or motive. Anti-abortion laws are reproductive-autonomy constraints by legal effect
    because they restrict termination choices even when supporters describe their motive as protecting fetal life.
  posture: supported inference
