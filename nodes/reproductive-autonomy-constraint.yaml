unresolved_questions:
  - Which policy networks repeatedly produce autonomy-reducing laws across jurisdictions?
  - Which mechanisms most strongly affect minors who are pregnant from rape, incest, or other abuse?
  - Where are formally available exceptions practically inaccessible because of reporting, gestational, provider, travel, parental-control, or cost barriers?
