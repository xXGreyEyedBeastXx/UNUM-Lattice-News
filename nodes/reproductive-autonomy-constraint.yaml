current_evidence:
  observed: []
  stated: []
  adjudicated: []
  alleged: []
  supported_inferences:
    - Abortion prohibitions and early gestational limits reduce legal control over whether a pregnancy continues.
    - Absence or narrowness of rape/incest exceptions can force or pressure survivors, including minors, to continue pregnancies resulting from sexual violence unless another exception or out-of-state option is available.
    - Parental-consent and anti-transport provisions can further restrict a minor's ability to obtain abortion care independently of a parent or guardian.
    - Child-marriage rules and marital exemptions to statutory-rape law can reduce sexual-autonomy protection where conduct that would otherwise be criminal becomes lawful or harder to prosecute through marriage.
    - These mechanisms can converge on the same autonomy-reducing outcome without proving a single coordinator or identical motive.
  disputed: []
  ambiguous:
    - The causal relation between any specific ideology and any specific law must be separately traced through sponsors, organizations, donors, legal networks, rhetoric, or other evidence.
  unknowns: []
  missing_or_withheld: []
  counterevidence:
    - Some jurisdictions strengthen rape/incest exceptions, raise marriage ages, remove marital exemptions, or otherwise increase survivor autonomy; these are genuine countervailing mechanisms and should remain visible.
