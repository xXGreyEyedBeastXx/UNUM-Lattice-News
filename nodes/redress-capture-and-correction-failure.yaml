violence_prevention_lock: >-
  Repeated harm plus failed redress can increase the risk that people abandon legitimate correction
  paths, but this does not make violence inevitable, justified, or responsibility-free. The mesh
  should expose correction failure early enough to strengthen voting, organizing, litigation,
  regulation, journalism, labor action, and other nonviolent return paths.
priority_current_lane:
