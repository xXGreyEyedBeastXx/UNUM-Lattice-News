    Operator for tracing whether institutions and practices that should return harm to its source or
    permit peaceful democratic correction remain functional, or are captured, defunded, intimidated,
    bypassed, delayed, rendered noncompliant, deprived of quorum, made inaccessible, or converted into
    legitimacy theater.
