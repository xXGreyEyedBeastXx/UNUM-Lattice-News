  - healthcare_regulatory_and_court_enforcement
  - labor_and_union_redress
  - corporate_regulatory_capture
  - executive_noncompliance_or_bypass
locks:
  - A bad outcome does not prove the redress channel was captured; trace the mechanism.
  - Settlement is not automatically abandonment or success.
  - Stay is not shutdown.
  - Official oversight is not automatically independent.
  - Continued scrutiny is not automatically adequate scrutiny.
