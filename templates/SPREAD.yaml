locks:
  - Evidence updates only the claim, edge, or variable it actually bears on.
  - Successful resistance is not counterevidence to the existence of an attempted objective.
  - Laundering labels require a traced transformation, not rhetorical resemblance.
  - MONEY_LAUNDERING_LEGAL_CLAIM requires legal evidentiary grounding.
  - LITERAL_LAUNDRY is just laundry.
