locks:
  - Evidence updates only the claim, edge, or variable it actually bears on.
  - Successful resistance is not counterevidence to the existence of an attempted objective.
  - Intentional action or term-setting is distinct from harmful-endpoint intent.
  - Capacity to know is distinct from actual knowledge; deliberate avoidance requires evidence.
  - Uncertainty about motive or knowledge must not erase independently supported mechanism, outcome, loss, gain, or beneficiary edges.
  - Candidate node family/subtype is a classification proposal, not a finding about role, guilt, intent, or harm.
  - Laundering labels require a traced transformation, not rhetorical resemblance.
  - MONEY_LAUNDERING_LEGAL_CLAIM requires legal evidentiary grounding.
  - LITERAL_LAUNDRY is just laundry.
