locks:
  - Node inclusion is not an accusation.
  - New node identity uses canonical family/subtype; legacy entity_type is migration-only.
  - Evidence updates only the edge or variable it actually bears on.
  - Successful resistance does not erase an attempted objective.
  - Entity identity is not the same as event role or authority seat.
  - Victim or survivor is a relational role, not a total identity.
  - Authority changes capacity and provenance, not truth value.
  - Greater power may increase capacity to know, prevent, correct, and repair; it does not automatically prove knowledge or guilt.
  - Intentional action or term-setting is distinct from intent to cause every downstream harm.
  - Capacity to know is distinct from actual knowledge; deliberate avoidance requires evidence.
  - Alleged is not false; unknown is not absent; adjudicated is not metaphysical certainty.
  - Benefit from an outcome is not proof of causation.
  - Consequential relations require recoverable evidence.
  - MONEY_LAUNDERING_LEGAL_CLAIM requires legal evidentiary grounding.
  - LITERAL_LAUNDRY is not an investigative laundering inference.
