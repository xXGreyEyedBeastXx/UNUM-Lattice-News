name: privacy-history-audit

on:
  push:
    paths:
      - '.github/workflows/privacy-history-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan reachable Git history without printing secret values
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import ipaddress
          import os
          import re
          import subprocess
          from collections import Counter

          repo = os.environ.get('GITHUB_REPOSITORY', '')

          patterns = [
              ('private_key', re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----')),
              ('openai_key', re.compile(r'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b')),
              ('github_token', re.compile(r'\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b')),
              ('aws_access_key', re.compile(r'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b')),
              ('bearer_token', re.compile(r'(?i)\bBearer\s+[A-Za-z0-9._~+/=-]{20,}')),
              ('password_assignment', re.compile(r'(?i)\b(?:password|passwd|pwd)\b\s*[:=]\s*["\']?([^\s"\']{4,})')),
              ('secret_assignment', re.compile(r'(?i)\b(?:api[_-]?key|access[_-]?token|auth[_-]?token|secret[_-]?key|client[_-]?secret)\b\s*[:=]\s*["\']?([^\s"\']{8,})')),
              ('credential_url', re.compile(r'(?i)\b[a-z][a-z0-9+.-]*://[^\s:/@]+:[^\s/@]+@[^\s]+')),
              ('email', re.compile(r'(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b')),
              ('username_assignment', re.compile(r'(?i)\b(?:username|user_name|login)\b\s*[:=]\s*["\']?([^\s"\']{2,})')),
              ('ipv4', re.compile(r'(?<!\d)(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?!\d)')),
          ]

          placeholder_tokens = {
              'example', 'placeholder', 'your_', 'your-', 'replace_me', 'changeme',
              'dummy', 'sample', 'testtoken', 'test_token', 'not_a_real', 'redacted',
              'openai_api_key', 'anthropic_api_key', 'api_key_here', 'token_here',
              'password_here', 'secret_here', '${', '<', '...'
          }

          def classify_placeholder(raw):
              low = raw.lower()
              return any(tok in low for tok in placeholder_tokens)

          def severity(kind, raw):
              if classify_placeholder(raw):
                  return 'placeholder'
              if kind in {'private_key', 'openai_key', 'github_token', 'aws_access_key', 'bearer_token', 'credential_url'}:
                  return 'high'
              if kind in {'password_assignment', 'secret_assignment'}:
                  return 'high'
              if kind == 'ipv4':
                  try:
                      ip = ipaddress.ip_address(raw)
                      if ip.is_loopback:
                          return 'loopback'
                      if ip.is_private:
                          return 'private_ip'
                      if ip.is_link_local:
                          return 'link_local'
                      return 'public_ip'
                  except Exception:
                      return 'low'
              if kind in {'email', 'username_assignment'}:
                  return 'identity'
              return 'medium'

          raw = subprocess.check_output(['git', 'rev-list', '--objects', '--all'], text=True, errors='ignore')
          seen_blobs = set()
          findings = []

          for row in raw.splitlines():
              if not row.strip():
                  continue
              parts = row.split(' ', 1)
              sha = parts[0]
              path = parts[1] if len(parts) > 1 else '[no-path]'
              if path == '.privacy_audit/history_findings.tsv':
                  continue
              try:
                  typ = subprocess.check_output(['git', 'cat-file', '-t', sha], text=True, stderr=subprocess.DEVNULL).strip()
              except subprocess.CalledProcessError:
                  continue
              if typ != 'blob' or sha in seen_blobs:
                  continue
              seen_blobs.add(sha)
              try:
                  size = int(subprocess.check_output(['git', 'cat-file', '-s', sha], text=True).strip())
              except Exception:
                  continue
              if size > 2_000_000:
                  continue
              try:
                  data = subprocess.check_output(['git', 'cat-file', '-p', sha], stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              if b'\x00' in data[:8192]:
                  continue
              text = data.decode('utf-8', errors='ignore')
              for kind, rx in patterns:
                  for m in rx.finditer(text):
                      raw_match = m.group(0)
                      sev = severity(kind, raw_match)
                      line = text.count('\n', 0, m.start()) + 1
                      fp = hashlib.sha256(raw_match.encode('utf-8', errors='ignore')).hexdigest()[:16]
                      findings.append((sev, kind, sha, path, line, fp))

          findings = sorted(set(findings), key=lambda x: (x[0], x[1], x[3], x[4], x[2]))
          counts = Counter((sev, kind) for sev, kind, *_ in findings)
          os.makedirs('.privacy_audit', exist_ok=True)
          out = '.privacy_audit/history_findings.tsv'
          with open(out, 'w', encoding='utf-8') as f:
              f.write('# privacy-history-audit\n')
              f.write('# raw matched values intentionally omitted\n')
              f.write(f'# repository\t{repo}\n')
              for (sev, kind), count in sorted(counts.items()):
                  f.write(f'# count\t{sev}\t{kind}\t{count}\n')
              f.write('severity\tkind\tblob_sha\tpath\tline\tfingerprint\n')
              for row in findings:
                  f.write('\t'.join(map(str, row)) + '\n')
          print(f'Wrote redacted audit report with {len(findings)} findings.')
          PY

      - name: Commit redacted audit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .privacy_audit/history_findings.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add redacted privacy history audit report [skip ci]'
          git push origin HEAD:main
