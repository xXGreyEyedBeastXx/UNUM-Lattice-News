federal_case_surfaces:
  unsanctioned_foreign_boycotts:
    current_state: ACTIVE
    mechanism:
      - federal_rules_discourage_or_prohibit_US_person_support_for_unsanctioned_foreign_boycotts
      - reporting_to_BIS
      - tax_reporting_and_possible_loss_of_tax_benefits
      - administrative_or_criminal_penalties_in_covered_cases
    primary_current_target:
      - Arab_League_boycott_of_Israel
    analytical_significance: >-
      Federal law explicitly distinguishes sanctioned from unsanctioned boycott participation. The legal
      question is therefore not whether government ever regulates economic refusal, but which actor, target,
      foreign-policy alignment, and conduct type determine permission or penalty.
  defense_procurement:
    current_state: ACTIVE
    mechanism:
      - DoD_contracting_restriction_requires_foreign_entity_certification_of_noncompliance_with_secondary_Arab_boycott_of_Israel_subject_to_exceptions_or_waivers
  fema_2025_attempt:
    state: TRANSIENT_OR_WITHDRAWN_EXPLICIT_CONDITION
    notes:
      - 2025_grant_terms_were_reported_as_conditioning_preparedness_funds_on_nonboycott_of_Israeli_companies
      - explicit_term_was_reported_removed_in_later_August_2025_terms
    lock: do_not_project_this_condition_into_FY2026_without_current_primary_text

actor_dependent_permission_test:
  compare:
    - private_consumer_boycott
    - labor_boycott_or_strike
    - civil_rights_boycott
    - anti_BDS_contract_condition
    - anti_energy_boycott_condition
    - anti_firearms_boycott_condition
    - federal_sanctions
    - government_divestment
    - federal_unsanctioned_foreign_boycott_prohibition
  questions:
    - Who is withdrawing economic cooperation?
    - What target is being pressured?
    - Is the pressure individual collective corporate foreign_government or state_directed?
    - Is public money used to force participation or nonparticipation?
    - Is the same tactic renamed when government itself performs it?
    - What concrete discrimination interest exists and is the rule narrowly tied to that interest?
    - What protected market or political arrangement survives when the boycott is disabled?

