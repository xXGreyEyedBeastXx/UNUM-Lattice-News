source_bundle:
  - source-boycott-bans-and-selective-economic-redress-2026-08-16
purpose: >-
  Trace how governments classify and condition nonviolent economic refusal. The mesh asks when boycott,
  divestment, refusal to contract, refusal to invest, sanctions, and procurement exclusions are treated
  as legitimate public policy and when materially similar tactics are penalized as discrimination,
  disloyalty, or unacceptable market coercion.

core_redress_relation:
  - grievance
  - coordinated_nonviolent_economic_exit
  - target_experiences_financial_or_reputational_pressure
  - government_permits_discourages_or_penalizes_the_exit
  - public_contract_investment_tax_or_grant_access_changes
  - protected_target_or_protected_industry_retains_or_recovers_market_access
  - redress_capacity_strengthens_or_weakens

