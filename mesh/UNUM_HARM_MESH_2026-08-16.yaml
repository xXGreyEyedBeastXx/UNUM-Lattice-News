next_growth:
  - Build normalized source-first public-money census rather than actor-first lists.
  - Cross-match recurring corporate, ownership, trust, fund, creditor, and control seats across sectors.
  - Promote healthcare, food, housing, energy, insurance, pharmaceutical, debt, and other essential-market circuits.
  - Expand immigration blame inversion into employer, landlord, detention, surveillance, transport, and contractor meshes.
  - Normalize historical source bundles for the operator library.
  - Build truth-production and citation-lineage case studies.
  - Build redress-capture/election-administration case surfaces with strict observed/candidate/not-established typing.
  - Preserve all discovered weak edges as explicit research paths rather than conversational memory.

locks:
  - The mesh maps mechanisms and contributions, not enemy identities.
  - Group membership does not establish culpability.
  - Harm, control, gain, and responsibility remain evidence-scoped.
  - No category, institution, corporation, government, party, religion, ideology, nationality, or wealth class receives evidentiary immunity.
  - No legal, accounting, naming, or jurisdictional partition may close a path without evidence that the relevant causal carrier actually terminates.