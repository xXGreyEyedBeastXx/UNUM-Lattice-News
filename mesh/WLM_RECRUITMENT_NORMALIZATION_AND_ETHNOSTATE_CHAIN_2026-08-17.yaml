version_comparison:
  2022:
    strongest_supported_features:
      - explicit_99_percent_demographic_threshold
      - explicit_racially_restricted_citizenship_program
      - recruitment_growth_metrics_and_conversion_logic
      - decentralized_small_cell_or_local_effort_model
      - organizers_and_specialized_roles_to_scale_participation
      - explicit_mainstreaming_argument_in_appendix
  2024:
    strongest_supported_features:
      - explicit_99_percent_plus_demographic_endpoint
      - mass_awakening_as_short_term_goal
      - mainstream_White_families_as_priority_audience
      - simple_positive_WLM_message_as_unified_public_surface
      - public_approachability_as_doorway_to_White_Nationalist_worldview
      - explicit_stepwise_development_and_conversion_to_activism
      - exclusive_spaces_and_legal_measures_for_absolute_White_majority
  survivor: >-
    The central demographic objective, racial consciousness project, recurring real-world activism, decentralized
    participation, and recruitment function survive the revision. The public presentation becomes more deliberately
    approachable and stripped of peripheral extremist branding.
