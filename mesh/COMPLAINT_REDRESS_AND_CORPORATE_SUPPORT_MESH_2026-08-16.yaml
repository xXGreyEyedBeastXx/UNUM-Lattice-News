purpose: >-
  Recover what labor, progressive, socialist, and public-interest constituencies are actually complaining
  about, translate those complaints into measurable mechanisms, and test whether ideological threat labels
  delegitimize or disable redress while public support and protection for concentrated private capital remain
  normalized under different names.
