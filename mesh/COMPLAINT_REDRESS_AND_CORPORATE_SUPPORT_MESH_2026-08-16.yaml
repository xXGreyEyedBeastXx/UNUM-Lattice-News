rhetorical_crossings:
  anti_fascism_to_terrorism:
    observed:
      - white_house_2025_antifa_designation
      - white_house_2025_memorandum_places_self_described_anti_fascism_inside_domestic_terrorism_frame
      - white_house_2026_global_radical_left_terrorism_campaign
    test: >-
      Separate prosecution of violent criminal conduct from ideological, associational, funding, protest,
      and civil-liberties categories. Track whether enforcement scope expands past evidenced crimes.
  equity_to_marxism_or_communism:
    observed:
      - white_house_budget_material_used_marxist_agenda_language_for_equity_related_programs
      - white_house_dei_order_applies_contractual_penalties_to_defined_dei_activity
      - white_house_proclamation_frames socialism_and_communism_as_domestic_evils_to_prevent
    test: >-
      Determine whether targeted policy is discriminatory conduct, universal redistribution, anti-discrimination
      remediation, or another mechanism before accepting the ideological label.
  public_support_asymmetry:
    observed:
      - government_supports_private_firms_through_large_procurement_tax_finance_and_industrial_policy_rails
      - government_and_allied_rhetoric_frequently_describes_some_household_equity_or_collective_programs_as_dependency_marxism_socialism_or_communism
    analytic_translation: >-
      The user phrase corporate communism is retained as a complaint label. The mesh uses the more precise
      mechanism socialized risk/cost plus privately retained ownership/upside, because U.S. corporate support
      does not constitute communism in the technical ownership sense.
public_support_baseline:
  federal_contracts:
    state: CONFIRMED
    fy2025_obligations: about_793_billion
    lock: contracts_purchase_goods_and_services_not_automatic_welfare
  tax_expenditures:
    state: CONFIRMED_AS_SPENDING_LIKE_POLICY_INSTRUMENT
    lock: beneficiary_and_incidence_must_be_resolved
  industrial_policy:
    state: CONFIRMED_IN_CASES
    chips_example: 30_9_billion_awarded_to_19_companies_for_40_projects_by_july_2025
  external_finance:
    state: CONFIRMED_IN_CASES
    links:
      - externalized-resource-extraction-and-statecraft-2026-08-16
core_hypothesis:
  proposition: >-
    Ideological and security threat labels can protect concentrated economic and political arrangements when
    they delegitimize the collective redress mechanisms most capable of changing those arrangements, while
    public support for incumbent capital is normalized as investment, security, development, competitiveness,
    or market policy.
  state: SUPPORTED_AS_GENERAL_MECHANISM_HYPOTHESIS_NOT_PROVEN_AS_UNIVERSAL_OR_SINGLE_ACTOR_MOTIVE
  discriminators:
    - whether threat labels are narrowly tied to proven violent_or_discriminatory_conduct
    - whether lawful advocacy_association_or_funding_is_swept_into_enforcement
    - whether comparable public support receives different scrutiny depending_on_recipient_power
    - whether policies following the label weaken unions_protest_voting_regulation_antitrust_or_social_provision
    - whether beneficiaries of preserved arrangements can be traced through money_ownership_and_policy
next_growth:
  - Build a dollar-normalized corporate-support census by contracts tax expenditures grants loans guarantees insurance and public equity.
  - Separate procurement value from subsidy/rent by competition margin and counterfactual-cost tests.
  - Build a household-support comparison ledger including work requirements means tests sanctions and administrative burden.
  - Map union-busting and anti-organizing expenditure to firms that also receive public support.
  - Trace monopoly protection patent exclusivity and regulated scarcity as noncash public support.
  - Build case studies where a reform demand is explicitly relabeled communist Marxist terrorist extremist or lawless, then follow the policy consequence.
  - Search for countercases where threat labels were narrow conduct-based and did not suppress lawful redress.
locks:
  - Do not turn left complaints into automatic truth.
  - Do not turn government threat labels into automatic guilt.
  - Do not erase violence where it is proven and do not infer violence from ideology alone.
  - Do not use corporate communism as a technical economic classification.
  - Compare ownership risk return conditions and democratic control rather than arguing from labels.
