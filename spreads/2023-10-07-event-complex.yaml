schema: unum-lattice-news/spread/v0.1

spread:
  id: spread-2023-10-07-event-complex
  title: "October 7 event complex: causes, claims, nested authority, and consequences"
  status: draft
  as_of: "2026-08-10"
  bounded_question: >-
    What can be established about the October 7, 2023 attacks and their surrounding
    causal field, which public claims have been confirmed, contradicted, falsified,
    or remain unresolved, what nested authorities and constraints shaped actors'
    choices before the event, and what harms and constraints propagated afterward?
  summary: >-
    Draft lattice scaffold only. This record does not exonerate or condemn any actor
    by category. It separates direct action, structural constraint, upstream power,
    civilian protection, political participation, allegation, inference, and unknowns.
    Candidate relations below require source-level review before promotion.

  anchors:
    story_ids: []
    source_ids: []
    intake_candidate_ids: []

  lenses:
    health:
      findings: []
      unknowns:
        - "What direct and downstream health harms followed from October 7 and the subsequent war, and how should they be attributed by action, actor, and time?"
    disability_accessibility:
      findings: []
      unknowns:
        - "How did disability, age, medical dependency, and access needs alter vulnerability before, during, and after the event?"
    geopolitics_jurisdiction:
      findings:
        - "The event must be modeled inside a longer Israel/Palestine territorial, occupation, blockade/access-control, and regional-security field rather than as an isolated timestamp."
      unknowns:
        - "Which specific upstream constraints materially affected Gaza governance, civilian movement, resources, infrastructure, and political behavior immediately before October 7?"
        - "Which constraints were controlled by Israel, Egypt, Hamas, the Palestinian Authority, international donors, or other actors, and with what degree of authority?"
    culture:
      findings: []
      unknowns:
        - "What was the actual social and political composition of the Nova festival population, and what claims about attendees' ideology are evidentially supportable?"
    ideology_worldview:
      findings:
        - "Political ideology, civilian status, settlement participation, military participation, citizenship, and direct participation in hostilities must remain separate fields."
      unknowns:
        - "What evidence exists for the political composition of Nova attendees beyond anecdote or retrospective labeling?"
        - "How did competing ideological frames alter which victims, causes, and responsibilities became legible?"
    economy_finance_ownership:
      findings: []
      unknowns:
        - "What funding, resource-control, employment, permit, sanctions, donor, and political-economy pathways materially constrained Gaza before October 7?"
    labor_care_dependency:
      findings: []
      unknowns:
        - "How did labor permits, dependency on external systems, care work, and household survival pressures shape civilian choices and dissent?"
    law_governance_accountability:
      findings:
        - "Civilian protection under international humanitarian law must not be collapsed into political innocence, state citizenship, settlement participation, or ideological sympathy."
        - "Causal contribution, legal justification, and individual responsibility require separate connectors."
      unknowns:
        - "Which acts on October 7 are established as war crimes or other international crimes, by whom, and at what evidentiary confidence?"
        - "Which subsequent acts by Israeli authorities, Hamas, or other armed groups have received formal legal findings versus allegations or pending adjudication?"
    technology_data_infrastructure:
      findings: []
      unknowns:
        - "What surveillance, intelligence, communications, border, permit, targeting, and infrastructure systems shaped the event and its aftermath?"
    ecology_climate_material:
      findings: []
      unknowns:
        - "What material resource flows—water, electricity, food, fuel, shelter, sanitation—were constrained before and after October 7, by whom, and with what consequences?"
    housing_land_migration:
      findings:
        - "Land, displacement, settlement, border, and movement-control relations are part of the causal field and must remain distinct from individual civilian targetability."
      unknowns:
        - "How should different forms of residence—inside Israel, in settlements, in displaced Palestinian communities, or near the Gaza perimeter—be typed without collective guilt?"
    education_science_knowledge:
      findings: []
      unknowns:
        - "Which datasets, forensic investigations, casualty methodologies, and archival records are sufficiently transparent for claim-level verification?"
    media_information_language:
      findings:
        - "Event reconstruction must preserve changing claim states rather than silently overwrite early reports."
        - "Media nodes should be compared by what they select, omit, amplify, correct, and causally attribute—not by a one-dimensional bias score."
      unknowns:
        - "How did Secular Talk, MS NOW, Fox News, BBC, BreakThrough News, and Democratic Party communications transform the same October 7 evidence over time?"
        - "Which widely circulated atrocity claims were confirmed, strongly supported, unresolved, contradicted, or falsified?"
        - "Which later corrections failed to propagate as widely as the original claims?"
    conflict_security_carceral:
      findings:
        - "Hamas governance, Israeli external control, Palestinian dissent, collaboration/informant allegations, factional rivalry, and ordinary policing must not be compressed into one security category."
      unknowns:
        - "When Hamas authorities abused Palestinians, which cases involved alleged collaboration, political opposition, peaceful protest, factional rivalry, ordinary criminal accusations, or other categories?"
        - "For alleged collaborators, what evidence existed that collaboration actually occurred?"
        - "Were particular protest or dissident networks penetrated, supported, manipulated, or falsely accused by Israeli intelligence or other outside actors?"
        - "What proportion of documented Hamas abuse is attributable to counter-collaboration/security enforcement versus suppression of genuine civilian dissent or ordinary coercive governance?"
        - "What Israeli intelligence penetration, informant recruitment, or proxy relationships are independently established, and how did they affect Hamas security behavior?"
    history_memory:
      findings:
        - "October 7 requires both a past cone and a consequence cone: causal history may not erase immediate agency, and immediate agency may not erase causal history."
      unknowns:
        - "Which historical cutoff points materially change causal interpretation, and which are merely narrative choices?"
        - "What proximate developments in 2022-2023 most directly affected the probability, timing, and form of the attack?"
    community_resistance_repair:
      findings:
        - "Dissent inside a nested and externally constrained polity may have multiple simultaneous meanings: genuine grievance, factional opposition, external influence, infiltration, or combinations thereof."
      unknowns:
        - "Which Gaza protest movements were grassroots, faction-linked, externally supported, infiltrated, or mixtures of these?"
        - "What nonviolent political, economic, legal, or diplomatic pathways were realistically available to civilians and political actors before October 7?"
    future_generations_recoverability:
      findings: []
      unknowns:
        - "Which post-October-7 decisions created durable constraints that make future civilian safety, political repair, and self-determination harder to recover?"

