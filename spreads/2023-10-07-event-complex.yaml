  counterevidence:
    - claim: "Hamas abuse of Palestinians is adequately explained as punishment of Israeli collaborators."
      status: "not_established"
      note: "Existing conversation identified documented categories beyond collaboration allegations; source-level reconstruction still required."
    - claim: "Gaza dissenters can generally be treated as Israeli operatives."
      status: "unsupported_generalization"
      note: "Possible infiltration or collaboration must be established person, network, or case at a time."
    - claim: "Nova was a fascist, supremacist, or warmongering political gathering."
      status: "unsupported_hypothesis"
      note: "Retain as a question only if affirmative evidence emerges; do not infer ideology from citizenship, location, or victim status."
    - claim: "Civilian status proves absence of structural participation in occupation or harmful state policy."
      status: "category_error"
      note: "Civilian protection and structural/political participation are distinct dimensions."
    - claim: "Structural participation or harmful ideology removes civilian protection."
      status: "category_error"
      note: "Direct participation in hostilities and other legally relevant facts require separate evidence."

  unresolved_questions:
    - "Which October 7 incidents can be reconstructed at claim level from primary, forensic, geolocated, eyewitness, military, medical, and independent investigative evidence?"
    - "Which iconic early atrocity claims were confirmed, strongly supported, unresolved, contradicted, or falsified, and when did their status change?"
    - "What proportion and categories of documented Hamas abuse of Palestinians involved alleged collaboration, peaceful protest, political opposition, factional rivalry, ordinary criminal accusations, or other causes?"
    - "For collaboration cases, what evidence establishes actual collaboration rather than accusation alone?"
    - "What independently documented Israeli intelligence recruitment, infiltration, informant, or proxy pathways operated in Gaza before October 7?"
    - "Did any documented Gaza dissent movement include foreign-supported or intelligence-linked operatives, and if so, at what scale relative to genuine civilian dissent?"
    - "Which material grievances raised in Gaza protests were primarily caused by Hamas policy, Israeli restrictions/control, Egyptian policy, international sanctions/funding, infrastructure damage, or combinations?"
    - "What was the actual character and attendee composition of the Nova festival, and is there evidence supporting claims of concentrated supremacist, fascist, or militarist politics among attendees?"
    - "How should residence in Israel, residence in an occupied-territory settlement, citizenship, military service history, ideological support, structural benefit, and direct participation in hostilities be separately represented?"
    - "Which post-October-7 Israeli and Palestinian actions were discretionary responses rather than necessary consequences of the initiating event?"
    - "How did each media-study node transform the event's past cone, evidence body, and consequence cone?"
    - "Where did corrections or counterevidence fail to propagate through the same media channels that carried original claims?"
    - "What evidence would materially increase or decrease the hypothesis that Hamas's coercive behavior partly reflects security responses to real external penetration while still preserving accountability for unjustified repression and abuse?"

  corrections: []

