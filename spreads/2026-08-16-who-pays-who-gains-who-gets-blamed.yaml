  counterevidence:
    - Federal taxes are conventionally progressive in CBO's 2022 distributional analysis.
    - Means-tested transfers materially benefit lower-income households and must be counted rather than rhetorically erased.
    - Benefit receipt alone does not establish that recipients are the primary cause of another group's economic pressure.
    - Immigration has heterogeneous local and worker effects; federal net benefit is not universal local benefit.
    - FAIR's illegal-immigration framing is not population-identical to CBO's surge model.
    - A wealthy funder or beneficiary is not automatically a controller or author.

  unresolved_questions:
    - Which current political and media actors make explicit fiscal claims blaming immigrants or means-tested benefit recipients for household pressure?
    - Which of those claims survive source-level fiscal and causal testing?
    - Which current donors fund the organizations or media channels producing those frames?
    - Which policy responses materially reduce the stated pressure versus returning gains or authority upstream?
    - How far down the ownership and income ladders do material benefit, dependence, and political alignment measurably extend?
    - Which people in upper-middle and affluent strata are net beneficiaries, net losers, status-threatened participants, dissenters, or mixed?
    - What does FAIR's current fiscal accounting count as cost, revenue, population, and time horizon, and how does it compare with matched independent estimates?

