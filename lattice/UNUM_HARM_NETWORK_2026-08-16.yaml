schema: unum-lattice-news/lattice/v0.1
id: unum-harm-network-2026-08-16
title: UNUM harm network — extraction, capture, concentration, blame routing, and failed redress
status: active
as_of: 2026-08-16
authority: evidence_lattice_not_verdict
purpose: >-
  Recompose the material, political, and narrative harm mechanisms already recovered in UNUM
  Lattice News into one causal network. The network does not erase evidentiary distinctions; it
  prevents those distinctions from being used as false disconnects that hide aggregate extraction,
  concentrated gain, power feedback, scapegoating, or institutional failure.

operators:
  - money-flow-benefit-enforced-loss
  - whole-circuit-corporate-gain-accounting
  - causal-partition-laundering
  - price-power-and-essential-goods-extraction
  - labor-market-power-and-wage-extraction
  - public-assistance-labor-cost-supplementation
  - land-rent-and-resource-capture
  - public-to-private-revenue-and-ownership-return
  - environmental-cost-externalization
  - attribution-routing-and-grievance-redirection

source_bundles:
  - source-us-material-extraction-and-upward-recirculation-2026-08-16
  - source-walmart-public-assistance-employment-2026
  - source-us-wealth-grievance-routing-baseline-2026-08-16
  - source-healthcare-grievance-and-enforcement-continuity-2026-08-16
  - source-price-power-and-market-capture-2026-08-16

core_invariant:
  statement: >-
    Separate for attribution; recompose for causation. A legal, accounting, market, programmatic,
    jurisdictional, or rhetorical category does not sever a material or causal flow unless evidence
    shows that the flow actually terminates there.
  prohibited_shortcuts:
    - worker_received_benefit_therefore_employer_cannot_gain
    - government_spending_reached_program_therefore_private_ownership_is_irrelevant
    - market_price_label_therefore_price_was_competitively_formed
    - legal_wage_therefore_labor_market_is_nonextractive
    - profit_is_a_distinct_accounting_category_therefore_it_is_unrelated_to_labor_price_or_public_input
    - foreign_aid_left_the_country_therefore_procurement_return_is_irrelevant
    - shareholder_return_is_downstream_therefore_it_is_unrelated_to_upstream_extraction
    - blame_target_is_visible_therefore_blame_target_is_causal_source

