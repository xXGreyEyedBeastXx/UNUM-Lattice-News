whole_network_feedback:
  supported_composition: >-
    Existing evidence supports multiple connected mechanisms by which workers, tenants, patients,
    consumers, taxpayers, communities, and future generations can bear costs while firms, landlords,
    executives, creditors, and owners receive gains. It also supports cases where market or political
    narratives misdescribe price formation or redirect blame toward lower-power groups. The full
    nationwide magnitude of the combined extraction loop is not yet measured, but the network must
    remain recomposed while each weak edge is marked and tested.
  canonical_cycle:
    - labor_resource_public_or_household_value_enters_system
    - bargaining_or_pricing_or_policy_power_shapes_terms
    - cost_or_deprivation_is_borne_downstream
    - surplus_rent_avoided_cost_or_asset_gain_accumulates_upstream
    - executive_creditor_and_ownership_seats_receive_or_retain_gain
    - accumulated_gain_increases_market_or_political_capacity
    - rules_prices_wages_access_or_enforcement_are_shaped_again
    - legitimizing_or_blame_narratives obscure_or_redirect_attention
    - redress_succeeds_or_fails
    - cycle_repeats_changes_or_breaks

next_research:
  - Build public-money source-first census across healthcare, defense, immigration, housing, food, energy, agriculture, education, infrastructure, prisons, disaster response, finance, and state/local pass-through spending.
  - Trace each rail to company revenue, real operating costs, surplus, executive compensation, dividends, buybacks, debt service, acquisitions, and ultimate ownership.
  - Add price-formation studies for food, housing, healthcare, energy, insurance, pharmaceuticals, and other essential markets.
  - Add current low-wage employer cases using public-assistance incidence, compensation distribution, scheduling, unionization, and labor-market concentration evidence.
  - Trace lobbying, campaign finance, revolving-door, regulatory, and policy-authorship edges only where actor-specific evidence exists.
  - Build same-year normalized burden and gain ledgers without double-counting overlapping surplus seats.
  - Cross-match repeated corporate and ownership nodes across otherwise separate sectors and public programs.

locks:
  - The harm network is a causal map, not a declaration that every corporation, owner, market, or government program is harmful.
  - Harm is established at the mechanism and contribution level.
  - Weak edges stay visible as weak edges; they are not silently deleted to make the network look safer.
  - Strong edges are not downgraded merely because the composed result is politically uncomfortable.
  - Legal and accounting categories do not outrank demonstrated causal continuity.
  - The burden remains symmetric: claims against concentrated power and claims against lower-power populations require the same evidentiary discipline.
