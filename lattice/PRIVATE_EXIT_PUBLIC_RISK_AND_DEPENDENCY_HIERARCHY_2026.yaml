schema: unum-lattice-news/durable-relation/v0.1
status: DURABLE_REVIEWED_PARTIAL_PROMOTION
as_of: 2026-08-28
id: private-exit-public-risk-and-dependency-hierarchy-2026

scope: >-
  Cross-domain model for testing whether concentrated wealth, ownership, citizenship or residency options, private security,
  private infrastructure, technology control, and political access allow a narrow class of actors to externalize shared risk while
  purchasing insulation from the consequences borne by populations with fewer exit options. This model may resemble some features
  historically associated with feudal or neo-feudal dependency, but the historical analogy is not a conclusion and must be tested
  feature by feature.

core_question: >-
  Who can survive system failure privately, who must depend on public or employer-controlled systems, who sets the terms of access,
  and whether unequal exit capacity feeds back into weaker incentives to maintain universal protections.

mechanism:
  - SHARED_SYSTEM_PRODUCES_OR_ACCUMULATES_RISK
  - POWERFUL_ACTORS_HAVE_DISPROPORTIONATE_ROLE_IN_TERM_SETTING_OR_RESOURCE_USE
  - COSTS_ARE_EXTERNALIZED_TO_PUBLIC_AFFECTED_POPULATIONS_OR_FUTURE_GENERATIONS
  - WEALTH_AND_OWNERSHIP_FINANCE_PRIVATE_RESILIENCE_AND_EXIT
  - LOWER_POWER_POPULATIONS_REMAIN_DEPENDENT_ON_PUBLIC_EMPLOYER_CREDITOR_LANDLORD_OR_STATE_GATES
  - EXIT_ASYMMETRY_INCREASES_BARGAINING_AND_POLITICAL_ASYMMETRY
  - UNIVERSAL_SYSTEM_MAINTENANCE_BECOMES_LESS_MATERIALLY_NECESSARY_FOR_THE_INSULATED_CLASS
  - PRIVATE_ALTERNATIVES_EXPAND_WHILE_PUBLIC_CAPACITY_MAY_ERODE
  - DEPENDENCY_HIERARCHY_DEEPENS

