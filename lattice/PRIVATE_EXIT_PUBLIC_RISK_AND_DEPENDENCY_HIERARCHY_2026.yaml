feudalization_discriminator:
  purpose: >-
    Test the user's medieval-era analogy as a structural comparison rather than a label. A stronger neo-feudal comparison requires
    several of the following to coexist and reproduce over time.
  features:
    - concentrated_control_of_land_or_critical_assets
    - survival_access_conditioned_on_relationship_to_power_holder
    - weak_meaningful_exit_for_dependents
    - private_or_quasi_private_security_capacity
    - unequal_legal_or_political_access
    - inherited_or_self_reproducing_concentration_of_power
    - tollbooth_control_over_necessities_or_infrastructure
    - public_cost_private_gain_feedback
    - patronage_or_dependency_substituting_for_universal_rights
    - accountability_asymmetry_between_elite_and_dependent_populations
    - strong_technological_capacity_without_corresponding_expansion_of_equal_standing_or_remedy
  scope_locks:
    - modern_capitalism != medieval_feudalism_by_definition
    - inequality_alone != feudalism
    - billionaire_wealth != lordship_by_definition
    - private_security != private_sovereignty_by_definition
    - historical_analogy_requires_mechanism_match_not_vibe

technology_discriminator: >-
  Technological advancement is not treated as social progress by default. Measure whether a technology expands broad human agency,
  resilience, health, knowledge, consent, and noncoercive exit, or whether its primary realized effect is to intensify surveillance,
  extraction, military capacity, labor discipline, private insulation, or gatekeeping.

