locks:
  - This lattice is an investigation surface, not a verdict surface.
  - Do not infer rape at Prairieland from sexual-assault allegations unless the underlying allegation or finding specifically establishes rape.
  - Do not infer that staff sexual-abuse allegations were substantiated from their presence in ICE's database.
  - Do not infer exoneration from Closed status.
  - Do not infer common intent from common location, political identity, encrypted-chat use, black clothing, firearms culture, or prosecution label.
  - Do not infer government provocation or far-right infiltration without affirmative evidence.
  - Do not use the violence of July 4 to erase the facility's preexisting humanitarian record.
  - Do not use the facility's humanitarian record to excuse Song's adjudicated gunfire or other proven criminal conduct.
