      - DOJ's June 2026 sentencing release explicitly highlights the September 2025 order when describing the Prairieland sentencing.
    evidence_against_overclaim:
      - Temporal order and later rhetorical linkage do not establish that the executive order caused the prosecution's organizational theory or charges.
