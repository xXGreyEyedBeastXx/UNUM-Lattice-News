    type: partial_discriminator
    status: supported
    note: >-
      Song-alone attempted-murder/firearm convictions demonstrate at least one legally consequential distinction
      between his conduct and other trial defendants; common-count convictions also establish that the jury found
      additional criminal participation by others within the elements charged.

