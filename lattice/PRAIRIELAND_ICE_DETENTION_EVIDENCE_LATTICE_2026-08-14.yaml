schema: unum-lattice-news/evidence-lattice/v0.1
id: prairieland-ice-detention-evidence-lattice-2026-08-14
title: Prairieland / ICE Detention / Evidence Custody / Protest / Classifier Lattice
status: active_investigative_lattice
as_of: 2026-08-14
verdict: none
purpose: >-
  Preserve the causal and evidentiary crossings surrounding Prairieland without flattening detention
  conditions into justification for violence, violence into erasure of detention conditions, group labels
  into individual culpability, or absence of retained evidence into exoneration.

method:
  inherited_from: lattice/ACTOR_NETWORK_SEED_2026-08-10.yaml
  rules:
    - No authority gets epistemic immunity. Institutional findings are evidence nodes, not terminal verdicts.
    - Direct causal action outranks inherited moral classification.
    - Association is not control; proximity is not culpability; accusation is not proof.
    - Every consequential connector must carry an evidence posture.
    - The evidence custodian is itself an actor when preservation, classification, access, or disclosure affects what can later be known.
    - A later violent event cannot retroactively erase an antecedent humanitarian record.
    - An antecedent humanitarian record cannot retroactively justify later violence.
    - Individual intent and knowledge must not be inferred from a movement, protest, group chat, clothing style, or political label alone.
    - Structured metadata must be checked against narrative fields before aggregate conclusions are trusted.

status_vocabulary:
  documented: Supported directly by primary records or multiple strong sources.
  adjudicated: Established by a court verdict or judicial finding within the stated scope.
  supported: Substantial evidence, but causal scope remains bounded.
  candidate: Plausible connector requiring additional source-level trace.
  alleged: Sourced allegation not independently established.
  disputed: Material factual or interpretive dispute remains.
  unknown: Insufficient evidence or identity unresolved.
  missing: Evidence expected or sought but not presently available.
  inaccessible_or_withheld: Existing or requested evidence is not currently accessible to this investigation.
  lost_or_not_retained: Evidence is reported as destroyed, overwritten, lost, or not retained.
  contradicted_metadata: Structured fields conflict with narrative or other record fields.

