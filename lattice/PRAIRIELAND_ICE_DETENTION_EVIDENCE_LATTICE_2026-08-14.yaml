        - contracting authority
        - complaint recipient
        - records custodian
        - oversight subject
    - id: org-ice-ero
      label: ICE Enforcement and Removal Operations
      type: federal_operational_component
    - id: org-ice-jic
      label: ICE Joint Intake Center
      type: complaint_intake_and_routing_component
    - id: org-ice-opr
      label: ICE Office of Professional Responsibility
      type: investigative_and_professional-responsibility_component
    - id: org-ice-odo
      label: ICE Office of Detention Oversight
      type: detention_oversight_component
    - id: org-dhs-crcl
      label: DHS Office for Civil Rights and Civil Liberties
      type: civil_rights_oversight_component
    - id: org-dhs-oig
      label: DHS Office of Inspector General
      type: inspector_general
    - id: org-lasalle-corrections
      label: LaSalle Corrections
      type: private_detention_operator
      posture: documented
      research_questions:
        - Which Prairieland staff were direct LaSalle employees versus subcontractors or government staff?
        - What disciplinary, referral, termination, reassignment, and litigation records exist for sexual-abuse or medical complaints?
        - Which evidence-retention duties were contractually assigned to LaSalle versus ICE?
    - id: facility-prairieland-detention-center
      label: Prairieland Detention Center
      type: detention_facility
      dossier: nodes/institutions/prairieland-detention-center.yaml
    - id: trump-administration-second-term
      label: Trump Administration — Second Term
      type: governing_coalition_federal_executive_system
      dossier: nodes/institutions/trump-administration-second-term.md

  populations:
    - id: population-prairieland-detainees
      label: People detained at Prairieland
      type: affected_population
      vulnerability:
        - custody dependence
        - limited exit
        - medical dependence
        - communication dependence
        - retaliation risk
        - evidence-access asymmetry
    - id: population-prairieland-protest-participants-2025-07-04
      label: July 4 2025 Prairieland protest participants
      type: event_population
      lock: >-
        Do not equate daytime attendees, nighttime attendees, broad chat participants, trusted planning
        participants, armed participants, defendants, or Song's own intent without person-specific evidence.
    - id: population-prairieland-workers
      label: Prairieland detention and contract staff
      type: workforce_population
    - id: population-responding-law-enforcement-2025-07-04
      label: Responding law-enforcement officers on July 4 2025
      type: affected_population

  incidents_and_conditions:
    - id: incident-pdc-2017-06-staff-sexual-assault-allegation
      label: June 2017 Prairieland staff-on-detainee sexual-assault allegation
      type: alleged_abuse_incident
      date: 2017-06-15
      posture: alleged
      record:
        dataset: ICE FOIA 2018-ICFO-45499
        index: 365
        primary_fd: 0612 Detainee/Alien - Sexual Assault (Staff on Detainee)
        case_type: Investigation IG
        class: Criminal
        status: Closed
      unknowns:
        - identity of contract officer
        - investigative finding
        - criminal referral or declination
        - discipline or reassignment
        - PREA disposition

    - id: incident-pdc-2017-12-lasalle-guard-groping-allegation
      label: December 2017 Prairieland LaSalle guard groping allegation
      type: alleged_abuse_incident
      date: 2017-12-11
      posture: alleged
      record:
        dataset: ICE FOIA 2018-ICFO-45499
        index: 95
        primary_fd: 0612 Detainee/Alien - Sexual Assault (Staff on Detainee)
        case_type: Management Inquiry
        class: Non-Criminal (S)
        status: Closed
      metadata_conflict:
        posture: contradicted_metadata
        topic_field: says the detainee was touched sexually by another detainee
        case_summary_and_synopsis: identify a contract detention officer / male LaSalle detention officer
        primary_fd: identifies Staff on Detainee
      unknowns:
