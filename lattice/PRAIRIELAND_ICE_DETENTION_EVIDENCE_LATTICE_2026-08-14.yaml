    - id: allegation-pdc-2025-medication-phone-denial
      label: América Platt medication and phone-access allegation
      type: detainee_conditions_allegation
      date: 2025-04
      posture: alleged
      note: >-
        Platt reported being denied antibiotics for an ear infection and denied telephone access while detained.

  events:
    - id: event-prairieland-july4-2025-day-protest
      label: July 4 2025 Prairieland daytime protest
      type: protest_event
      date: 2025-07-04
      posture: documented
      note: DOJ's trial summary itself describes a peaceful daytime protest attended by some later defendants.

    - id: event-prairieland-july4-2025-night-violence
      label: July 4 2025 Prairieland nighttime violence
      type: violent_event
      date: 2025-07-04
      posture: adjudicated_and_documented
      components:
        - fireworks used/thrown
        - vandalism
        - responding police intervention
        - Benjamin Song gunfire
        - Alvarado officer wounded in neck
      locks:
        - Physical objects described as fireworks should not be rhetorically upgraded to bombs/IEDs without evidence.
        - Federal explosives counts are legal classification and must be distinguished from ordinary physical-language description.

    - id: event-prairieland-2025-11-antifa-cell-indictment-framing
      label: November 2025 DOJ North Texas Antifa Cell indictment framing
      type: prosecution_classifier_event
      date: 2025-11-14
      posture: documented

    - id: event-prairieland-2026-03-verdict
      label: March 2026 Prairieland federal jury verdict
      type: judicial_event
      date: 2026-03-13
      posture: adjudicated
      key_distinction: >-
        Song alone was convicted on attempted-murder/firearm counts in DOJ's verdict summary; other trial defendants
        were convicted on common riot/material-support/fireworks-explosives counts.

    - id: event-prairieland-2026-06-sentencing
      label: June 2026 Prairieland federal sentencing
      type: judicial_event
      date: 2026-06-23
      posture: adjudicated

    - id: event-trump-antifa-designation-2025-09-22
      label: Trump order designating Antifa a domestic terrorist organization
      type: executive_classifier_event
      date: 2025-09-22
      posture: documented
      source: https://www.whitehouse.gov/presidential-actions/2025/09/designating-antifa-as-a-domestic-terrorist-organization/

    - id: event-trump-nspm7-2025-09-25
      label: NSPM-7 Countering Domestic Terrorism and Organized Political Violence
      type: executive_security_classifier_event
      date: 2025-09-25
      posture: documented
      source: https://www.whitehouse.gov/presidential-actions/2025/09/countering-domestic-terrorism-and-organized-political-violence/

  people:
    - id: actor-benjamin-song
      label: Benjamin Hanil Song
      type: defendant_actor
      posture: adjudicated_on_specific_counts
      known:
        - former U.S. Marine Corps reservist according to DOJ public records
        - convicted of attempted murder of the Alvarado officer in March 2026
      unknowns:
        - full causal relation between his proposed armed detainee-liberation plan and each other participant's knowledge/agreement

  classifiers_and_systems:
    - id: classifier-north-texas-antifa-cell
      label: North Texas Antifa Cell
      type: prosecutorial_classifier
      posture: documented_as_government_label
      lock: >-
        Treat as DOJ/prosecution ontology unless independent evidence establishes a formal pre-existing organization
        with stable membership, governance, boundaries, and continuity outside the prosecution record.

    - id: system-evidence-custody-and-oversight
      label: ICE / contractor evidence-custody and oversight system
      type: accountability_infrastructure
      research_questions:
        - Who creates and controls primary evidence when custody, contractor operations, complaint intake, and death review overlap?
        - Which evidence is mandatory to preserve and for how long?
        - Who can independently compel preservation before routine overwrite or destruction?
        - How often do metadata errors alter aggregate abuse statistics?
        - Does an agency's internal non-substantiation remain reliable when the same ecology controlled evidence preservation and witness access?

    - id: system-institutional-credibility-discount
      label: Institutional credibility discount for damaged evidence pipelines
      type: evidentiary_rule_candidate
      posture: supported
      definition: >-
        Demonstrated failures of preservation, witness access, classification, or disclosure reduce the exculpatory
        weight of absent or non-substantiated evidence. They do not transform an allegation into a proven fact.

    - id: hypothesis-nested-intent-prairieland
      label: Prairieland nested-intent hypothesis
      type: investigative_hypothesis
      posture: candidate
      model:
        - broader solidarity/protest layer
        - armed self-defense / firearms-social-network layer
        - smaller trusted planning layer
        - Benjamin Song's own offensive-use-of-force intent
      discriminator: >-
        Reconstruct chat membership, timing, pre-event discussions, physical items, individual statements,
        jury instructions, verdicts, and sentencing findings for each participant rather than infer a common mind.

