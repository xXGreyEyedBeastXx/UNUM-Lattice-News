    - id: incident-pdc-2018-mirimanian-death
      label: Death of Gourgen Mirimanian at Prairieland
      type: death_in_custody
      date: 2018-04-10
      posture: documented

    - id: incident-pdc-2018-mirimanian-video-loss
      label: Incomplete retention of surveillance evidence in Mirimanian death review
      type: evidence_custody_failure
      posture: supported
      state: lost_or_not_retained
      note: >-
        Records-based oversight reporting states some dorm footage was of limited value because of distance
        and another video was not retained; internal reviewers complained the missing recordings impaired review preparation.

