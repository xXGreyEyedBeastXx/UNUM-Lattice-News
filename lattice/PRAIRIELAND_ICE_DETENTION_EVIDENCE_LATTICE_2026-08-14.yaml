      tell jurors about ideology versus criminal conduct?

  - from: classifier-north-texas-antifa-cell
    to: event-prairieland-2026-06-sentencing
    type: sentencing_frame_question
    status: candidate
    question: >-
      Trace whether terrorism enhancements, statutory mandatory minimums, acquitted conduct, group evidence, or the
      classifier itself affected defendant-specific sentencing calculations.

  - from: event-prairieland-2026-03-verdict
