high_centrality_connections_to_expand:
  - id: custody-evidence-dual-role
    posture: supported
    pattern: >-
      The custody ecology is not only the alleged harm environment; it also controls or mediates much of the
      complaint intake, surveillance, medical record, witness access, retention, and investigative record later used
      to decide whether harm can be substantiated.
    risk: epistemic_chokepoint

  - id: contractor-care-evidence-profit-crossing
    posture: candidate
    pattern: >-
      A private contractor may simultaneously receive public detention revenue, provide or arrange daily custody/care,
      employ alleged wrongdoers, and hold operational evidence. Trace contract incentives, indemnification, penalties,
      retention duties, and renewal decisions before inferring motive.

  - id: metadata-to-public-statistics-crossing
    posture: supported
    pattern: >-
      A structured-field error can move a staff allegation into the wrong apparent actor category, changing aggregate
      counts even where the narrative and primary classification remain explicit.
    next_test: Scan the complete FOIA workbook using both facility-name and narrative-text matching, then compare actor/facility fields against Synopsis/Primary FD.

  - id: detention-expansion-to-protest-to-classifier
    posture: supported_with_open_causal_edges
    pattern: >-
      detention expansion / capacity pressure -> local humanitarian grievance -> protest -> violent escalation by some
      participants -> broad terrorism/Antifa classifier -> prosecution and sentencing environment.
    lock: Every arrow requires its own evidence; the chain is a research topology, not a claim of one mastermind or one intention.

  - id: harm-record-to-prosecution-context-asymmetry
    posture: supported
    pattern: >-
      Public prosecution narratives can begin at the attack and omit the facility's antecedent abuse/oversight history;
      advocacy narratives can begin at detention abuse and minimize later criminal conduct. The lattice must carry both
      histories simultaneously without allowing one to null the other.

