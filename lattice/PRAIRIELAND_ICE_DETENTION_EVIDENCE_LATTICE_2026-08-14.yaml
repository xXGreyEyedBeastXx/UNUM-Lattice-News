falsification_and_counterevidence:
  - >-
    Finding substantiated PREA investigations clearing specific staff allegations would lower confidence in those
    allegation branches, while still preserving the fact that the allegations were made and how they were investigated.
  - >-
    Complete chat/transcript evidence showing each convicted common-count defendant knowingly agreed to the violent
    plan would substantially weaken the nested-intent hypothesis for those defendants.
  - >-
    Internal pre-September 2025 prosecution records using a stable North Texas Antifa Cell organizational theory would
    weaken the hypothesis that the later executive classifier materially generated that ontology.
  - >-
    Evidence of robust independent evidence preservation and external investigation in a given complaint should reduce
    application of the institutional credibility discount for that complaint.

