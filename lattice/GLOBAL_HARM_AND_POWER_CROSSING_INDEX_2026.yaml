nonseparation_locks:
  - government != separate_from_private_capital_when_evidenced_transmission_exists
  - private_capital != separate_from_geopolitics_when_resources_contracts_sanctions_or_infrastructure_cross
  - geopolitics != separate_from_domestic_hierarchy_when_foreign_alignment_changes_domestic_rights_or_conditions
  - ideology != separate_from_material_power_when_it_changes_law_funding_force_or_access
  - technology != social_progress_by_definition
  - state != one_actor
  - country != population
  - religion != nationalist_or_supremacist_project_by_definition
  - billionaire != corporation != government
  - ally != shared_command
  - enemy_label != evidence
  - theater_membership != equal_responsibility
  - harmed_population != combatant_or_government
  - association != culpability
  - same_money_source != shared_intent

public_use_rule: >-
  This index should remain streamlined. Promote only high-centrality actors and systems here. Individual people belong on the top surface
  only when their decision authority, ownership, financing, command, or repeated causal contribution is large enough to materially alter
  the connected system. Detailed actor records, source custody, disputes, and corrections remain in the relevant sorting and intake repositories.

