as_of: 2026-08-28
id: global-harm-and-power-crossing-index-2026

purpose: >-
  Public-facing durable routing index for the highest-centrality current harm and power systems. It exists to show how separately
  researched actors, states, corporations, armed groups, ideologies, resource flows, technologies, and accountability institutions
  connect without collapsing them into one undifferentiated conspiracy, one moral category, or one country-level verdict.

core_rule: >-
  Separate actors for attribution. Reconnect systems for causality. A state, corporation, billionaire, armed group, religious network,
  military alliance, market, or court is neither guilty nor innocent by adjacency. Every consequential crossing must return to evidence.

