schema: unum-lattice-news/actor-network-seed/v0.1
status: draft
as_of: "2026-08-10"
authority: conversation-derived scaffold; not a verdict surface
purpose: >-
  Seed the cross-event actor/source lattice before further fact-finding. Nodes are
  placed first so later research can fill relationships, harms, incentives,
  information flows, blind spots, and contradictory evidence without repeatedly
  rebuilding the network from institutional shorthand.

rules:
  - "No authority gets epistemic immunity. Institutional findings are evidence nodes, not terminal verdicts."
  - "Direct causal action outranks inherited moral classification."
  - "Association is not control; proximity is not culpability; accusation is not proof."
  - "Every consequential connector should distinguish documented relationship, plausible influence, allegation, rumor, and unknown."
  - "A source can be factually accurate at article level while still normalizing a harmful constraint structure."
  - "Do not infer individual culpability from population membership, citizenship, ideology, or institutional affiliation."

status_vocabulary:
  documented: "Supported by direct records or multiple strong sources."
  supported: "Substantial evidence, but causal scope still bounded."
  candidate: "Plausible connector requiring source-level trace."
  alleged: "Sourced allegation not independently established."
  rumor: "Claim circulating without sufficient affirmative evidence."
  unknown: "Insufficient evidence or identity unresolved."

nodes:
  media_and_persuasion:
    - id: source-secular-talk
      label: "Secular Talk / Kyle Kulinski"
      type: "commentator_media"
      research_questions:
        - "Where does commentator compression or certainty outrun evidence?"
        - "Where does anti-establishment framing reveal omissions in larger outlets?"
    - id: source-ms-now
      label: "MS NOW"
      type: "corporate_political_media"
      research_questions:
        - "Which establishment or Democratic-coalition assumptions become background reality?"
        - "What harms or power relations are normalized through selection rather than false statements?"
    - id: source-fox-news
      label: "Fox News"
      type: "corporate_partisan_media"
      research_questions:
        - "How do audience incentives and partisan power affect factual discipline and corrections?"
    - id: source-bbc
      label: "BBC"
      type: "public_service_media"
      research_questions:
        - "When does institutional impartiality become false balance, establishment-source dependence, or asymmetric humanization?"
    - id: source-breakthrough-news
      label: "BreakThrough News"
      type: "movement_media"
      research_questions:
        - "Does anti-imperialist framing underweight abuses by actors opposed to U.S. power?"
        - "Where does movement alignment expose constraints mainstream outlets miss?"
    - id: source-keith-edwards
      label: "Keith Edwards"
      type: "political_creator_strategist"
      research_questions:
        - "How do campaign-trained persuasion techniques shape story selection and framing?"
        - "Where does former-insider knowledge produce useful divergence from Democratic institutions?"
    - id: source-valhalla-vft
      label: "Valhalla VFT"
      type: "veteran_creator_media"
      research_questions:
        - "How do military/veteran experience and America-First cultural priors shape antiwar or interventionist conclusions?"
        - "When does this node independently converge with left antiwar reporting?"
    - id: source-raw-america
      label: "Raw America"
      type: "journalism_advocacy_hybrid"
      research_questions:
        - "What changes when Raw Story journalism crosses into Really American partnership media?"
    - id: source-really-american
      label: "Really American"
      type: "political_advocacy_super_pac_media"
      research_questions:
        - "Where is reporting separated from persuasion and mobilization?"
        - "Does anti-MAGA advocacy reduce scrutiny of aligned Democratic actors?"
    - id: source-guardian
      label: "The Guardian"
      type: "trust_owned_liberal_media"
      research_questions:
        - "What does the outlet normalize while presenting itself as public-interest or guardian journalism?"
        - "Which powers does it recognize easily, and which liberal/institutional powers become difficult to see?"
        - "Which editorials materially disturb the harm-and-constraint matrix through normalization rather than simple factual error?"
      user_observation:
        status: "study_prompt"
        note: "Repeated concern about editorials normalizing harmful structures; requires article-level retrieval rather than generic outlet reputation."

  political_parties_and_electoral:
    - id: org-democratic-party
