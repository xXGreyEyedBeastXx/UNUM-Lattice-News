blind_spots:
  - id: blindspot-guardian-editorial-normalization
    question: "Which Guardian editorials normalized coercive, colonial, carceral, militarist, paternalist, or elite-governance assumptions while presenting them as liberal/public-interest reasoning?"
    next_method: "Collect specific editorials, authors, cited authorities, social/professional connections, and downstream policy assumptions."
  - id: blindspot-putin-personal-causality
    question: "Which major alleged harms can be traced to Putin personally, and where does the chain stop below him?"
  - id: blindspot-zelensky-network-transition
    question: "Which people and relationships materially changed Zelensky's posture from 2019 peace candidate to 2021-22 security alignment?"
  - id: blindspot-nato-human-network
    question: "Which NATO member-state leaders, staff, military commanders, think tanks, donors, and defense-sector actors shaped Ukraine policy and Russian threat perception?"
  - id: blindspot-us-ukraine-human-network
    question: "Trace person-to-person influence among Biden, Sullivan, Blinken, Nuland, Austin, Milley, Yermak, Zelensky, Kuleba, Zaluzhny, and relevant congressional/industry actors."
  - id: blindspot-israel-ukraine-russia-network
    question: "Trace Bennett/Netanyahu and Israeli security interests as independent connectors rather than treating Israel as a U.S. proxy."
  - id: blindspot-icc-khan-causal-chain
    question: "Did external Israeli/pro-Israel pressure materially alter Khan's disciplinary trajectory, or did it only exploit a genuine internal case?"
  - id: blindspot-authority-audit
    question: "For every major authority cited later, identify the individual decision-makers, funding/appointment structure, source chain, conflicts, and external pressures before using its conclusion as evidentiary weight."

next_step_lock: >-
  Stop adding theory. Fill this lattice empirically: one node or connector at a time,
  preserving direct action, information flow, incentives, contradictory evidence,
  and unresolved identity. New nodes should be added only when a trace exposes a
  genuinely missing participant or relation.
