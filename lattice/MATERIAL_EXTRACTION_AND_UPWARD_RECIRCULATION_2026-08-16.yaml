schema: unum-lattice-news/lattice/v0.1
id: material-extraction-and-upward-recirculation-2026-08-16
title: Material extraction and upward recirculation in the United States
status: active
as_of: 2026-08-16
authority: evidence_lattice_not_verdict
purpose: >-
  Trace recurring mechanisms by which labor value, land rent, public spending, tax preferences,
  and environmental liabilities can move resources toward owners, landlords, firms, creditors,
  or asset holders while costs remain with workers, tenants, taxpayers, communities, or future
  generations. The lattice measures each path separately and does not equate ownership or profit
  with wrongdoing.
operators:
  - money-flow-benefit-enforced-loss
  - labor-market-power-and-wage-extraction
  - land-rent-and-resource-capture
  - public-to-private-revenue-and-ownership-return
  - environmental-cost-externalization
  - attribution-routing-and-grievance-redirection
source_bundles:
  - source-us-material-extraction-and-upward-recirculation-2026-08-16
  - source-us-wealth-grievance-routing-baseline-2026-08-16
nodes:
  institutions:
    - lockheed-martin
  populations:
    - us-low-income-households
    - us-high-income-households
    - us-high-wealth-households
    - us-workers-lower-formal-education
flows:
  labor:
    findings:
      - id: fy2025-enforced-back-wage-flow
        posture: observed
        investigation_state: CONFIRMED
        trace:
          - labor_performed
          - compensation_legally_due
          - employer_underpayment
          - worker_loss
          - enforcement_recovery
        evidence:
          - source-dol-whd-fy2025-back-wages
        magnitude: more than 259 million dollars recovered for nearly 177000 workers
        limits:
          - Recovery amount is not a national estimate of all wage theft.
      - id: employer-market-power-wage-suppression
        posture: supported_inference
        investigation_state: CONFIRMED
        trace:
          - employer_concentration_or_anticompetitive_practice
          - reduced_worker_bargaining_power
          - lower_counterfactual_wage
          - employer_cost_saving_or_margin_effect
        evidence:
          - source-treasury-labor-market-competition-2022
        limits:
          - Treasury's roughly 20 percent estimate is a model-level benchmark, not a uniform firm-level effect.

  land_and_rent:
    findings:
      - id: farmland-tenant-to-landlord-flow-2024
        posture: observed
        investigation_state: CONFIRMED
        trace:
          - rented_farmland
          - producer_or_tenant
          - rent_payment
          - nonfarming_landlord_or_other_landowner
        evidence:
          - source-usda-total-2024-landlords
        magnitude:
          rented_acres: 348 million
          landlord_rental_income: 34.1 billion dollars
          landlord_operating_expenses: 12.0 billion dollars
          rented_land_and_buildings_value: more than 1.6 trillion dollars
        limits:
          - Rental income is not automatically economic extraction or net owner profit.
          - Ownership entities and wealth distribution require further tracing.

  public_to_private:
    findings:
      - id: lockheed-public-revenue-owner-return-case
        posture: observed
        investigation_state: CONFIRMED
        trace:
          - U.S._Government_procurement
          - lockheed-martin
          - company_revenue_pool
          - operating_costs_wages_suppliers_and_capital
          - net_earnings
          - dividends_and_share_repurchases
          - shareholders
        evidence:
          - source-lockheed-2025-10k
        magnitude:
          total_sales_2025: 75.0 billion dollars
          us_government_sales_share: 72 percent
          net_earnings_2025: 5.017 billion dollars
          common_stock_repurchases_2025: 3.0 billion dollars
          dividends_declared_2025: 3.126 billion dollars
        limits:
          - The filing does not identify which shareholder distributions were funded by which government contracts.
          - Gross sales must not be counted as owner capture.
      - id: capital-gains-tax-preference-current-carrier
        posture: observed
        investigation_state: CONFIRMED
        trace:
          - federal_tax_code
          - preferential_capital_gains_treatment
          - foregone_revenue
          - capital_gain_recipient
        evidence:
          - source-treasury-tax-expenditures-fy2026
          - source-cbo-major-tax-expenditures-2019
        limits:
          - Current magnitude and historical distribution are sourced from different years.
          - Tax expenditure is foregone revenue, not a cash transfer.

  environmental_externalization:
    findings:
      - id: offshore-oil-gas-financial-assurance-gap
        posture: observed
        investigation_state: CONFIRMED
        trace:
          - offshore_oil_and_gas_activity
          - post_production_cleanup_obligation
          - company_financial_assurance
          - residual_default_risk
          - federal_public_exposure
        evidence:
          - source-gao-federal-oil-gas-oversight-2025
        magnitude:
          estimated_post_production_costs: 40 to 70 billion dollars
          supplemental_bonds_held: about 3.5 billion dollars as of June 2023
        limits:
          - Exposure is not identical to realized taxpayer loss.
      - id: superfund-cost-recovery
        posture: observed
        investigation_state: CONFIRMED
        trace:
          - contamination
          - public_cleanup_or_oversight
          - responsible_party_enforcement
          - cost_recovery_or_private_cleanup_commitment
        evidence:
          - source-epa-superfund-enforcement-fy2025
        limits:
          - Successful cost recovery reduces the amount that should be classified as externally borne.

anti_double_counting:
  rules:
    - Contract revenue cannot also be counted in full as profit or owner gain.
    - Profit retained in a firm cannot be counted again as both retained earnings and the full market-capitalization response without attribution.
    - Dividends and buybacks are owner-return channels but must be linked to the same earnings pool before aggregation.
    - Tax expenditures are foregone revenue and must not be added to cash spending as if they were identical instruments.
    - Land appreciation, rent, and realized capital gains are distinct seats and may overlap economically.
    - Environmental cleanup obligations count as externalized only to the extent the responsible party does not ultimately bear them.

crossing_to_grievance_routing:
  proposition: >-
    Material extraction or upward recirculation can coexist with public narratives that attribute
    household pressure primarily to lower-power populations. The money-flow lattice establishes
    the material field; the attribution-routing lattice tests who is blamed and whether that blame
    is proportionate to measured causation.
  related_lattice: wealth-grievance-routing-2026-08-16

path_forward:
  - Trace wage suppression and wage-theft cases by sector, employer concentration, and ownership seat.
  - Map rent, mortgage interest, land appreciation, and landlord ownership by household wealth tier.
  - Trace federal procurement and subsidy cases from gross award to wages, suppliers, net profit, dividends, buybacks, and ultimate ownership.
  - Quantify tax-expenditure incidence with current-year distributional estimates where available.
  - Trace environmental liabilities from private gain through bonding, cleanup, health harm, public spending, and cost recovery.
  - Build a same-year normalized capture ledger before making any aggregate claim that upward recirculation exceeds lower- or middle-income tax payments.
locks:
  - Extraction is a mechanism claim, not a wealth identity.
  - Profit, rent, ownership, and government contracting are not harms by definition.
  - Material benefit and culpability require separate evidence.
  - Genuine public value created by spending or investment remains part of the accounting.
  - Failed or repaired externalization reduces the harm estimate.
