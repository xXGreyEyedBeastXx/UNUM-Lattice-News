schema: unum-lattice-news/lattice/v0.1
id: walmart-whole-circuit-2026-08-16
title: Walmart whole-circuit labor, public-support, executive-pay, ownership-return, and accountability case
status: active
as_of: 2026-08-21
authority: evidence_lattice_not_verdict
purpose: >-
  Keep Walmart's worker compensation, public-assistance incidence, firm surplus, executive compensation, shareholder distributions, concentrated ownership, and knowledge/notice/correction path inside one recoverable economic circuit. The case decomposes carriers for accuracy and then recomposes them so legal or accounting categories do not erase aggregate distributional gain and uncertainty about harmful motive does not erase intentionally chosen compensation terms or foreseeable consequences.

parent_lattice: material-extraction-and-upward-recirculation-2026-08-16
operators:
  - whole-circuit-corporate-gain-accounting
  - public-assistance-labor-cost-supplementation
  - labor-market-power-and-wage-extraction
  - money-flow-benefit-enforced-loss
  - harm-domination-protection-weighting

nodes:
  corporation:
    - walmart
  ownership_seats:
    - walton-enterprises
    - walton-family-holdings-trust
  populations:
    - us-means-tested-benefit-recipient-households
    - us-low-income-households
    - us-high-wealth-households
  resources:
    - means-tested-public-transfers

sources:
  - source-walmart-public-assistance-employment-2026

observed_circuit:
  worker_and_public_support:
    - id: walmart-georgia-medicaid-workers-2025
      posture: observed
      source: source-gao-working-medicaid-snap-employers-2026
      value: 4595
      unit: working adult Medicaid enrollees employed by Walmart in Georgia, September 2025
      limits:
        - selected-state count, not national total
        - does not identify cause of eligibility
    - id: walmart-tennessee-snap-workers-2025
      posture: observed
      source: source-gao-working-medicaid-snap-employers-2026
      value: 3513
      unit: working adult SNAP recipients employed by Walmart in Tennessee, September 2025
      limits:
        - selected-state count, not national total
        - SNAP is household-based and eligibility depends on more than one worker's wage
    - id: walmart-average-us-hourly-wage-fye2026
      posture: stated
      source: source-walmart-people-fye2026
      value: 18
      unit: dollars per hour, approximate company-reported U.S. average
      limits:
        - average does not describe distribution, hours, household income, or benefit eligibility

  firm_surplus:
    - id: walmart-fy2026-net-sales
      posture: observed
      source: source-walmart-fy2026-10k
      value: 706.413
      unit: billion dollars
    - id: walmart-fy2026-operating-income
      posture: observed
      source: source-walmart-fy2026-10k
      value: 29.825
      unit: billion dollars
    - id: walmart-fy2026-net-income-attributable
      posture: observed
      source: source-walmart-fy2026-10k
      value: 21.893
      unit: billion dollars

  executive_and_median_worker_compensation:
    - id: walmart-fy2026-ceo-total-compensation
      posture: observed
      source: source-walmart-2026-proxy
      value: 29240930
      unit: dollars
      seat: then-CEO Doug McMillon
    - id: walmart-fy2026-median-associate-total-compensation
      posture: observed
      source: source-walmart-2026-proxy
      value: 30520
      unit: dollars
      seat: proxy-defined median associate
    - id: walmart-fy2026-ceo-pay-ratio
      posture: observed
      source: source-walmart-2026-proxy
      value: 958
      unit: CEO total compensation to median associate total compensation
      limits:
        - pay ratio is distributional evidence, not a causal estimate of public-assistance use

  shareholder_return:
    - id: walmart-fy2026-dividends-paid
      posture: observed
      source: source-walmart-fy2026-10k
      value: 7.507
      unit: billion dollars
    - id: walmart-fy2026-share-repurchases
      posture: observed
      source: source-walmart-fy2026-10k
      value: 8.088
      unit: billion dollars
    - id: walmart-fy2026-total-dividends-plus-repurchases
      posture: derived_arithmetic
      source:
        - source-walmart-fy2026-10k
        - source-walmart-2026-proxy
      value: 15.595
      unit: billion dollars
      notes:
        - Consistent with Walmart proxy statement's rounded 15.6 billion dollars returned to shareholders.
      limits:
        - Dividends and buybacks are distinct mechanisms and should remain separately visible.
        - Buybacks are not cash distributions to every continuing shareholder.

  concentrated_ownership:
    - id: walmart-family-related-shareholding-2026-04-10
      posture: observed
      source: source-walmart-2026-proxy
      value: approximately 44
      unit: percent of outstanding Walmart shares held by Walton-family-related entities
      notes:
        - Walton Enterprises' 44.11 percent beneficial/voting figure includes shares held by Walton Family Holdings Trust under irrevocable proxy.
        - The trust's 6.44 percent dispositive share is therefore not additive to 44.11 percent.
      limits:
        - April 10 ownership is not the exact record-date ownership for every fiscal 2026 dividend payment.

accountability_trace:
  intentional_compensation_term_setting:
    posture: supported_inference
    state: true
    note: >-
      Walmart's compensation and benefit structure is an employer-managed set of terms. The current evidence does not yet reconstruct every internal wage-setting decision, role, algorithm, or market constraint, but compensation is not treated as an accidental consequence merely because harmful-endpoint motive is unknown.
  intended_gain_or_cost_reduction:
    posture: path_forward
    note: >-
      Compensation affects corporate labor cost and therefore can affect surplus, but the current evidence does not quantify the share of profit or owner return causally attributable to compensation levels associated with public-assistance incidence.
  harmful_endpoint_intent:
    posture: not_established
    note: >-
      No current source in this bundle establishes that Walmart intended workers to experience poverty, food insecurity, healthcare insecurity, or public-assistance eligibility.
  knowledge_state:
    posture: path_forward
    state: KNOWLEDGE_UNKNOWN
    note: >-
      The 2026 GAO report is a public notice surface. Publication does not prove which Walmart decision-makers actually received or reviewed it, and the earlier notice history remains to be reconstructed.
  capacity_to_know:
    posture: supported_inference
    level: high
    note: >-
      Walmart's scale, payroll and benefit administration, compensation reporting, public filings, and demonstrated ability to alter wages and benefits create substantial practical capacity to investigate workforce compensation and benefit-incidence patterns. This is not proof of actual knowledge.
  foreseeability:
    posture: path_forward
    note: >-
      Determine when public-assistance incidence among Walmart workers became sufficiently documented that continued reliance was reasonably foreseeable to relevant compensation decision-makers.
  capacity_to_correct:
    posture: supported_inference
    level: high
    note: >-
      Walmart has practical capacity to change compensation, benefits, scheduling, staffing policy, and capital allocation. This does not establish that a particular change would eliminate program eligibility or be costless.
  response_after_notice:
    posture: path_forward
    state: unknown
    note: >-
      Build an evidence-backed chronology of major notice events and Walmart wage, benefit, scheduling, lobbying, public-policy, and capital-allocation responses before assigning continued, mitigated, repaired, escalated, or refused-to-correct states.
  gain_or_insulation_after_notice:
    posture: path_forward
    note: >-
      Once notice dates are established, compare compensation changes with net income, dividends, repurchases, executive compensation, ownership returns, and public-support incidence over matched periods.

recomposition:
  supported_observation: >-
    In the same broad corporate system and near-adjacent measurement period, Walmart had thousands of working adult Medicaid or SNAP beneficiaries in selected state employer datasets, reported a 958-to-1 CEO-to-median-associate compensation ratio, generated 21.893 billion dollars of net income attributable to Walmart, returned about 15.6 billion dollars through dividends and share repurchases, and had roughly 44 percent of its shares held by Walton-family-related entities.
  interpretation_posture: path_forward
  interpretation: >-
    These facts establish a strongly unequal distributional circuit worth testing for labor-cost supplementation and upward recirculation. They do not by themselves establish the dollar amount of public assistance causally attributable to Walmart compensation, nor do they prove that a public-benefit dollar directly funded an executive payment, dividend, or buyback. The analysis must preserve those attribution limits while keeping every seat visible. It must also preserve the difference between intentionally set compensation terms, any intended gain or cost reduction, harmful-endpoint intent, knowledge/notice, and persistence after correction opportunities.

next_money_trace:
  - Recover national or larger-state employer-linked Medicaid/SNAP incidence where data permit.
  - Estimate program cost associated with Walmart-employed households without assuming causation from employment alone.
  - Model counterfactual employer compensation/benefit cost required to reduce public-assistance incidence.
  - Trace SNAP redemption at Walmart and public healthcare/pharmacy revenue received by Walmart-linked businesses.
  - Reconstruct fiscal-year dividend record-date ownership to estimate distributions by concentrated, institutional, employee, executive, and dispersed ownership seats.
  - Trace buyback participation and continuing-holder ownership effects separately from dividends.
  - Compare changes in ordinary-worker compensation, executive compensation, net income, and shareholder return over multiple years.
  - Build the historical notice ledger: government reports, public hearings, worker complaints, lawsuits, shareholder proposals, internal documents where public, corporate statements, and major media investigations concerning Walmart worker reliance on public benefits.
  - After notice is bounded, test whether compensation/benefit changes reduced incidence, whether the mechanism persisted, and what gain or cost saving remained.
  - Build a matched tax-and-public-cost ledger separating employer payroll taxes, worker payroll/income taxes, corporate income taxes, tax preferences/credits, and means-tested public costs; do not collapse these into one generic tax claim.

locks:
  - Decomposition must recompose.
  - Do not stop the trace at the legal public-benefit recipient.
  - Do not relabel the legal public benefit as a direct corporate payment.
  - Do not allow those two rules to cancel each other; the employer-incidence question remains open until measured.
  - Net income, dividends, buybacks, and appreciation are overlapping economic seats, not independent additive gains.
  - CEO pay ratio is not proof of causation, but it is part of the same distributional body and must not be omitted as irrelevant.
  - Ownership concentration is a terminal return operator and must remain in the money path.
  - Intentional compensation term-setting != harmful-endpoint intent.
  - Harmful-endpoint intent not established != compensation policy accidental.
  - Capacity to know != actual knowledge.
  - Public notice != proof of internal receipt by a particular decision-maker.
  - Continued conduct after credible notice, where correction capacity exists, is an accountability fact distinct from the original motive and should be traced rather than rhetorically assumed or erased.
