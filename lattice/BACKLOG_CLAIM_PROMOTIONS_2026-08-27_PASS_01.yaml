        posture: OBSERVED
        effects: [CONSTRAINT_RESISTANCE]
      - proposition: UN humanitarian reporting documents continuing settler attacks, displacement, demolitions, movement restrictions, arrests, and civilian exposure, with incident-level variation preserved.
        posture: OBSERVED_AND_REPORTED
        effects: [REALIZED_OUTCOME]
      - proposition: Israeli officials have condemned settler violence.
        posture: STATED_POSITION
        effects: [MOTIVE_LIMITING]
      - proposition: Official condemnation does not by itself defeat separate claims about protection failure, tolerated violence, differential enforcement, failed investigation, settlement policy, or impunity.
        posture: EVIDENCE_JURISDICTION_LOCK
        effects: [NON_RESPONSIVE, SCOPE_LIMITING]
    not_promoted:
      - every_settler_attack_is_directly_ordered_by_Israeli_state
    unresolved:
      - arrests_prosecutions_intervention_rates_and_response_times
      - enforcement_asymmetry
