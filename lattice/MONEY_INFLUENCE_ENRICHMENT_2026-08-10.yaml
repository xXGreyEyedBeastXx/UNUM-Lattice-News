causal_tests:
  money_to_control:
    sequence:
      - money_or_material_support
      - access_or_dependency
      - communicated_preference_or_known_interest
      - policy_or_editorial_choice
      - timing_and_counterfactual
      - alternative_explanations
      - evidence_of_coordination_or_quid_pro_quo
    rule: "Do not jump from first step to last."

  audience_to_media_capture:
    sequence:
      - audience_or_supporter_segment
      - revenue_or_algorithmic_dependence
      - engagement_reward
      - topic_selection
      - framing_or_certainty_shift
      - correction_behavior
    rule: "A creator can be audience-captured without any institutional donor."

  philanthropy_to_agenda_setting:
    sequence:
      - funder_priority
      - project_grant
      - staffing_and_duration
      - source_and_expert_ecology
      - topic_selection
      - editorial_output
    rule: "Agenda-setting can occur without direct sentence-level control."

blind_spots_after_second_pass:
  - id: gap-donor-access-calendar
    question: "We need event-level donor access: fundraiser hosts, private meetings, calls, emails, bundling, and staff contacts—not just dollar totals."
  - id: gap-independent-spending-beneficiary
    question: "Map which actors benefited from independent spending while preserving whether they legally coordinated with the spender."
  - id: gap-defense-procurement
    question: "Campaign finance may be smaller than procurement dependence; trace contracts, district jobs, board/revolving-door ties, and arms-transfer beneficiaries."
  - id: gap-dark-money-pass-through
    question: "Ordinary FEC candidate records miss nonprofit/pass-through influence and issue advertising."
  - id: gap-think-tank-source-laundering
    question: "A claim can appear independently in government and media while both source the same funded think tank/expert network."
  - id: gap-family-professional
    question: "Spouses, law firms, family businesses, foundations, and social networks can create access without a direct candidate donation."
  - id: gap-media-revenue
    question: "The current media nodes need ownership, sponsor, advertiser, subscription, Patreon, Super PAC, grant, and platform-monetization traces."
  - id: gap-guardian-editorial-authors
    question: "The Guardian audit still needs author-level editorial sampling and recurring expert/source-network mapping before normalization claims can be promoted."
  - id: gap-counterpressure
    question: "Map money and access pushing in the opposite direction too: ceasefire advocates, labor, Arab/Muslim donors, civil-liberties groups, antiwar veterans, and small-donor pressure."
  - id: gap-policy-preexistence
    question: "For every apparent donor-policy alignment, determine whether the actor held the policy before receiving relevant support."
  - id: gap-nonfinancial-coercion
    question: "Money is only one influence carrier; sanctions, kompromat, intelligence access, legal exposure, appointments, endorsements, media attacks, and security guarantees may dominate in some networks."

research_outage_note:
  status: "external_search_unavailable_during_refresh"
  note: >-
    Web search/direct retrieval returned repeated service failures during this pass.
    Relationships marked needs_recheck were previously identified in the conversation
    from FEC, Reuters, Axios, AP, Guardian, and organization-primary materials, but
    should be refreshed before promotion to reviewed/canonical status. No unrefreshed
    claim should be treated as newly independently verified in this file.

