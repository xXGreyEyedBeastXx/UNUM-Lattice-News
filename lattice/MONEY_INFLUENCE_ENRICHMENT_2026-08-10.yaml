authority: research_enrichment_not_verdict
parent_network: lattice/ACTOR_NETWORK_SEED_2026-08-10.yaml
purpose: >-
  Enrich the actor network by following money, access, support, and institutional
  dependency before assigning causal control. Money is a routing signal that exposes
  relationships worth tracing; it is not by itself proof of capture or quid pro quo.

method_lock:
  - "Follow money before ideology when a financial trace is available."
  - "Do not stop at direct campaign contributions."
  - "Separate donation, bundling, independent expenditure, lobbying, grant funding, advertising, contracts, ownership, debt, family wealth, and business ties."
  - "Separate access from influence, influence from control, control from corruption, and correlation from quid pro quo."
  - "Trace policy timing after money/access events when possible."
  - "A beneficiary may receive independent-expenditure support without directing it; keep coordination status explicit."
  - "Absence of money does not imply absence of ideological alignment, coercion, intelligence influence, or institutional capture."

status_vocabulary:
  documented: "Directly supported by records or strong reporting already identified in the research trace."
  supported: "Substantial evidence for relationship; causal effect still bounded."
  candidate: "Important route exposed but source-level trace incomplete."
  needs_recheck: "Previously identified in research, but current external retrieval failed and should be refreshed before promotion."
  unknown: "No sufficient evidence yet."

