locks:
  - Chain of command exists != every harm ordered from the top.
  - No recovered direct order != no superior responsibility.
  - Command allowance != direct command unless evidence supports both.
  - Institutionally distinct != personnel independent.
  - Personnel kinship != identical institution.
  - Hebrew != truth and English != lie by default.
  - Material audience divergence must be preserved when evidenced.
  - A single domestic-language statement != audience-differentiated framing without a comparison surface.
  - Self-investigation != independent adjudication.
  - Self-exoneration != debunking.
  - Repeated self-exoneration + external contradiction + weak consequences can lower institutional trust rationally.
  - ICC reasonable-grounds finding != conviction.
