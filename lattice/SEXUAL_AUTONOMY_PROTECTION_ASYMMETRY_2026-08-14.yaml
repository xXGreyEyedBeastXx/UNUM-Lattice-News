hypotheses_to_test:
  - id: H1-partisan-protection-asymmetry
    statement: >-
      Republican-governed systems may be more likely than Democratic-governed systems to preserve
      legal structures that reduce victim exit or increase protection for sexual offenders.
    status: OPEN_HYPOTHESIS
    required_discriminators:
      - state-year party trifecta/governor control
      - minimum marriage age and exceptions
      - marital exemptions to statutory-rape laws
      - rape/incest exceptions in abortion law
      - judicial-bypass and helper-liability rules
      - sexual-offense reporting/clearance/prosecution rates where comparable
      - sentencing distributions controlling for offense, age, criminal history, plea posture, race, wealth, and jurisdiction
      - clemency/pardon decisions involving sexual offenses
      - victim-service funding and institutional capacity
      - explicit lawmaker reasoning
    falsifiers:
      - no robust association after confounder controls
      - stronger association with nonpartisan variables such as region/religiosity/local elite status
      - comparable or worse victim-exit structures under Democratic control

  - id: H2-patriarchal-family-authority
    statement: >-
      Some reproductive and marriage policies may prioritize family hierarchy, pregnancy continuation,
      or marital regularization over the independent exit power of minors and assault survivors.
    status: SUPPORTED_IN_SOME_EXPLICIT_STATEMENTS_NOT_GENERALIZED

  - id: H3-elite-status-leniency
    statement: >-
      Local prestige, wealth, family networks, institutional affiliation, or perceived future potential
      may increase access to rehabilitative or lenient treatment after serious sexual-violence allegations.
    status: OPEN_HYPOTHESIS
    controls:
      - youthful-offender statutes
      - age at conduct
      - plea agreements
      - prior record
      - victim input
      - prosecutor recommendation
      - judge-specific sentencing baseline

  - id: H4-official-kinship-retaliation
    statement: >-
      Kinship becomes a protection mechanism when an official uses state power to impede or punish
      reporting/investigation of a relative's alleged sexual abuse.
    status: ADJUDICATED_EXISTENCE_IN_DURAN_CASE

cross_lattice_stitches:
  - target: lattice/PRAIRIELAND_ICE_DETENTION_EVIDENCE_LATTICE_2026-08-14.yaml
    relation: >-
      Both lattices examine who controls vulnerable bodies, complaint channels, evidence, and exit;
      do not infer sexual abuse at Prairieland from system-level recurrence without facility-specific evidence.
  - target: research/investigations/TRUMP_MASTER_TOPOLOGY_2026-08-12.md
    relation: >-
      Reproductive autonomy, immigration/border coercion, appointments, clemency, and oversight provide
      potential crossings, but Trump personal responsibility must be separately evidenced.

next_searches:
  - build state-year table of marriage age, statutory-rape marital exemptions, rape/incest abortion exceptions, and partisan control
  - identify Democratic and Republican officials who directly intervened to protect relatives/associates accused of sexual abuse
  - identify cases where officials refused such protection despite kinship or partisan alignment
  - compare youthful-offender/first-offender leniency in serious sexual-violence cases across class/race/local-status variables
  - audit victim-service and sex-trafficking enforcement capacity against immigration-enforcement reallocations
  - distinguish formal legal protections from practical ability of minors to obtain counsel, shelter, medical care, or judicial bypass
