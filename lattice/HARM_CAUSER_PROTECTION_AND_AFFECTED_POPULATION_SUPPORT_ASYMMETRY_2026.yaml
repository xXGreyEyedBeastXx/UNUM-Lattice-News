id: harm-causer-protection-and-affected-population-support-asymmetry-2026

scope: >-
  System model for tracing whether institutions, laws, capital structures, political coalitions, media frames, security systems,
  and accountability practices provide greater insulation, procedural forgiveness, resource access, or recovery capacity to actors
  who cause or materially contribute to harm than they provide support, remedy, safety, restitution, voice, or exit capacity to the
  populations bearing that harm. This is a cross-domain relation and must not be isolated into government, capital, geopolitics,
  criminal justice, humanitarian response, or culture as separate realities.

core_proposition: >-
  A society may produce an accountability asymmetry when the actor with greater power to cause harm also has greater access to
  legal defense, political influence, reputational repair, institutional deference, private resilience, and repeated opportunities
  to continue acting, while affected people face proof burdens, waiting periods, cost barriers, displacement, retaliation,
  disbelief, or inadequate material support.

