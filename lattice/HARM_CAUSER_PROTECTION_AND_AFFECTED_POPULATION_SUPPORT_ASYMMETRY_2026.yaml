support_side_discriminator: >-
  Do not measure accountability only by whether punishment occurred. Measure whether the harmed population received practical safety,
  food, shelter, healthcare, income continuity, legal assistance, restitution, relocation, ecological repair, political voice, and
  meaningful noncoercive exit. A system can punish a perpetrator symbolically while leaving the harmed population materially abandoned.

forgiveness_discriminator: >-
  Mercy, due process, rehabilitation, and correction are not themselves laundering. The asymmetry arises when procedural care,
  contextualization, second chances, resource access, or benefit of the doubt are distributed upward to powerful harm-causers while
  affected populations receive suspicion, austerity, coercion, abandonment, or impossible proof burdens.

