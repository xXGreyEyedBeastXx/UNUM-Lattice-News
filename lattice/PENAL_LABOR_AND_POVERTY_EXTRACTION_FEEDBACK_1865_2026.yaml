promoted_relations:
  - proposition: >-
      The Thirteenth Amendment contains a punishment exception permitting compelled labor after criminal conviction.
    posture: PRIMARY_CONSTITUTIONAL_FACT
  - proposition: >-
      Post-Reconstruction convict leasing used criminal-law enforcement and the punishment exception to create coerced labor systems that disproportionately captured Black people and generated government/private economic benefit.
    posture: STRONGLY_DOCUMENTED_HISTORICAL_MECHANISM
  - proposition: >-
      Contemporary federal prison labor remains extremely low-paid relative to ordinary labor markets: most institution jobs pay roughly 12 to 40 cents per hour and UNICOR jobs typically pay roughly 23 cents to 1.15 dollars per hour.
    posture: DOCUMENTED_CURRENT_FEDERAL_WAGE_EDGE
  - proposition: >-
      Low-paid or unpaid prison labor can weaken a person's ability to accumulate resources for reentry while incarceration and criminal records add barriers to housing and employment.
    posture: SUPPORTED_SYSTEM_MECHANISM_CASE_SPECIFIC_FOR_INDIVIDUAL_CAUSATION

