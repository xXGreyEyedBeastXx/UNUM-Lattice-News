intake_return_path: UNUM-Lattice-News-Intake/reviews/ICE_PROTECTED_ACCESS_POINTS_DUE_PROCESS_AND_HOME_ENTRY_2025_2026.yaml

scope: >-
  Document the movement of immigration-enforcement exposure into schools, immigration courts/hearings, homes,
  and other rights-access points, while keeping exact constitutional, statutory, criminal, and terrorism
  classifications claim-specific.

promoted_claims:
  - proposition: DHS deliberately rescinded the prior bright-line protected-areas policy in January 2025, increasing officer discretion to conduct enforcement in or near schools, churches, healthcare facilities and similar locations.
    posture: CONFIRMED_PRIMARY_DOCUMENT
    effects: [AUTHORITY_DELTA, DIRECTION, CAPACITY]

  - proposition: ICE enforcement has occurred immediately outside school environments, creating direct arrest exposure in front of children and families.
    posture: CONFIRMED_CASE_PATTERN_AT_PROXIMITY_EDGE
    effects: [REALIZED_OUTCOME, CAPACITY]
    scope_limit: Current durable record does not generalize this to routine classroom entry or systematic student targeting.

  - proposition: ICE carried out courthouse/hearing arrests after immigration proceedings, including after government-requested dismissals that could expose respondents to expedited-removal pathways.
    posture: MULTISOURCE_SUPPORTED
    effects: [REALIZED_OUTCOME, DIRECTION, CAPACITY]

  - proposition: Courts have constrained portions of this enforcement architecture, including a 2026 New York order limiting routine immigration-court arrests and a Fifth Circuit ruling requiring bond hearings for covered detention beyond 90 days.
    posture: ADJUDICATED_CONSTRAINT_RESISTANCE_AS_REPORTED
    effects: [CONSTRAINT_RESISTANCE, CLAIM_DEFEATING, ACCOUNTABILITY_DELTA]

  - proposition: More than 100 immigration judges were removed after the administration returned to office, reducing adjudicatory capacity while cases surged and prompting public independence/due-process concerns from UN human-rights experts.
    posture: CURRENTLY_REPORTED_INSTITUTIONAL_CHANGE
    effects: [CAPACITY, AUTHORITY_DELTA, RELIABILITY_MODIFYING]

  - proposition: Federal legal-services support serving about 20,000 unaccompanied migrant children expired in July 2026 without renewal, increasing exposure to immigration proceedings without legal assistance.
    posture: CURRENTLY_REPORTED_POLICY_OUTCOME
    effects: [CONSTRAINT_DELTA, REALIZED_OUTCOME, CAPACITY]

  - proposition: ICE adopted an internal policy authorizing forcible entry into a residence using an administrative I-205 warrant for a person with a final removal order, without a judicial home-entry warrant.
    posture: AUTHENTICATED_INTERNAL_POLICY
    effects: [AUTHORITY_DELTA, DIRECTION, CAPACITY]

  - proposition: The administrative-warrant home-entry authority was used in real operations and is under active constitutional challenge.
    posture: REALIZED_AND_LITIGATED
    effects: [REALIZED_OUTCOME, CONSTRAINT_RESISTANCE]

mechanism_state:
  classifier: PROTECTED_ACCESS_POINT_COERCION
  state: STRONGLY_SUPPORTED
  model:
