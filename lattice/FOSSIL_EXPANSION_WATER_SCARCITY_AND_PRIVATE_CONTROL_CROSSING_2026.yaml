scope: >-
  Durable cross-domain model linking evidenced fossil-fuel expansion, climate-amplified water scarcity, private water-rights accumulation,
  public policy, infrastructure finance, and population exposure. This relation does not presume that all fossil investors and water investors
  are the same actors or that water-rights acquisition is inherently wrongful. It preserves confirmed direct overlaps and keeps stronger
  coordination or scarcity-profiteering claims open until proven.

promoted_relations:
  - proposition: The U.S. federal government under President Donald Trump is actively expanding fossil-fuel extraction and support capacity through leasing, drilling access, LNG policy, and coal-support measures.
    posture: CONFIRMED_POLICY_DIRECTION

  - proposition: Major private actors are currently expanding fossil production and infrastructure, including ExxonMobil, Shell, Woodside, Enbridge, and private-capital partners KKR and Apollo; Norway is also pursuing continued Arctic and continental-shelf petroleum development.
    posture: CONFIRMED_ACTOR_SPECIFIC_EXPANSION

  - proposition: Private firms and investment structures are accumulating, consolidating, developing, or monetizing large water-rights and storage portfolios in the U.S. West, including Select Water Solutions/AV Farms, Gladstone Land, D.R. Horton/Vidler, Water Asset Management, and Greenstone/GSC Farm.
    posture: CONFIRMED_AS_ACTOR_SPECIFIC_WATER_CONTROL_EDGES

  - proposition: Select Water Solutions is a direct fossil-water crossing actor: its core operations support oil-and-gas production through water sourcing, recycling, disposal, and hydraulic-fracturing/completion chemistry while it also owns a large stake in AV Farms, formed to consolidate and expand a major Colorado water-rights/storage portfolio.
    posture: CONFIRMED_DIRECT_CROSSING

  - proposition: Colorado River and western U.S. water scarcity is severe and climate-amplified, with 2026 federal management imposing major Lower Basin delivery cuts beginning in 2027.
    posture: CONFIRMED_SYSTEM_STRESS

