interpretive_relation: >-
  A system-level feedback is supported in which fossil expansion contributes to climate forcing, climate forcing can worsen water scarcity,
  and water scarcity increases the strategic value of water control. What is not yet established is a single coordinated strategy in which
  fossil-finance actors intentionally create water scarcity in order to profit from water-rights accumulation. Actor-specific motive,
  coordination, and terminal-beneficiary claims require separate proof.

