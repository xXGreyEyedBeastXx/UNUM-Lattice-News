high_priority_questions:
  - Which financiers have material exposure to both fossil infrastructure and water-control assets?
  - Which water acquisitions are motivated by farming, development, industrial demand, municipal resilience, environmental use, or financial appreciation?
  - Which fossil, data-center, semiconductor, mining, and agricultural projects receive public water allocations or priority during shortage?
  - Who bears mandatory conservation, rate increases, land fallowing, well failure, or ecological loss when scarcity intensifies?
  - Do water-rights owners gain pricing or bargaining power as climate stress deepens?
  - Which actors knew of climate and water risks when expanding fossil or water-control positions, and what did they do after notice?
  - Where do public subsidies, leases, permits, tax policy, or eminent-domain powers increase private control of either energy or water infrastructure?

