  - id: durable-global-ocean-sst-record-2026-08-22
    intake_return_path: UNUM-Lattice-News-Intake/claims/global-ocean-sst-record-2026-08-22.yaml
    investigation_state: CONFIRMED_MEASUREMENT_LOCAL_EFFECTS_OPEN
    promoted_claims:
      - proposition: Copernicus reports extra-polar global-ocean daily average SST reached 21.1 C on August 22, 2026, exceeding the prior ERA5 daily record of 21.09 C from March 2024.
        posture: OBSERVED_DATASET_RECORD
        effects: [REALIZED_OUTCOME]
      - proposition: The ERA5 comparison used for this record extends back to 1979.
        posture: DATASET_SCOPE
        effects: [SCOPE_LIMITING]
      - proposition: Copernicus attributes the extreme warmth to developing strong El Nino conditions acting on long-term human-driven ocean warming.
        posture: SOURCE_SUPPORTED_ATTRIBUTION
        effects: [DIRECTION]
    not_promoted:
      - any_specific_fishery_storm_health_displacement_or_local_ecosystem_harm_from_global_average_alone
    open_edges:
      - regional_marine_heatwaves
      - fisheries_and_coral_effects
      - coastal_and_livelihood_effects

