scope: >-
  Durable model for analyzing Epstein-related accountability failures as a distributed network of protection,
  access, intervention, institutional attrition, and information control rather than as isolated events beginning from zero.

promoted_relations:
  - proposition: Repeated Epstein accountability failures must be analyzed with inherited historical state rather than reset as independent events.
    posture: METHODOLOGICAL_LOCK
    mechanism: EVENT_ZEROING

  - proposition: The 2007 federal non-prosecution process involved an unusually powerful defense network with substantial prior government service and professional overlap with the prosecutorial environment.
    posture: DOCUMENTED_NETWORK_FIELD
    note: The network field is relevant to access and bargaining-power analysis but does not itself prove corrupt influence.

  - proposition: Alexander Acosta, Jay Lefkowitz and Kenneth Starr had documented Kirkland & Ellis professional overlap before or during the Epstein NPA period; Acosta later testified to prior professional contact with both Starr and Lefkowitz.
    posture: DOCUMENTED_PROFESSIONAL_NETWORK_EDGE
    effects: [ACCESS, RELIABILITY_MODIFYING]

  - proposition: Epstein's federal NPA had a documented protection effect extending beyond Epstein to named and unnamed potential co-conspirators.
    posture: DOCUMENTED_PROTECTION_EFFECT
    note: DOJ OPR did not establish that the clause was adopted to protect political, celebrity or other influential associates.

  - proposition: A senior JPMorgan executive later admitted sharing confidential and market-sensitive bank information with Epstein, including internal Federal Reserve communications during the 2008 financial crisis.
    posture: DOCUMENTED_INFORMATION_ACCESS_EDGE
    effects: [ACCESS, CAPACITY]
    scope_lock: This does not establish Federal Reserve institutional knowledge, approval, or protection of Epstein.

  - proposition: The Powell-to-Heritage/Federalist/modern conservative legal-policy ecology is a documented macro power network that may be cross-referenced when named people or institutions intersect an Epstein protection event.
    posture: CONTEXTUAL_FIELD_RELATION
    scope_lock: No direct causal Epstein-protection edge from Powell, Heritage, or the Federalist Society is established merely by macro-network overlap.

analysis_model:
  for_each_protection_event:
    - identify authority seat
    - identify documented evidence available before decision
    - identify who had access to decisionmaker
    - recover direct contacts and interventions
    - recover indirect professional, firm, appointment, donor, financial, and institutional bridges
    - compare decision before and after intervention
    - identify beneficiary set and victim/public cost
    - test ordinary-process comparator
    - preserve competing explanations and resistance nodes
    - update inherited network state rather than resetting to zero

causal_ladder:
  - ADJACENCY
  - ACCESS
  - INTERVENTION
  - TEMPORAL_UPDATE
  - MATERIAL_EFFECT
  - CAUSAL_SUPPORT

core_locks:
  - prior_pattern_does_not_prove_new_event
  - new_event_does_not_begin_from_empty_prior
  - direct_personal_connection_is_not_required_for_indirect_network_edge_to_be_relevant
  - indirect_edge_is_not_proof_of_influence
  - influence_is_not_proof_of_corrupt_motive
  - distributed_protection_pattern_does_not_require_one_mastermind
  - institutional_membership_is_not_collective_culpability
  - protection_effect_must_be_split_from_protection_intent
  - event_zeroing_is_prohibited

