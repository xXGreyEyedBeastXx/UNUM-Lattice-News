schema: unum-lattice-news/evidence-lattice/v0.1
id: israel-palestine-words-conduct-territorial-control-2026-08-17
title: Israel / Palestine — Words, Conduct, Civilian Harm, Settlement-Displacement and Territorial Control
status: active_investigative_lattice
as_of: 2026-08-17
verdict: none
source_bundle: sources/source-israel-palestine-state-conduct-and-territorial-control-2023-2026.yaml
methodology:
  - docs/STATED_JUSTIFICATION_VS_OBSERVED_CONDUCT_v0_1.md
  - docs/EXTENSIBLE_EVIDENCE_GRAMMAR_v0_1.md
purpose: >-
  Compare Israeli state and security-force language with policy, local orders, observed conduct, effects,
  external fact findings, legal findings and territorial outcomes. Preserve Gaza, West Bank, Lebanon and Syria
  as distinct theaters while testing whether recurring security/buffer/settlement practices produce a common
  transformation toward civilian displacement, reduced returnability and durable Israeli territorial control.
  Preserve Hamas and other Palestinian armed-group crimes separately; they are not offsets for Israeli conduct.

root_locks:
  - WORDS != ORDERS != CONDUCT != EFFECT != INTENT
  - SECURITY_JUSTIFICATION != LEGALITY
  - DENIAL != DEBUNKING
  - HAMAS_TARGET_PRESENT != CIVILIANS_NOT_TARGETED
  - MILITARY_TARGET_PRESENT != ATTACK_LAWFUL
  - EVACUATION_ORDER != VOLUNTARY_DEPARTURE
  - BUFFER_OR_SECURITY_ZONE != TEMPORARY_BY_DEFINITION
  - SETTLER != STATE_EMPLOYEE_BY_DEFAULT
  - SETTLER_PRIVATE_STATUS != STATE_INDEPENDENCE_WHEN_STATE_RESPONSIBILITY_OR_SHARED_OBJECTIVES_ARE_EVIDENCED
  - DIFFERENT_THEATERS != CAUSALLY_UNRELATED_PRACTICES
  - CROSS_THEATER_PATTERN != ONE_COMMAND_STRUCTURE
  - CIVILIAN_DEATH != DELIBERATE_TARGETING_BY_ITSELF
  - DELIBERATE_TARGETING_FINDING != CLAIM_THAT_EVERY_CIVILIAN_DEATH_WAS_INTENDED
  - COMMISSION_FINDING != FINAL_CRIMINAL_CONVICTION
  - COMMISSION_GENOCIDE_FINDING != FINAL_ICJ_MERITS_JUDGMENT

grammar_extensions:
  - term: STATED_JUSTIFICATION
    parent: stated
    meaning: actor's declared security, military, legal or moral reason
  - term: FORMAL_POLICY
    parent: observed
    meaning: enacted policy, executive direction, official administrative action or formal rule
  - term: LOCAL_ORDER
    parent: observed
    meaning: documented unit, commander, facility, checkpoint or control-zone instruction
  - term: OPERATING_PROCEDURE
    parent: supported
    meaning: practice found to be formal or de facto procedure
  - term: SYSTEMATIC_PATTERN
    parent: supported
    meaning: repeated conduct established across sufficient incidents/locations/time
  - term: LEADERSHIP_ENCOURAGEMENT
    parent: supported
    meaning: evidence that leadership implicitly encouraged a conduct pattern
  - term: LEADERSHIP_ORDER
    parent: supported
    meaning: evidence of explicit leadership direction for the conduct
  - term: EXTERNAL_FACT_FINDING
    parent: observed
    meaning: finding by competent international or independent investigative body
  - term: LEGAL_ADVISORY_FINDING
    parent: adjudicated
    meaning: authoritative advisory legal determination distinct from criminal judgment
  - term: DELIBERATE_TARGETING_FINDING
    parent: EXTERNAL_FACT_FINDING
    meaning: competent finding that protected civilians or a protected civilian class were deliberately targeted
  - term: COLLECTIVE_PUNISHMENT_FINDING
    parent: EXTERNAL_FACT_FINDING
    meaning: competent finding that prohibited collective punishment occurred
  - term: DOCUMENTED_EFFECT
    parent: observed
    meaning: evidenced death, injury, deprivation, destruction, displacement, access loss or similar consequence
  - term: TERRITORIAL_EFFECT
    parent: DOCUMENTED_EFFECT
    meaning: evidenced change in control, settlement, access, boundary practice, displacement or returnability
  - term: DENIAL_OR_COUNTERPOSITION
    parent: disputed
    meaning: actor's denial, alternative account or legal position preserved without automatic priority
  - term: CROSS_THEATER_ANALOGUE
    parent: supported
    meaning: similar transformation in a distinct theater without automatic identity, legal equivalence or common command

nodes:
  authorities:
    - id: state-of-israel
      ref: nodes/institutions/state-of-israel.yaml
      type: sovereign_state
    - id: israeli-security-forces
